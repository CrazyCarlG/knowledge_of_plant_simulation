$CustomAttributes:
-
 Name: Init
 ID: 1
 DataType: method
 Value: |+1
  is
  	CSC : object;
  do
  	local CT:object := self.~; -- cross transfer
  	CT.ready4Loading := false;
  	
  	CSC := .MUs.Transporter.create(CT, 2); -- cross-sliding car
  	CSC.backwards := TRUE;
  	CSC.stopped := false;
  end;

 UsingNewSyntax: false
 ShowInTooltip: false
-
 Name: unloadPart
 ID: 2
 DataType: method
 Value: |+1
  -- exit control
  is
  	PartDistination, Part : object;
  do
  	@.stopped := true; -- stop the CSC
  	PartDistination := ?.succ;
  	Part := @.cont;
  	if Part.move(PartDistination,1) then
  		@.backwards := true;
  		@.stopped := false;
  	else
  		PartDistination.waitingCarrier := Part;
  	end;
  end;

 UsingNewSyntax: false
 ShowInTooltip: false
-
 Name: loadPart
 ID: 3
 DataType: method
 Value: |+1
  -- backwards exit control
  is
  	PartLocation,Part : object;
  do
  	@.stopped := true;
  	?.ready4Loading := true;
  	PartLocation := ?.pred;
  	if PartLocation.numMU > 0 then
  		Part := PartLocation.cont; -- next MU that exits
  		if Part.finished then
  			Part.move(@); -- load the part on the cross-sliding car
  			@.backwards := false;
  			@.stopped := false;
  			?.ready4Loading := false;
  		end;
  	end;
  end;

 UsingNewSyntax: false
 ShowInTooltip: false
-
 Name: ready4Loading
 ID: 4
 DataType: boolean
 Value: true
 ShowInTooltip: false
InheritEntranceExitLockedOnReset: false
$Failures:
-
 Name: Failure
 ID: 1
 Active: true
 Mode: SimulationTime
 AvailabilityOn: true
 Start: 0
 Stop: 0
 Interval: 0
 Duration: 0
