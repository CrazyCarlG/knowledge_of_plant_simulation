 Name: transfer2test
 ID: 1
 DataType: method
 Value: |+1
  is
  do
  	if z_uniform(1,0,100) < 40 then -- 40 % will be tested
  		local CT:object := ?.succ(2); -- Cross transfer
  		if CT.ready4Loading then -- custom attribute of the CSC
  			local CSC:object := CT.cont; -- cross-cliding car
  			@.move(CSC); -- load
  			CT.ready4Loading := false;
  			CSC.backwards := false;
  			CSC.stopped := false;
  		else
  			@.stopped := true;
  		end;
  	else
  		@.move(1);	
  	end;
  	
  end;

