 Method Tasks: 
 creates the TransferStationDialog
 _________________________________________________________________________________
 Parameters	: 
 ReturnValues: none
 
 Called By	: open control of the Transferstation
 Calls		: 
 
 Author		: Karola Mock, Tecnomatix
 Date		: 01.09.2004
 
 _________________________________________________________________________________
 History:
 02.05.2005  KM	translate and init dialog before opendialog
 23.08.2005  KM	set OpenedDialog first to avoid opening more than one dialog
 09.09.2010	KM	strg + dblclick opens object itself
 29.08.2013	KM	dblclick opens dialog again if already open
 21.07.2017  KM  use duplicate instead of createObject
 
 ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
 var newDialog : object
 
 if (getAsyncKeyState(17) < 0) 
 	?.openDialog
 else
 	if ?.OpenedDialog = void 
 		newDialog := rootFolder.internal.Dialog.TransferStationDialog.duplicate(rootFolder.internal.Dialog)
 		?.OpenedDialog := newDialog
 		newDialog.openedBy := ?
 		newDialog.label := to_str(?)
 		newDialog.dialogTranslate
 		newDialog.dialogInit
 		newDialog.open
 	else
 		?.OpenedDialog.open
 	end
 end
