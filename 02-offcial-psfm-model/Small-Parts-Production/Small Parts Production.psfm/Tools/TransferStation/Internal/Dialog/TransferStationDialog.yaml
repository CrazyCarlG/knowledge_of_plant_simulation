 Name: dialogInit
 ID: 5
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  init of the TransferStationDialog.
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	:
  Calls		: getSensorPosition
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  04.04.2005  KM	init sensorpos with the right unit
  21.06.2005  KM	Time-format
  27.06.2005  KM	AlwaysStopTarget only active for load/reload
  31.01.2006  KM	user control for line and track
  15.02.2006  KM  Nw2Way allowed
  03.03.2006  KM  change of lane not allowed for inherited sensors
  18.05.2006  KM  blocksize > 1 only allowed for parallelproc
  21.08.2006  KM  checkboxes for behavior of parts and targets for failure
  22.09.2006  KM  allow part or targetstation in other frame than the transferStation
  26.10.2012  KM  stream no longer used in version 11
  12.02.2013  KM  stream removed
  04.04.2013  KM  setText -> setCaption
  14.01.2016  KM	use always new format of time_to_str (version removed)
  12.04.2016  KM	use new syntax in executeSilent
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var callingObj : object
  var dialog : object
  var text : string
  var complete : boolean
  var i,r : integer
  var act : string
  var ctrl,str : string
  var pos1 : length
  var typeP, typeT : integer
  var enable : boolean
  
  dialog := self.~
  callingObj := dialog.openedBy
  if callingObj /= void
  	dialog.setCaption("Name",callingObj.name)
  	dialog.setCaption("Label",callingObj.label)
  
  	dialog.setCheckbox("FailedCheck",callingObj.failed)
  	if callingObj.unplanned
  		dialog.setIndex("ShiftList",2)
  	elseif callingObj.pause
  		dialog.setIndex("ShiftList",3)
  	else
  		dialog.setIndex("ShiftList",1)
  	end
  
  --		Tab Attributes
  	dialog.setCheckbox("Load",not callingObj.unloadPartcontainer and callingObj.TargetIsContainer)
  	dialog.setCheckbox("Unload",callingObj.unloadPartcontainer and not callingObj.TargetIsContainer)
  	dialog.setCheckbox("Parttransfer",not callingObj.unloadPartcontainer and not callingObj.TargetIsContainer)
  	dialog.setCheckbox("Transfer",callingObj.unloadPartcontainer and callingObj.TargetIsContainer)
  
  	dialog.setCaption("PartObject",to_str(callingObj.PartStation))
  	dialog.setCaption("UserPartExitCtrl",callingObj.UserPartExitCtrl)
  
  	typeP := callingObj.getInternalClassType(callingObj.PartStation)
  	enable := false
  	if typeP > 0
  		if callingObj.checkSensorID(1,makePathRelative(callingObj, callingObj.PartStation))
  			pos1 := callingObj.getSensorPosition(1)
  			dialog.setCaption("SensorPos1",to_str(pos1))
  			if typeP = 3
  				dialog.setIndex("PLanes",callingObj.PartSensorLane)
  				enable := not callingObj.getSensorOrigin(1)
  			end
  		end
  	end
  	dialog.setSensitive("SensorPos1Text",typeP > 0)
  	dialog.setSensitive("SensorPos1",typeP > 0)
  	dialog.setSensitive("PLanes",enable)
  
  	dialog.setCaption("TargetObject",to_str(callingObj.TargetStation))
  	dialog.setCaption("UserTargetExitCtrl",callingObj.UserTargetExitCtrl)
  
  	typeT := callingObj.getInternalClassType(callingObj.TargetStation)
  	enable := false
  	if typeT > 0
  		if callingObj.checkSensorID(2,makePathRelative(callingObj, callingObj.TargetStation))
  			pos1 := callingObj.getSensorPosition(2)
  			dialog.setCaption("SensorPos2",to_str(pos1))
  			if typeT = 3
  				dialog.setIndex("TLanes",callingObj.TargetSensorLane)
  				enable := not callingObj.getSensorOrigin(2)
  			end
  		end
  	end
  	dialog.setSensitive("SensorPos2Text",typeT > 0)
  	dialog.setSensitive("SensorPos2",typeT > 0)
  	dialog.setSensitive("TLanes",enable)
  	dialog.setSensitive("UserTargetExitCtrlText",typeT > 0 or callingObj.TargetIsContainer)
  	dialog.setSensitive("UserTargetExitCtrl",typeT > 0 or callingObj.TargetIsContainer)
  	dialog.setSensitive("TExitSelect",typeT > 0 or callingObj.TargetIsContainer)
  
  --		Tab Times
  	text := callingObj.procTime.Type
  	if text = "Const" or text = "Konst"
  		str := time_to_str(callingObj.procTime,true)
  		dialog.setCaption("WorkingTime", str)
  	else
  		text := strIncl(", ",text,strlen(text)+1)
  		text := strIncl(callingObj.procTime.getAttr,text,strlen(text)+1)
  		dialog.setCaption("WorkingTime", text)
  		dialog.setSensitive("WorkingTimeText",false)
  		dialog.setSensitive("WorkingTime",false)
  		dialog.setSensitive("WUnit",false)
  	end
  	text := callingObj.recoveryTime.Type
  	if text = "Const" or text = "Konst"
  		str := time_to_str(callingObj.recoveryTime,true)
  		dialog.setCaption("RecoveryTime", str)
  	else
  		text := strIncl(", ",text,strlen(text)+1)
  		text := strIncl(callingObj.recoveryTime.getAttr,text,strlen(text)+1)
  		dialog.setCaption("RecoveryTime", text)
  		dialog.setSensitive("RecoveryTimeText",false)
   			dialog.setSensitive("RecoveryTime",false)
   			dialog.setSensitive("RUnit",false)
      	end
  
  --		Tab Availability
  	r := executeSilent("param ti:object -> integer; var t : real := ti.availability; return 1",callingObj)
  	if r = 1
  		dialog.AvailActive := true
  		dialog.setCaption("AvailCheck","")
  		dialog.setCaption("AvailPercent", to_str(callingObj.availability))
  		str := time_to_str(callingObj.MTTR,true)
  		dialog.setCaption("MTTR", str)
  	else
  		dialog.AvailActive := false
  		dialog.setSensitive("Avail", false)
  		dialog.setSensitive("AvailPercent", false)
  		dialog.setSensitive("Percent", false)
  		dialog.setSensitive("MTTR-Text", false)
  		dialog.setSensitive("MTTR", false)
  		dialog.setSensitive("MTTRunit", false)
  	end
  
  --		Tab Advanced Attributes
  	dialog.setCaption("Partnumber",to_str(callingObj.Partnumber))
  	complete := (callingObj.partnumber = -1)
  	dialog.setCheckbox("Complete",complete)
  	dialog.setSensitive("Partnumber",not complete)
  	dialog.setCaption("blocksize",to_str(callingObj.Blocksize))
  	enable := callingObj.unloadPartcontainer or callingObj.PartStation = void or
  			  callingObj.PartStation.internalClassType = "ParallelStation"
  	dialog.setSensitive("blocksize",enable)
  
  	dialog.setCheckbox("specificUnload",callingObj.TypeSpecific)
  	dialog.setSensitive("OpenUnloadtable", callingObj.TypeSpecific)
  
  	dialog.setCheckbox("homogeneousTarget",callingObj.HomogeneousTarget)
  	dialog.setSensitive("homogeneousTarget", callingObj.TargetIsContainer)
  
  	dialog.setCheckbox("alwaysStopTarget",callingObj.AlwaysStopTarget)
  	dialog.setSensitive("alwaysStopTarget", callingObj.TargetIsContainer)
  
  	dialog.setCheckbox("stopPartContainer",callingObj.StopPartsForFailure)
  	dialog.setSensitive("stopPartContainer", callingObj.unloadPartcontainer)
  
  	dialog.setCheckbox("stopTargetContainer",callingObj.StopTargetsForFailure)
  	dialog.setSensitive("stopTargetContainer", callingObj.TargetIsContainer)
  
  	-- Tab Advanced
  	dialog.setCaption("IDP","ID "+to_str(callingObj.PartSensorID))
  	if typeP > 1
  		if callingObj.checkSensorID(1,makePathRelative(callingObj, callingObj.PartStation))
  			r := callingObj.getSensorActivate(1)
  		else
  			r := 1
  		end
  		dialog.setIndex("ActivateP",r)
  	end
  	dialog.setSensitive("PartSensor",typeP > 1)
  	dialog.setSensitive("IDP",typeP > 1)
  	dialog.setSensitive("ActivateTextP",typeP > 1)
  	dialog.setSensitive("ActivateP",typeP > 1)
  
  	dialog.setCaption("IDT","ID "+to_str(callingObj.TargetSensorID))
  	if typeT > 1
  		if callingObj.checkSensorID(2,makePathRelative(callingObj, callingObj.TargetStation))
  			r := callingObj.getSensorActivate(2)
  		else
  			r := 1
  		end
  		dialog.setIndex("ActivateT",r)
  	end
  	dialog.setSensitive("Targetsensor",typeT > 1)
  	dialog.setSensitive("IDT",typeT > 1)
  	dialog.setSensitive("ActivateTextT",typeT > 1)
  	dialog.setSensitive("ActivateT",typeT > 1)
  
  	ctrl := callingObj.UserCtrl
  	str := strCopy(ctrl,1,strlen(callingObj.name))
  	if str ~= callingObj.name
  		ctrl := strOmit(ctrl,1,strlen(callingObj.name))
  		ctrl := strIncl("self",ctrl,1)
  	end
  	dialog.setCaption("UserCtrl",ctrl)
  
  	-- Tab Statistics
  	dialog.setCaption("StatNumIn",to_str(callingObj.statNumIn))
  	callingObj.Status.getStatisticsTable(callingObj.StatusTable)
  	for i := 1 to callingObj.StatusTable.ydim
  		text := callingObj.StatusTable[1,i]
  		act := to_str(round(callingObj.StatusTable[5,i],2))+ " %"
  		switch text
  		case "waiting"
  			dialog.setCaption("WaitingPerc",act)
  		case "waiting_for_parts"
  			dialog.setCaption("WaitingForPartsPerc",act)
  		case "waiting_for_target"
  			dialog.setCaption("WaitingForTargetPerc",act)
  		case "paused"
  			dialog.setCaption("PausedPerc",act)
  		case "unplanned"
  			dialog.setCaption("UnplannedPerc",act)
  		case "working"
  			dialog.setCaption("WorkingPerc",act)
  		case "blocked"
  			dialog.setCaption("BlockedPerc",act)
  		case "failed"
  			dialog.setCaption("FailedPerc",act)
  		end
  	next
  end
 ShowInTooltip: false
-
 Name: name_to_obj
 ID: 6
 DataType: method
 Value: |+1
  param name : string -> object
  
  var absPath : string
  
  	absPath := to_str(self.~.openedBy.~)
  
  if existsObject(name) 
  	return str_to_obj(name)
  else
  	name := strIncl(".",name,1)
  	name := strIncl(absPath,name,1)
  	if existsObject(name) 
  		return str_to_obj(name)
  	else
  		return void
  	end
  end
 ShowInTooltip: false
