 Name: callback
 ID: 1
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  callback of the TransferStationDialog
  _________________________________________________________________________________
  Parameters	:
  ReturnValues: none
  
  Called By	:
  Calls		:
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  02.05.2005  KM	translate and init dialog before opendialog
  27.06.2005  KM	AlwaysStopTarget only active for load/reload
  08.07.2005  KM	Info in Helpmenu opens InfoDialog
  08.07.2005  KM	Parameter of checkStationClass
  08.07.2005  KM	UpdateClassLibrary
  23.08.2005  KM	UpdateClassLibrary disabled
  31.01.2006  KM	User control for line and track
  15.02.2006  KM	Nw2Way allowed
  21.03.2006  KM  Parameter of checkStationClass, don't allow TransferStation
  21.03.2006  KM  don't use PartExitControl or TargetExitControl as UserControl, if
  station was selected again
  03.04.2006  KM	Tools-menu with update transferstation
  18.05.2006  KM  blocksize > 1 only allowed for parallelproc
  21.08.2006  KM  checkboxes for behavior of parts and targets for failure
  27.09.2006  KM  allow part or targetstation in other frame than the transferStation
  25.09.2007  KM  Pfad für Tools-Directory und Hilfe
  26.09.2007  KM  Pfad für Hilfe-kapitel
  10.10.2007  PS  Localization
  12.09.2008  KM  opening of Aboutbox changed
  12.11.2008  KM  Update ClassLibrary removed
  27.10.2011  KM  About menu removed
  04.04.2013  KM  setText -> setCaption
  10.01.2020	PS	Treatment of version 15.2 and newer of the menu "Help on Object"
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param action : string
  
  var dialog : object
  var callingObj : object
  var checked : boolean
  var name : string
  var station : object
  var oldexitctrl, str : string
  var type : integer
  var dlg : object
  var enable : boolean
  
  dialog := self.~
  callingObj := dialog.openedBy
  if callingObj = void
  	return
  end
  
  switch action
  /* --------------------------------------------------- */
  case "Apply"
  	dialog.dialogApply
  /* --------------------------------------------------- */
  case "Close"
  	callingObj.OpenedDialog := void
  	dialog.deleteObject
  /* --------------------------------------------------- */
  -- Menu Navigate
  case "Location"
  	callingObj.~.openDialog
  /* --------------------------------------------------- */
  -- Menu View
  case "Refresh"
  	dialog.dialogInit
  /* --------------------------------------------------- */
  -- Menu Help
  case "Contents"
  	HTMLHelp("")
  case "Index"
  	HTMLHelp("","")
  case "HelpOnObj"
  	if ApplicationVersion < 15002000
  		if UserInterfaceLanguage = 0
  			HTMLHelp(callingObj.HelpOnObjectDEU)
  		else
  			HTMLHelp(callingObj.HelpOnObjectENU)
  		end
  	else
  		HTMLHelp(callingObj.HelpOnObjectENU)
  	end
  /* --------------------------------------------------- */
  -- Tab Attributes
  case "Load"
  	dialog.setSensitive("homogeneousTarget", dialog.getCheckbox("Load"))
  	dialog.setSensitive("alwaysStopTarget", dialog.getCheckbox("Load"))
  	dialog.setSensitive("stopPartContainer", not dialog.getCheckbox("Load"))
  	dialog.setSensitive("stopTargetContainer", dialog.getCheckbox("Load"))
  	dialog.callback("PartObject")
  	dialog.callback("TargetObject")
  case "Unload"
  	dialog.setSensitive("homogeneousTarget", not dialog.getCheckbox("Unload"))
  	dialog.setSensitive("alwaysStopTarget", not dialog.getCheckbox("Unload"))
  	dialog.setSensitive("stopPartContainer", dialog.getCheckbox("Unload"))
  	dialog.setSensitive("stopTargetContainer", not dialog.getCheckbox("Unload"))
  	dialog.callback("TargetObject")
  case "Transfer"
  	dialog.setSensitive("homogeneousTarget", dialog.getCheckbox("Transfer"))
  	dialog.setSensitive("alwaysStopTarget", dialog.getCheckbox("Transfer"))
  	dialog.setSensitive("stopPartContainer", dialog.getCheckbox("Transfer"))
  	dialog.setSensitive("stopTargetContainer", dialog.getCheckbox("Transfer"))
  	dialog.callback("TargetObject")
  case "Parttransfer"
  	dialog.setSensitive("homogeneousTarget", not dialog.getCheckbox("Parttransfer"))
  	dialog.setSensitive("alwaysStopTarget", not dialog.getCheckbox("Parttransfer"))
  	dialog.setSensitive("stopPartContainer", not dialog.getCheckbox("Parttransfer"))
  	dialog.setSensitive("stopTargetContainer", not dialog.getCheckbox("Parttransfer"))
  	dialog.callback("PartObject")
  	dialog.callback("TargetObject")
  
  case "Pselect"
  	if (dialog.getCheckbox("Load") or dialog.getCheckbox("Parttransfer")) and
  		str_to_num(dialog.getValue("blocksize")) > 1
  		str := "Machine"
  	else
  		str := ":MatCarrier"
  	end
  	name := openObjectSelectBox(str,callingObj)
  	if name /= ""
  		station := dialog.name_to_obj(name)
  		if callingObj.checkStationClass(station,1)
  			dialog.setCaption("PartObject",name)
  			dialog.callback("PartObject")
  		else
  			callingObj.errorMessage(17,1)
  		end
  	end
  case "PartObject"
  	name := dialog.getValue("PartObject")
  	station := dialog.name_to_obj(name)
  	type := callingObj.getInternalClassType(station)
  	if type = 0
  		oldexitctrl := to_str(station.exitCtrl)
  		if oldexitctrl ~= makePathRelative(callingObj, station) + ".PartExitControl"
  
  		elseif oldexitctrl ~= "VOID"
  			dialog.setCaption("UserPartExitCtrl", "")
  		else
  			str := strCopy(oldexitctrl,1,5)
  			if str ~= "self."
  				oldexitctrl := strOmit(oldexitctrl,1,4)
  				oldexitctrl := strIncl(to_str(station),oldexitctrl,1)
  			else
  				oldexitctrl := strIncl(to_str(station.~)+".",oldexitctrl,1)
  			end
  			dialog.setCaption("UserPartExitCtrl", makePathRelative(oldexitctrl,callingObj.~))
  		end
  	end
  	dialog.setSensitive("SensorPos1Text",type > 0)
  	dialog.setSensitive("SensorPos1",type > 0)
  	dialog.setSensitive("PLanes",type =3)
  	dialog.setSensitive("PartSensor",type > 1)
  	dialog.setSensitive("IDP",type > 1)
  	dialog.setSensitive("ActivateTextP",type > 1)
  	dialog.setSensitive("ActivateP",type > 1)
  	enable := dialog.getCheckbox("Unload") or dialog.getCheckbox("Transfer") or
  	station = void or station.internalClassType = "ParallelStation"
  	if not enable
  		dialog.setCaption("blocksize","1")
  	end
  	dialog.setSensitive("blocksize",enable)
  
  case "Tselect"
  	name := openObjectSelectBox(":MatCarrier",callingObj)
  	if name /= ""
  		station := dialog.name_to_obj(name)
  		if callingObj.checkStationClass(station,2)
  			dialog.setCaption("TargetObject",name)
  			dialog.callback("TargetObject")
  		else
  			callingObj.errorMessage(17,1)
  		end
  	end
  case "TargetObject"
  	name := dialog.getValue("TargetObject")
  	station := dialog.name_to_obj(name)
  	type := callingObj.getInternalClassType(station)
  	if type = 0
  		if dialog.getCheckbox("Load") or dialog.getCheckbox("Transfer")
  			oldexitctrl := to_str(station.exitCtrl)
  			if oldexitctrl ~= makePathRelative(callingObj, station) + ".TargetExitControl"
  
  			elseif oldexitctrl ~= "VOID"
  				dialog.setCaption("UserTargetExitCtrl", "")
  			else
  				str := strCopy(oldexitctrl,1,5)
  				if str ~= "self."
  					oldexitctrl := strOmit(oldexitctrl,1,4)
  					oldexitctrl := strIncl(to_str(station),oldexitctrl,1)
  				else
  					oldexitctrl := strIncl(to_str(station.~)+".",oldexitctrl,1)
  				end
  				dialog.setCaption("UserTargetExitCtrl", makePathRelative(oldexitctrl,callingObj.~))
  			end
  		end
  	end
  	dialog.setSensitive("SensorPos2Text",type > 0)
  	dialog.setSensitive("SensorPos2",type > 0)
  	dialog.setSensitive("TLanes",type =3)
  	dialog.setSensitive("UserTargetExitCtrlText",type > 0 or (dialog.getCheckbox("Load") or dialog.getCheckbox("Transfer")))
  	dialog.setSensitive("UserTargetExitCtrl",type > 0 or (dialog.getCheckbox("Load") or dialog.getCheckbox("Transfer")))
  	dialog.setSensitive("TExitSelect",type > 0 or (dialog.getCheckbox("Load") or dialog.getCheckbox("Transfer")))
  	dialog.setSensitive("Targetsensor",type > 1)
  	dialog.setSensitive("IDT",type > 1)
  	dialog.setSensitive("ActivateTextT",type > 1)
  	dialog.setSensitive("ActivateT",type > 1)
  
  -- Tab Advanced Attributes
  case "CompleteLoadUnload"
  	checked := dialog.getCheckbox("Complete")
  	dialog.setSensitive("Partnumber", not checked)
  	if checked
  		dialog.setCaption("Partnumber","-1")
  	end
  case "specificUnload"
  	dialog.setSensitive("OpenUnloadtable", dialog.getCheckbox("specificUnload"))
  case "OpenUnloadtable"
  	callingObj.TypeTable.inheritContents := false
  	callingObj.TypeTable.columnindex := true
  	callingObj.TypeTable[1,0] := rootfolder.Localization.getText(211)
  	callingObj.TypeTable[2,0] := rootfolder.Localization.getText(210)
  	callingObj.TypeTable.openDialogBox
  
  -- Tab Advanced
  case "PExitSelect"
  	name := openObjectSelectBox("Method",callingObj)
  	if name /= ""
  		dialog.setCaption("UserPartExitCtrl",name)
  	end
  case "TExitSelect"
  	name := openObjectSelectBox("Method",callingObj)
  	if name /= ""
  		dialog.setCaption("UserTargetExitCtrl",name)
  	end
  case "ExitSelect"
  	name := openObjectSelectBox("Method",callingObj)
  	if name /= ""
  		dialog.setCaption("UserCtrl",name)
  	end
  case "OpenStation"
  	callingObj.openDialog
  	dialog.close(true)
  
  -- Tab Statistic
  case "ShowStatus"
  	callingObj.Status.getStatisticsTable(callingObj.StatusTable)
  	callingObj.StatusTable.openDialogBox
  end
 ShowInTooltip: false
