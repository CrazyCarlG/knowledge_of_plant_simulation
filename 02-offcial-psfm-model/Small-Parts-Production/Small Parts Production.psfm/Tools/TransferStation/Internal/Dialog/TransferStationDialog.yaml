 Name: dialogTranslate
 ID: 8
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  translates the TransferStationDialog
  _________________________________________________________________________________
  Parameters	: 
  ReturnValues: none
  
  Called By	: GenDialog
  Calls		: 
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  02.05.2005  KM	translate dialog before opendialog
  15.02.2006  KM  Nw2Way allowed
  10.10.2007  PS Localization
  04.04.2013  KM  setText -> setCaption
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var j	 : integer
  var l    : list
  var dialog : object
  
  dialog := self.~
  
  for j := dialog.DialogElements.ydim downto 1 
  	dialog.setCaption(dialog.DialogElements[1,j], rootfolder.Localization.getText(j+50))
  next
  
  l.create
  l.insert(1, rootfolder.Localization.getText(2))-- "Always"
  l.insert(2, rootfolder.Localization.getText(3))-- "Only when Destination"
  /*PS for j := 1 to dialog.ComboTextActivate.ydim loop
  		l[j] := dialog.ComboTextActivate[lang+1,j];
  	next;*/
  dialog.setList("ActivateP",l)
  dialog.setList("ActivateT",l)
  
  l.delete
  for j := 1 to 3  -- "Planned", "Unplanned", "Paused"
  	l.insert(j, rootfolder.Localization.getText(j+23))
  next
  /*PS	for j := 1 to dialog.ComboTextShift.ydim loop
  		l[j] := dialog.ComboTextShift[lang+1,j];
  	next;*/
  dialog.setList("ShiftList",l)
  
  l.delete
  -- "Lane A", "Lane B", "Lane A + Lane B", "Lane B + Lane A"
  for j := 1 to 4 
  	l.insert(j, rootfolder.Localization.getText(j+5))
  next
  /*PS for j := 1 to dialog.ComboTextLanes.ydim loop
  		l[j] := dialog.ComboTextLanes[lang+1,j];
  	next;*/
  dialog.setList("PLanes",l)
  dialog.setList("TLanes",l)
  
  -- of the method
 ShowInTooltip: false
