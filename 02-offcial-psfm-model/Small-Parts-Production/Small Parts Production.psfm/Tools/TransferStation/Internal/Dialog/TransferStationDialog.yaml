-
 Name: dialogApply
 ID: 3
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  Sets the parameter of transferStation after ok or apply.
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	: 
  Calls		: setParameter, evtl dialogInit
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  23.02.2005  KM	don't change inheritance if value isn't changed
  21.06.2005  KM	Time-format
  23.08.2005  KM	set sensor.Activate always english
  15.02.2006  KM  Nw2Way allowed
  21.08.2006  KM  checkboxes for behavior of parts and targets for failure
  10.10.2007  PS Localization
  26.10.2012  KM  stream no longer used in version 11
  12.02.2013  KM  stream removed
  04.04.2013  KM  setText -> setCaption
  14.01.2016  KM	use always new format of time_to_str (version removed)
  12.04.2016  KM	use new syntax in executeSilent
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var tab:table[integer,object,length,object,length,time,time,real,time,integer,
  		integer,integer,boolean,table,boolean,boolean,
  		string,string,string,string,string,string,string,boolean,boolean]
  var callingObj,dialog : object
  var ret : boolean
  var ti,str : string
  var r : integer
  var text : string
  var name : string
  var type : integer
  
  dialog := self.~
  callingObj := dialog.openedBy
  
  name := dialog.getValue("Name")
  if callingObj.name /= name 
  	r := executeSilent("param o:object, ti:string -> integer; o.name := ti; return 1",callingObj, name)
  	if r /= 1 
  		dialog.setCaption("Name", callingObj.name)
  		messageBox(rootfolder.Localization.getText(214)+to_str(callingObj.~),1,13)
  	end
  end
  
  name := dialog.getValue("Label")
  if callingObj.label /= name 
  	callingObj.label := name
  end
  
  callingObj.failed := dialog.getCheckbox("FailedCheck")
  
  tab.create
  
  --	Tab Attributes
  if dialog.getCheckbox("Load") 
  	type := 1
  elseif dialog.getCheckbox("Unload") 
  	type := 2
  elseif dialog.getCheckbox("Transfer") 
  	type := 3
  else
  	type := 4
  end
  tab[1,1] := type
  
  name := dialog.getValue("PartObject")
  tab[2,1] := dialog.name_to_obj(name)
  tab[3,1] := str_to_length(dialog.getValue("SensorPos1"))
  
  name := dialog.getValue("TargetObject")
  tab[4,1] := dialog.name_to_obj(name)
  tab[5,1] := str_to_length(dialog.getValue("SensorPos2"))
  
  --	Tab Times
  text := callingObj.procTime.Type
  if text = "Const" or text = "Konst" 
  	ti := dialog.getValue("WorkingTime")
  	r := executeSilent("param ti:string -> integer; var t : time := str_to_time(ti); return 1",ti)
  	if r = 1 
  		tab[6,1] := str_to_time(ti)
  	else
  		tab[6,1] := callingObj.procTime
  		messageBox(rootfolder.Localization.getText(206),1,13)
  	end
  	str := time_to_str(tab[6,1],true)
  	dialog.setCaption("WorkingTime", str)
  end
  text := callingObj.recoveryTime.Type
  if text = "Const" or text = "Konst" 
  	ti := dialog.getValue("RecoveryTime")
  	r := executeSilent("param ti:string -> integer; var t : time := str_to_time(ti); return 1",ti)
  	if r = 1 
  		tab[7,1] := str_to_time(ti)
  	else
  		tab[7,1] := callingObj.recoveryTime
  		messageBox(rootfolder.Localization.getText(206),1,13)
  	end
  	str := time_to_str(tab[7,1],true)
  	dialog.setCaption("RecoveryTime", str)
  end
  
  --	Tab Availability
  if dialog.AvailActive 
  	tab[8,1] := str_to_num(dialog.getValue("AvailPercent"))
  	ti := dialog.getValue("MTTR")
  	r := executeSilent("param ti:string -> integer; var t : time := str_to_time(ti); return 1",ti)
  	if r = 1 
  		tab[9,1] := str_to_time(ti)
  	else
  		tab[9,1] := callingObj.MTTR
  		messageBox(rootfolder.Localization.getText(206),1,13)
  	end
  	str := time_to_str(tab[9,1],true)
  	dialog.setCaption("MTTR", str)
  end
  
  -- Tab Advanced Attributes
  tab[11,1] := str_to_num(dialog.getValue("Partnumber"))
  tab[12,1] := str_to_num(dialog.getValue("blocksize"))
  tab[13,1] := dialog.getCheckbox("specificUnload")
  tab[14,1] := callingObj.TypeTable.copy
  tab[15,1] := dialog.getCheckbox("homogeneousTarget")
  tab[16,1] := dialog.getCheckbox("alwaysStopTarget")
  tab[24,1] := dialog.getCheckbox("stopPartContainer")
  tab[25,1] := dialog.getCheckbox("stopTargetContainer")
  	
  -- Tab Advanced
  r := dialog.getIndex("ActivateP")
  tab[17,1] := rootfolder.Localization.MessageTab[2,220+r]	-- always english
  r := dialog.getIndex("ActivateT")
  tab[18,1] := rootfolder.Localization.MessageTab[2,220+r]
  
  tab[19,1] := dialog.getValue("UserPartExitCtrl")
  tab[20,1] := dialog.getValue("UserTargetExitCtrl")
  tab[21,1] := dialog.getValue("UserCtrl")
  
  r := dialog.getIndex("PLanes")
  tab[22,1] := callingObj.laneIntToString(r)
  
  r := dialog.getIndex("TLanes")
  tab[23,1] := callingObj.laneIntToString(r)
  
  ret := callingObj.setParameter(tab,0)
  
  if not ret 
  	dialog.dialogInit
  end
