 Name: dialogInit
 ID: 4
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  init of the DragDropDialog.
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	:
  Calls		: getInternalClassType, getSensorPosition, getStationLength,
  			  getSensorActivate
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  24.02.2005  KM	init sensorpos and activate if same station
  04.04.2005  KM	init sensorpos with the right unit
  08.07.2005  KM	Source allowed for partstation, drain for targetstation
  02.12.2005  KM  use attribute length only for line-oriented objects
  15.02.2006  KM  Nw2Way allowed
  03.03.2006  KM  change of lane not allowed for inherited sensors
  19.05.2006  KM  NwAssembler as part station allowed
  22.09.2006  KM  allow part or targetstation in other frame than the transferStation
  07.05.2012  KM	cut length of object
  04.04.2013  KM  setText -> setCaption
  12.11.2015  KM  DePortioner allowed as targetstation for unload or parttransfer and Portioner allowed as partStation
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var callingObj,station : object
  var dialog : object
  var unit : string
  var pos1T : string
  var pos1 : length
  var index,indexL : integer
  var iCN : string
  var type : integer
  var enable : boolean
  
  dialog := self.~
  callingObj := dialog.openedBy
  station := dialog.dropObject
  if callingObj /= void
  
  	dialog.setCheckbox("Load",not callingObj.unloadPartcontainer and callingObj.TargetIsContainer)
  	dialog.setCheckbox("Unload",callingObj.unloadPartcontainer and not callingObj.TargetIsContainer)
  	dialog.setCheckbox("Parttransfer",not callingObj.unloadPartcontainer and not callingObj.TargetIsContainer)
  	dialog.setCheckbox("Transfer",callingObj.unloadPartcontainer and callingObj.TargetIsContainer)
  
  	iCN := station.internalClassType
  
  	if (callingObj.PartStation = void and iCN /= "Drain" and iCN /= "Store" and iCN /= "DePortioner") or
  	    	 callingObj.PartStation = station
  		dialog.setCheckbox("Partstation",true)
  	else
  		dialog.setCheckbox("Targetstation",true)
  	end
  
  	dialog.setSensitive("Targetstation", iCN /= "Source" and iCN /= "AssemblyStation" and iCN /= "Portioner")
  	dialog.setSensitive("Partstation", iCN /= "Drain" and iCN /= "Store" and iCN /= "DePortioner")
  
  	type := callingObj.getInternalClassType(station)
  	pos1T := ""
  	index := 1
  	indexL := 1
  	enable := type = 3
  	if type > 0
  		if callingObj.PartStation = station
  			if callingObj.checkSensorID(1,makePathRelative(callingObj, station))
  				pos1 := callingObj.getSensorPosition(1)
  				pos1T := to_str(pos1)
  				indexL := callingObj.PartSensorLane
  				if type > 1
  					index := callingObj.getSensorActivate(1)
  				end
  				if type = 3
  					enable := not callingObj.getSensorOrigin(1)
  				end
  			end
  		elseif callingObj.TargetStation = station
  			if callingObj.checkSensorID(2,makePathRelative(callingObj, station))
  				pos1 := callingObj.getSensorPosition(2)
  				pos1T := to_str(pos1)
  				indexL := callingObj.TargetSensorLane
  				if type > 1
  					index := callingObj.getSensorActivate(2)
  				end
  				if type = 3
  					enable := not callingObj.getSensorOrigin(2)
  				end
  			end
  		end
  
  		pos1 := callingObj.getStationLength(station, indexL)
  		unit := getUnit(pos1)
  		dialog.setCaption("Length","[ 0 - "+num_to_str(pos1, 6)+" "+unit+" ]")
  	end
  
  	dialog.setCaption("SensorPos1",pos1T)
  	dialog.setIndex("ActivateP",index)
  	dialog.setIndex("Lanes",indexL)
  
  	dialog.setSensitive("SensorPos1Text",type > 0)
  	dialog.setSensitive("SensorPos1",type > 0)
  	dialog.setSensitive("Length",type > 0)
  
  	dialog.setSensitive("Lanes",enable)
  
  	dialog.setSensitive("ActivateTextP",type > 1)
  	dialog.setSensitive("ActivateP",type > 1)
  
  end
 ShowInTooltip: false
-
 Name: dialogTranslate
 ID: 5
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  translate of the DragDropDialog.
  _________________________________________________________________________________
  Parameters	: tab: table with DialogElements
  ReturnValues: none
  
  Called By	: OnDragDrop
  Calls		: 
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  15.02.2006  KM  Nw2Way allowed
  10.10.2007  PS Localization
  04.04.2013  KM  setText -> setCaption
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param tab : table
  
  var j	 : integer
  var l,l1    : list
  var dialog : object
  
  dialog := self.~-- drag&drop dialog
  
  for j := tab.ydim downto 1 
  	dialog.setCaption(tab[1,j],rootfolder.Localization.getText(j+11))
  next
  
  l.create
  l.insert(1, rootfolder.Localization.getText(2))-- "Always"
  l.insert(2, rootfolder.Localization.getText(3))-- "Only when Destination"
  
  /*PS for j := 1 to dialog.ComboTextActivate.ydim loop
  		l[j] := dialog.ComboTextActivate[lang+1,j];
  	next;*/
  dialog.setList("ActivateP",l)
  
  l1.create -- "Lane A", "Lane B", "Lane A + Lane B", "Lane B + Lane A"
  for j := 1 to 4 
  	l1.insert(j, rootfolder.Localization.getText(j+5))
  next
  
  /*PS for j := 1 to dialog.ComboTextLanes.ydim loop
  		l1[j] := dialog.ComboTextLanes[lang+1,j];
  	next;*/
  dialog.setList("Lanes",l1)
  
  -- of the method
 ShowInTooltip: false
