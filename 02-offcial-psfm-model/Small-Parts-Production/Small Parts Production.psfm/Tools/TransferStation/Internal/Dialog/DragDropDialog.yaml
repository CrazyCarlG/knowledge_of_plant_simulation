 Name: callback
 ID: 1
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  callback of the DragDropDialog
  _________________________________________________________________________________
  Parameters	: 
  ReturnValues: none
  
  Called By	: OnDragDrop
  Calls		: getStationLength
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  02.05.2005  KM	translate dialog before opendialog
  15.02.2006  KM  Nw2Way allowed
  04.04.2013  KM  setText -> setCaption
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param action : string
  
  var dialog : object
  var callingObj : object
  var pos1 : length
  var act : integer
  var unit : string
  
  dialog := self.~
  callingObj := dialog.openedBy
  if callingObj = void 
  	return
  end
  
  switch action
  case "Open" 
  	dialog.dialogInit
  /* --------------------------------------------------- */
  case "Apply" 
  	if dialog.getCheckbox("Partstation") 
  		dialog.dialogApply(1)
  	elseif dialog.getCheckbox("Targetstation") 
  		dialog.dialogApply(2)
  	end
  /* --------------------------------------------------- */
  case "Close" 
  	callingObj.OpenedDialog := void
  /* --------------------------------------------------- */
  case "Lanes" 
  	act := dialog.getIndex("Lanes")
  	pos1 := callingObj.getStationLength(dialog.dropObject, act)
  	unit := getUnit(pos1)
  	dialog.setCaption("Length","[ 0 - "+to_str(pos1)+" "+unit+" ]")
  /* --------------------------------------------------- */
  end

 ShowInTooltip: false
-
 Name: dialogApply
 ID: 2
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  Set the partstation or the targetstation of the TransferStation.
  _________________________________________________________________________________
  Parameters	: type = 1, partstation; type = 2, targetstation
  ReturnValues: none
  
  Called By	: 
  Calls		: getInternalClassType, setPartStation, setTargetStation
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  24.02.2005  KM	don't change inheritance if value isn't changed;
  				set sensor.Activate always english
  27.06.2005  KM	don't change inheritance if value isn't changed (Activate);
  15.02.2006  KM  Nw2Way allowed, call of setPartStation and setTargetStation
  21.03.2006  KM  don't use PartExitControl or TargetExitControl as UserControl, if
  				station was dragged and dropped again
  27.09.2006  KM  allow part or targetstation in other frame than the transferStation
  10.10.2007  PS Localization
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param type : integer
  
  var callingObj,dialog : object
  var stationtype : integer
  var ctrl : string
  var oldexitctrl : string
  var newexitctrl : string
  var station: object
  var str : string
  var sensorPos:length
  var act : integer
  var newBool : boolean
  var oldpos : length
  var actnew : string
  var lane : string
  var sttype : integer
  
  dialog := self.~
  	callingObj := dialog.openedBy
  	
  -- TODO: Änderungen während der Simulation ??
  
  if dialog.getCheckbox("Load") 
  	stationtype := 1
  elseif dialog.getCheckbox("Unload") 
  	stationtype := 2
  elseif dialog.getCheckbox("Transfer") 
  	stationtype := 3
  else
  	stationtype := 4
  end
  newBool := (stationtype = 2 or stationtype = 3)
  if callingObj.unloadPartcontainer /= newBool 
  	callingObj.unloadPartcontainer := newBool
  end
  newBool := (stationtype = 1 or stationtype = 3)
  if callingObj.TargetIsContainer /= newBool 
  	callingObj.TargetIsContainer := newBool
  end
  
  station := dialog.dropObject
  sttype := callingObj.getInternalClassType(station)
  
  sensorPos := str_to_length(dialog.getValue("SensorPos1"))
  act := dialog.getIndex("ActivateP")
  actnew := rootfolder.Localization.MessageTab[2,220+act]	-- always english
  act := dialog.getIndex("Lanes")
  lane := callingObj.laneIntToString(act)
  ctrl := ""
  if sttype = 0 and (type = 1 or callingObj.TargetIsContainer) 
  	oldexitctrl := to_str(station.exitCtrl)
  	if type = 1 
  		newexitctrl := makePathRelative(callingObj, station) + ".PartExitControl"
  	else
  		newexitctrl := makePathRelative(callingObj, station) + ".TargetExitControl"
  	end
  	if oldexitctrl ~= "VOID" 
  		ctrl := ""
  	elseif oldexitctrl ~= newexitctrl 
  		if type = 1 
  			ctrl := callingObj.UserPartExitCtrl
  		else
  			ctrl := callingObj.UserTargetExitCtrl
  		end
  	else
  		str := strCopy(oldexitctrl,1,5)
  		if str ~= "self." 
  			oldexitctrl := strOmit(oldexitctrl,1,4)
  			oldexitctrl := strIncl(to_str(station),oldexitctrl,1)
  		else
  			oldexitctrl := strIncl(to_str(station.~)+".",oldexitctrl,1)
  		end
  		ctrl := makePathRelative(oldexitctrl,callingObj.~)
  	end
  end
  if type = 1 
  	callingObj.setPartStation(station,sensorPos,actnew,ctrl,lane)
  elseif type = 2 
  	callingObj.setTargetStation(station,sensorPos,actnew,ctrl,lane)
  else
  	return
  end
 ShowInTooltip: false
