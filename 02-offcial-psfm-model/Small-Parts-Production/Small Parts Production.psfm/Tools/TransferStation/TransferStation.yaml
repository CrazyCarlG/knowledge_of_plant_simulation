 Name: setPartStation
 ID: 67
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  Sets the PartStation with sensor or exitctrl.
  _________________________________________________________________________________
  Parameters	: obj, the partstation
  			  pos1, position of the sensor (if line or way)
  			  act, activate always the sensor (if way)
  			  ctrl, user exit control ( if not line and not way)
  ReturnValues: true if ok
  
  Called By	: setParameter or by User
  Calls		: resetUserStation, checkStationClass, createSensor, getSensorPosition
  			  setSensorPosition, getSensorActivate, laneStringToInt
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  23.02.2005  KM	don't change inheritance if value isn't changed
  14.04.2005  KM	UserPartExitCtrl could not be defined
  27.06.2005  KM	don't change inheritance if value isn't changed (Activate);
  08.07.2005  KM	Parameter of checkStationClass
  23.08.2005  KM	set "Activate" to "Always" if act is invalid
  31.01.2006  KM	user control for line and track
  15.02.2006  KM  Nw2Way allowed, additional parameter for lane
  21.03.2006  KM  Parameter of checkStationClass, don't allow TransferStation
  19.05.2005  KM	blocksize > 1 and load or move only allowed for part station of
  				type parallelproc
  26.09.2006  KM  allow part or targetstation in other frame than the transferStation
  26.08.2010	KM	exitCtrl must be front triggered
  05.10.2016	KM	exitCtrl must be triggered not only once
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param obj : object, pos1 : length, act : string, ctrl : string, lane : string -> boolean
  
  var callingObj : object
  var station : object
  var newctrl : string
  var oldpos : length
  var activate : integer
  var eq : boolean
  var type : integer
  var newlane : integer
  var callingObjRelName : string
  var b : boolean
  
  callingObj := self.~
  
  if obj /= void and existsObject(to_str(obj))
  	station := makePathRelative(obj)
  	callingObjRelName := makePathRelative(callingObj, station)
  else
  	station := void
  	callingObjRelName := ""
  end
  
  type := callingObj.getInternalClassType(obj)
  
  if callingObj.PartStation = station
  	if station = void
  		return false
  	end
  	-- same partstation: check sensor or exitctrl
  	if type > 0
  		if callingObj.checkSensorID(1,callingObjRelName)
  			if type = 3
  				newlane := callingObj.laneStringToInt(lane)
  				if newlane /= callingObj.PartSensorLane
  					callingObj.setSensorLane(1,newlane)
  					callingObj.PartSensorLane := newlane
  				end
  			end
  			oldpos := callingObj.getSensorPosition(1)
  			if pos1 /= oldpos
  				callingObj.setSensorPosition(1,pos1)
  			end
  			if type > 1
  				activate := callingObj.getSensorActivate(1)
  				eq := false
  				switch act
  				case "Immer","Always"
  					if activate = 1
  						eq := true
  					end
  				case "Nur wenn Ziel","Only when Destination"
  					if activate = 2
  						eq := true
  					end
  				else
  					act := "Always"
  				end
  				if not eq
  					callingObj.setSensorActivate(1,act)
  				end
  			end
  		else
  			callingObj.PartSensorLane := callingObj.laneStringToInt(lane)
    			callingObj.PartSensorID := callingObj.createSensor(1,pos1,act,callingObj.PartSensorLane)
     		end
  	else
  		newctrl := callingObjRelName + ".PartExitControl"
  		if to_str(callingObj.PartStation.exitCtrl) /= newctrl
  			callingObj.PartStation.exitCtrl := newctrl
  		end
  		b := callingObj.PartStation.exitCtrlFront
  		if not b
  			callingObj.PartStation.exitCtrlFront := true
  		end
  		b := callingObj.PartStation.exitCtrlRear
  		if b
  			callingObj.PartStation.exitCtrlRear := false
  		end
  		b := callingObj.PartStation.exitCtrlOnce
  		if b
  			callingObj.PartStation.exitCtrlOnce := false
  		end
  	end
  	if callingObj.UserPartExitCtrl /= ctrl
  		if ctrl = "" or existsMethod(ctrl)
  			callingObj.UserPartExitCtrl := ctrl
  		end
  	end
  else
  	-- partstation has changed
  	callingObj.resetUserStation(1)		-- reset old partstation
  	callingObj.PartSensorID := 0
  	callingObj.PartSensorLane := 1
  	callingObj.UserPartExitCtrl := ""
  	callingObj.PartStation := void
  
  	if station /= void
  		if callingObj.checkStationClass(obj,1)
  			callingObj.PartStation := makePathRelative(obj)
  			if type > 0
  				callingObj.PartSensorLane := callingObj.laneStringToInt(lane)
  				callingObj.PartSensorID := callingObj.createSensor(1,pos1,act,callingObj.PartSensorLane)
  			else
  				callingObj.PartStation.exitCtrl := callingObjRelName + ".PartExitControl"
  				b := callingObj.PartStation.exitCtrlFront
  				if not b
  					callingObj.PartStation.exitCtrlFront := true
  				end
  				b := callingObj.PartStation.exitCtrlRear
  				if b
  					callingObj.PartStation.exitCtrlRear := false
  				end
  			end
  			if existsMethod(ctrl)
  				callingObj.UserPartExitCtrl := ctrl
  			end
  			if not callingObj.unloadPartcontainer and
  			   callingObj.PartStation.internalClassType /= "ParallelStation"
  				callingObj.Blocksize := 1
  			end
  		else
  			return false
  		end
  	else
  		return false
  	end
  end
  return true
