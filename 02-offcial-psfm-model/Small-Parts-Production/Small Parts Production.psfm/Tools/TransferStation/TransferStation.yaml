 Name: checkContainer
 ID: 50
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  checks whether the container should stop.
  _________________________________________________________________________________
  Parameters	: container
  ReturnValues: true: container should stop
  			  false: container will continue
  
  Called By	: PartExitControl and PartSensorControl
  Calls		:
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  03.03.2005  KM	container stops also for incomplete blocks if "unload all"
  21.08.2006  KM  checkboxes for behavior of parts and targets for failure
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param container : object -> boolean
  ------------------------------------------------------------------------------
  -- called from PartExitControl and PartSensorControl when "Unload" or "Reload"
  -- Partnumber=-1: at least one part
  -- Partnumber given:"Unload": at least (Partnumber*Blocksize) parts
  --					"Reload": at least one part (unload all, Partnumber for the target)
  ------------------------------------------------------------------------------
  
  var station : object
  
  station := self.~
  
  if (station.pause or station.failed) and not station.StopPartsForFailure
  	return false
  end
  
  if container.internalClassType = "Part" or container.numMU = 0
  	return false
  end
  
  if station.Partnumber <= -1 or station.TargetIsContainer
  	return true
  end
  
  if container.numMU < station.Partnumber*station.Blocksize
  	return false
  else
  	return true
  end
