 Name: PartExitControl
 ID: 44
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  exit control of the partstation.
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	:
  Calls		: checkContainer, checkNumberOfPartsWithType, checkType,
  			  checkReachingBlocksize, exitPartStation, readyForWorking,
  			  StartMoveInUserMethod
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  03.03.2005  KM	container stops also for incomplete blocks if "unload all"
  04.03.2005  KM	but at least one part of the right type
  19.04.2005  KM	homogeneous loading: container must continue for changing type
  02.12.2005  KM	check ConfigurationError
  20.02.2008  KM  call UserControl when part arrives
  10.11.2014  KM  don't insert the same MU twice in waitingParts (Buffer of type stack)
  01.04.2016  KM  SimTalk 2.0
  10.11.2021  KM  for type specific or homogeneous loading from a ParallelStation do
  				nothing when there is no target
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var station : object
  var num : integer
  var target : object
  var done,incomplete : boolean
  
  station := self.~
  
  if station.ConfigurationError or ? /= station.PartStation
  	return
  end
  
  target := station.WaitingTargets[1]
  if target /= void
  	if station.targetFull(target)
  		target := station.WaitingTargets[2]
  	end
  end
  
  if station.unloadPartcontainer
  	-- unload or transfer from container to container
  	if station.checkContainer(@)
  		num := station.checkNumberOfPartsWithType(@,target)
  		if (num < station.Blocksize and station.Partnumber > -1) or
  			(num = 0 and station.Partnumber <= -1)
  			-- TODO protokoll
  			station.exitPartStation(@)
  			return
  		end
  		if station.UserPartExitCtrl /= "" and str_to_method(station.UserPartExitCtrl).checkArguments(false)
  			str_to_method(station.UserPartExitCtrl).execute(false,@,station.PartStation)
  		end
  		station.WaitingParts.append(@)
  	else
  		station.exitPartStation(@)
  		-- TODO protokoll
  		return
  	end
  else
  	-- load or transfer from station to station
  	if target = void and station.PartStation.internalClassType = "ParallelStation" and station.TargetIsContainer and
  						(station.TypeSpecific or station.HomogeneousTarget)
  		if station.UserPartExitCtrl /= "" and str_to_method(station.UserPartExitCtrl).checkArguments(false)
  			str_to_method(station.UserPartExitCtrl).execute(false,@,station.PartStation)
  		end
  		return
  	end
  	incomplete := false
  	if not station.checkType(@,target)
  		done := station.exitPartStation(@)
  		if (not done) and not station.TypeSpecific and station.HomogeneousTarget
  			-- change of parttype
  			if station.empty and target /= void and station.WaitingParts.empty
  				station.stopObject(target,false)
  				station.WaitingTargets.remove(1)
  				station.MovedBlocks := 0
  				station.Parttype := @.name
  				station.Containertype := ""
  				station.ContinueTarget := false
  			else
  				-- load an incomplete block
  				if station.WaitingParts.dim < station.Blocksize
  					incomplete := true
  				end
  			end
  		else
  			return
  		end
  	end
  
  	if not incomplete
  		if station.UserPartExitCtrl /= "" and str_to_method(station.UserPartExitCtrl).checkArguments(false)
  			str_to_method(station.UserPartExitCtrl).execute(false,@,station.PartStation)
  		end
  		if station.PartStation.internalClassType = "Buffer" and station.PartStation.BufferType = "Stack"
  			station.WaitingParts.setCursor(1)
  			if not station.WaitingParts.find(@)
  				station.WaitingParts.insert(1,@)
  			end
  		else
  			station.WaitingParts.append(@)
  		end
  		if not station.checkReachingBlocksize
  			return
  		end
  	end
  end
  
  if station.TargetIsContainer and station.WaitingTargets.empty
  	if station.readyForWorking
  		station.Status := "waiting_for_target"
  	end
  else
  	if station.waitForReadyStation
  		station.StartMoveInUserMethod
  	end
  end
