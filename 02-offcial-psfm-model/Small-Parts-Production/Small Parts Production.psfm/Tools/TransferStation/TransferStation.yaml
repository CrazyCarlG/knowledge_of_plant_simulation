  param byref pos1 : length, byref activate : string, byref ctrl : string, byref lane : string -> object
  
  var callingObj : object
  var iC,act : integer
  var lang : integer
  
  callingObj := self.~
  
  pos1 := 0.0
  activate := ""
  ctrl := ""
  lane := ""
  
  if callingObj.PartStation /= void and existsObject(to_str(callingObj.PartStation)) 
  	iC := callingObj.getInternalClassType(callingObj.PartStation)
  	if (iC >0) 
  		if callingObj.checkSensorID(1,makePathRelative(callingObj, callingObj.PartStation)) 
  			pos1 := callingObj.getSensorPosition(1)
  			if iC > 1 
  				act := callingObj.getSensorActivate(1)
  				lang := UserInterfaceLanguage + 1
  				if lang > 2 
  					lang := 2
  				end
  				activate := rootfolder.Localization.messageTab[lang,220+act]
  			end
  			if iC = 3 
  				lane := callingObj.laneIntToString(callingObj.PartSensorLane)
  			end
  		end
  	end
  	ctrl := callingObj.UserPartExitCtrl
  	return callingObj.PartStation
  else
  	-- no station defined
  	return void
  end

