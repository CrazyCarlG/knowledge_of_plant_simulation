 Name: setParameter
 ID: 20
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  Set the parameter of the TransferStation.
  _________________________________________________________________________________
  Parameters	: tab, the table holding the parameters
  			  type, 0 if the method was called by dialog; 1 if the method was called by user
  ReturnValues: true: ok
  			  false: Parameters are wrong
  
  Called By	: User (setStationParameter)   shouldn't be used
  			  or dialog (TransferStationDialog.dialogApply)
  Calls		: 
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  07.02.2005  KM	check of availability and MTTR added
  23.02.2005  KM	don't change inheritance if value isn't changed
  19.04.2005  KM	set homogeneousTarget to false for unload and move
  27.06.2005  KM	use str_to_method
  08.07.2005  KM	use return-value of setPartStation and setTargetStation
  15.02.2006  KM  Nw2Way allowed
  21.08.2006  KM  checkboxes for behavior of parts and targets for failure
  10.10.2007  PS  Localization
  11.03.2009  KM  set the availability after MTTR to avoid the default value 95%
  26.08.2010	KM	check targetstation also when there is no partstation
  12.02.2013  KM  stream removed
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param tab : table, type : integer -> boolean
  -- type 0: setParameter called from dialog.dialogApply
  -- type 1: setParameter called from setStationParameter
  
  var callingObj,obj : object
  var ret : boolean
  var ret1 : boolean
  var i,b : integer
  var pos1 : length
  var av : real
  var iCN : string
  var ptext,str : string
  var t : time
  var newBool : boolean
  var newctrl : string
  
  ret := true
  callingObj := self.~
  
  -- TODO: Änderungen während der Simulation ??
  	
  --	Tab Attribute
  
  newBool := (tab[1,1] = 2 or tab[1,1] = 3)
  if callingObj.unloadPartcontainer /= newBool 
  	callingObj.unloadPartcontainer := newBool
  end
  newBool := (tab[1,1] = 1 or tab[1,1] = 3)
  if callingObj.TargetIsContainer /= newBool 
  	callingObj.TargetIsContainer := newBool
  end
  
  ret := callingObj.setPartStation(tab[2,1],tab[3,1],tab[17,1],tab[19,1],tab[22,1])
  ret1 := callingObj.setTargetStation(tab[4,1],tab[5,1],tab[18,1],tab[20,1],tab[23,1])
  ret := ret and ret1
  
  -- Tab Times
  if tab[6,1] /= void and callingObj.procTime /= tab[6,1] 
  	callingObj.procTime := tab[6,1]
  end
  if tab[7,1] /= void and callingObj.recoveryTime /= tab[7,1] 
  	callingObj.recoveryTime := tab[7,1]
  end
  
  --	Tab Availability
  if tab[8,1] /= void 
  	av := tab[8,1]
  	if av > 100.0 
  		av := 100.0
  		ret := false
  	end
  	
  	t := tab[9,1]
  	
  	if (av = 100 and t > 0) or (av < 100 and t = 0) 
  		if type = 0 
  			messageBox(to_str(callingObj)+": "+rootfolder.Localization.getText(226),1,13)
  		end
  		ret := false
  	end
  	
  	if callingObj.MTTR /= t 
  		callingObj.MTTR := t
  	end
  	
  	if callingObj.availability /= av 
  		callingObj.availability := av
  	end
  end
  
  -- Tab Advanced Attributes
  b := tab[11,1]
  if b < 1 and b /= -1 
  	b := -1
  	ret := false
  end
  if callingObj.Partnumber /= b 
  	callingObj.Partnumber := b
  end
  
  callingObj.setBlocksize(tab[12,1])
  
  if callingObj.TypeSpecific /= tab[13,1] 
  	callingObj.TypeSpecific := tab[13,1]
  end
  callingObj.TypeTable.insertList(1,1,tab[14,1])
  
  if callingObj.PartStation /= void and
     not callingObj.unloadPartcontainer and callingObj.PartStation.capacity /= -1 and
     callingObj.PartStation.capacity < callingObj.Blocksize 
  	callingObj.errorMessage(1,type+1)
  	ret := false
  end
  
  if callingObj.TargetIsContainer 
  	if callingObj.HomogeneousTarget /= tab[15,1] 
  		callingObj.HomogeneousTarget := tab[15,1]
  	end
  else
  	callingObj.HomogeneousTarget := false
  end
  
  if callingObj.AlwaysStopTarget /= tab[16,1] 
  	callingObj.AlwaysStopTarget := tab[16,1]
  end
  	
  if callingObj.StopPartsForFailure /= tab[24,1] 
  	callingObj.StopPartsForFailure := tab[24,1]
  end
  	
  if callingObj.StopTargetsForFailure /= tab[25,1] 
  	callingObj.StopTargetsForFailure := tab[25,1]
  end
  	
  -- Tab Advanced Controls
  newctrl := tab[21,1]
  if newctrl /= "" 
  	ptext := newctrl
  	str := strCopy(ptext,1,5)
  	if str ~= "self." 
  		ptext := strOmit(ptext,1,4)
  		newctrl := strIncl(callingObj.name,ptext,1)
  	end
  	
  	if existsMethod(newctrl) and callingObj.UserCtrl /= newctrl 
  		callingObj.UserCtrl := newctrl
  		if type = 0 
  			i := messageBox(rootfolder.Localization.getText(224),48,12)
  			if i = 16 
  				ptext := callingObj.&userCtrlMethodTemplate.program
  				str_to_method(callingObj.UserCtrl).program := ptext
  			end
  		end
  	end
  else
  	if callingObj.UserCtrl /= "" 
  		callingObj.UserCtrl := ""
  	end
  end
  
  result := ret
