 Name: readyPartStation
 ID: 80
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  checks if on the PartStation is a part ready for load
  _________________________________________________________________________________
  Parameters	: 
  ReturnValues: true if on the PartStation is a part ready for load
  
  Called By	: successfulExit
  Calls		: getInternalClassType, getSensorPosition
  
  Author		: Karola Mock, Tecnomatix
  Date		: 19.04.2005
  
  _________________________________________________________________________________
  History:
  15.02.2006  KM  Nw2Way allowed
  08.01.2016  KM 	breakpoint at line 38 removed
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  -> boolean
  var station : object
  var spos : length
  var t : table
  var i,type : integer
  
  station := self.~
  type := station.getInternalClassType(station.PartStation)
  if type = 0 
  	if station.PartStation.ready 
  		return true
  	end
  elseif type > 0 
  	if station.PartSensorID /= 0 
  		t := station.getContentsList(station.PartStation,station.PartSensorLane)
  		spos := station.getSensorPosition(1)
  		for i := 1 to t.YDim 
  			if t[3,1] = spos and t[1,1].stopped 
  				return true
  			end
  		next
  	end
  end
  return false

