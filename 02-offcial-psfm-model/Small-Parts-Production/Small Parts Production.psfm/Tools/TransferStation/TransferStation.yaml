  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  checks whether the sensorID on the targetstation exists and has the right control
  _________________________________________________________________________________
  Parameters	: name, path of the transferstation
  ReturnValues: true if correct sensor
  
  Called By	: Init
  Calls		: 
  
  Author		: Karola Mock, Siemens PLM Software
  Date		: 16.09.2011
  
  _________________________________________________________________________________
  History:
  
  16.09.2011  KM  create rear triggered sensor control when unloading to line/track to
  				avoid periodic try to unload the part when first unload wasn't possible
  29.08.2013  KM  beim Ablegen auf Förderstrecke oder Weg wird der Sensor als heckgetriggerter
  				Lichtschrankensensor konfiguriert (nötig für update von 10.0 Modellen)
  13.07.2018  KM  Attributname "Ctrl" durch neuen Namen "Control" ersetzt
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param name : string -> boolean
  
  var station : object
  var sensorstation : object
  var ctrl : string
  var iC : integer
  var lane,newlane,id : integer
  var a,b : boolean
  var laneAttr : string
  var sensor : any
  
  station := self.~
  
  sensorstation := station.TargetStation
  lane := station.TargetSensorLane
  laneAttr := "TargetSensorLane"
  id := station.TargetSensorID
  ctrl := name + ".TargetSensorControl"
  	
  iC := station.getInternalClassType(sensorstation)
  if iC = 3 
  	-- Nw2Way
  	if sensorstation.A.existsSensorID(id) 
  		sensor := sensorstation.A.sensorID(id)
  		sensor.Control := ctrl
  		sensor.Front := false
  		sensor.Rear := true
  		sensor.LightBarrierMode := true
  		a := true
  	else
  		a := false
  	end
  	if sensorstation.B.existsSensorID(id) 
  		sensor := sensorstation.B.sensorID(id)
  		sensor.Control := ctrl
  		sensor.Front := false
  		sensor.Rear := true
  		sensor.LightBarrierMode := true
  		b := true
  	else
  		b := false
  	end
  	if a or b 
  		if a and b 
  			if lane = 1 or lane = 3 
  				newlane := 3
  			else
  				newlane := 4
  			end
  		elseif a 
  			newlane := 1
  		else
  			newlane := 2
  		end
  		if newlane /= lane 
  			station.setAttribute(laneAttr, newlane)
  		end
  		return true
  	else
  		return false
  	end
  else
  	if sensorstation.existsSensorID(id) 
  		sensor := sensorstation.sensorID(id)
  		sensor.Control := ctrl
  		sensor.Front := false
  		sensor.Rear := true
  		sensor.LightBarrierMode := true
  		return true
  	else
  		return false
  	end
  end
