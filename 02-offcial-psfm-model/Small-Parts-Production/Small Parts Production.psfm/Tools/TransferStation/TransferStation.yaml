 Name: successfulExit
 ID: 37
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  Called after one sucessful load/unload. It will be checked if the next transfer can be started.
  Empty Container (unload) or full container (load) continue.
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	: exitStation
  Calls		: checkNumberOfPartsWithType, checkReachingBlocksize, StartMoveInUserMethod
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  19.04.2005  KM	homogeneous loading: container must continue for changing type
  23.09.2005  KM	stopObject(station.WaitingTargets[1],... buggy because stopObject
  				uses WaitingTargets
  07.11.2011  KM  set the right status
  01.04.2016  KM  SimTalk 2.0
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var station : object
  var target  : object
  var p : object
  var num : integer
  var found : boolean
  var oldname : string
  
  station := self.~
  
  if not station.resWorking
  	station.Status := "waiting"
  end
  
  if station.TargetIsContainer 		-- LoadStation/Transfer to container
  	station.MovedBlocks := station.MovedBlocks + 1
  
  	if station.unloadPartcontainer
  		-- transfer to container
  		p := station.WaitingParts[1]
  		-- consider partnumber only for loading; complete unload
  --			if station.Partnumber > -1 and (station.MovedBlocks < station.Partnumber) and p.empty then
  --				station.errorMessage(4,2);
  --			end;
  		if (p.empty or station.checkNumberOfPartsWithType(p,station.WaitingTargets[1]) = 0)
  			station.stopObject(station.WaitingParts.remove(1),false)
  		end
  	else
  		-- Loadstation
  		if station.PartStation.internalClassType = "Buffer" and
  		   station.PartStation.BufferType = "Stack" and station.WaitingParts.occupied
  			-- buffer with LIFO and not empty: is there a not finished part above the waiting parts?
  			if not station.PartStation.cont.finished
  				station.WaitingParts.delete
  			end
  		end
  	end
  
  	target := station.WaitingTargets[1]
  	if station.Partnumber > -1 and (station.MovedBlocks < station.Partnumber) and station.targetFull(target)
  		station.errorMessage(3,2)
  	end
  
  	-- don't init ContinueTarget to false here
  	if station.targetFull(target) or (station.MovedBlocks = station.Partnumber)
  		station.ContinueTarget := true
  	elseif not station.TypeSpecific and station.HomogeneousTarget and not station.unloadPartcontainer
  		if station.WaitingParts.empty and station.readyPartStation
  			station.ContinueTarget := true
  		end
  	end
  
  	if station.ContinueTarget
  		station.stopObject(target,false)
  		station.WaitingTargets.remove(1)
  		station.MovedBlocks := 0
  		station.Parttype := ""
  		station.Containertype := ""
  		station.ContinueTarget := false
  
  		if station.unloadPartcontainer
  			-- transfer to container
  			if station.WaitingParts.empty
  				return
  			end
  			found := false
  			oldname := target.name
  			while station.WaitingTargets.occupied and not found
  				target := station.WaitingTargets[1]
  				if oldname /= target.name
  					p := station.WaitingParts[1]
  					num := station.checkNumberOfPartsWithType(p,target)
  					if num < station.Blocksize 		-- must be full block ???
  						station.stopObject(target,false)
  						station.WaitingTargets.remove(1)
  					else
  						found := true
  					end
  				else
  					found := true
  				end
  			end
  		else
  			-- Loadstation
  			if station.HomogeneousTarget or
  				(station.TypeSpecific and
  			   	(station.WaitingTargets.empty or target.name /= station.WaitingTargets[1].name))
  	   			-- no waiting target or type has changed
  				if station.WaitingParts.occupied
  					p := station.WaitingParts[1]
  					station.WaitingParts.delete
  					station.stopObject(p,false)	-- for line and tracks
  				end
  				station.checkNumberOfPartsWithType(station.PartStation,station.WaitingTargets[1])
  				if station.WaitingParts.occupied
  					-- stop the first part before the sensor
  					station.stopObject(station.WaitingParts[1],true)	-- for line and tracks
  				end
  			end
  		end
  	end
  
  	if station.unloadPartcontainer
  		if station.WaitingParts.empty
  			return
  		end
  	else
  		if not station.checkReachingBlocksize
  			return
  		end
  	end
  	if station.WaitingTargets.empty
  		return
  	end
  else	-- UnloadStation or transfer from station to station
  	if station.unloadPartcontainer
  		-- UnloadStation
  		station.MovedBlocks := station.MovedBlocks + 1
  		p := station.WaitingParts[1]
  		if station.Partnumber > -1 and (station.MovedBlocks < station.Partnumber) and p.empty
  			station.errorMessage(4,2)
  		end
  		if (station.Partnumber <= -1 and (p.empty or station.checkNumberOfPartsWithType(p,station.WaitingTargets[1]) = 0)) or
  		   station.MovedBlocks = station.Partnumber
  			station.stopObject(station.WaitingParts.remove(1),false)
  			station.MovedBlocks := 0
  			if station.WaitingParts.empty
  				return
  			end
  		end
  	else
  		-- transfer to station
  		if station.PartStation.internalClassType = "Buffer" and
  		   station.PartStation.BufferType = "Stack" and station.WaitingParts.occupied
  			-- buffer with LIFO and not empty: is there a not finished part above the waiting parts?
  			if not station.PartStation.cont.finished
  				station.WaitingParts.delete
  				return
  			end
  		end
  
  		if not station.checkReachingBlocksize
  			return
  		end
  	end
  end
  
  if station.waitForReadyStation
  	station.StartMoveInUserMethod
  end
