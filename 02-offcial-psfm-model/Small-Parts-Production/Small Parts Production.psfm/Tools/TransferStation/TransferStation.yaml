 Name: checkUserExitCtrl
 ID: 63
 DataType: method
 Value: |+1
  param type : integer-> boolean
  
  var station,obj : object
  var exitctrl,ctrl,str : string
  var i : integer
  
  station := self.~
  if type = 1 
  	exitctrl := station.UserPartExitCtrl
  elseif type = 2 
  	exitctrl := station.UserTargetExitCtrl
  else
  	exitctrl := station.UserCtrl
  end
  
  if exitctrl = "" 
  	return true
  end
  	
  if not existsObject(exitctrl) 
  	-- usermethod is a custom attribute ?
  	ctrl := exitctrl
  	i := strRpos(".",ctrl)
  	str := strCopy(exitctrl,1,i-1)
  	
  	if existsObject(str) 
  		obj := str_to_obj(str)
  	else
  		return false
  	end
  	
  	ctrl := strOmit(ctrl,1,i)
  	if obj.getAttrNo(ctrl) = 0 
  		return false
  	end
  end
  
  return true
