 Name: setTargetStation
 ID: 68
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  Sets the TargetStation with sensor or exitctrl.
  _________________________________________________________________________________
  Parameters	: obj, the TargetStation
  			  pos1, position of the sensor (if line or way)
  			  act, activate always the sensor (if way)
  			  ctrl, user exit control ( if not line and not way)
  ReturnValues: true if ok
  
  Called By	: setParameter or by User
  Calls		: resetUserStation, checkStationClass, createSensor, getSensorPosition
  			  setSensorPosition, getSensorActivate, setSensorCtrl, laneStringToInt
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  23.02.2005  KM	don't change inheritance if value isn't changed
  14.04.2005  KM	reset exitctrl of targetstation for unload or move
  27.06.2005  KM	don't change inheritance if value isn't changed (Activate);
  08.07.2005  KM	Parameter of checkStationClass
  23.08.2005  KM	set "Activate" to "Always" if act is invalid
  31.01.2006  KM	user control for line and track
  15.02.2006  KM  Nw2Way allowed, additional parameter for lane
  21.03.2006  KM  Parameter of checkStationClass, don't allow TransferStation
  27.09.2006  KM  allow part or targetstation in other frame than the transferStation
  12.11.2008  KM  Drain only allowed for unload or parttransfer
  26.08.2010	KM	exitCtrl must be front triggered
  16.09.2011  KM  create rear triggered sensor control when unloading to line/track to
  				avoid periodic try to unload the part when first unload wasn't possible
  05.10.2016	KM	exitCtrl must be triggered not only once
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param obj : object, pos1 : length, act : string, ctrl : string, lane : string -> boolean
  
  var callingObj : object
  var station : object
  var newctrl,str : string
  var oldpos : length
  var activate : integer
  var eq : boolean
  var type : integer
  var newlane : integer
  var callingObjRelName : string
  var b : boolean
  
  callingObj := self.~
  
  if obj /= void and existsObject(to_str(obj)) and callingObj.checkStationClass(obj,2) 
  	station := makePathRelative(obj)
  	callingObjRelName := makePathRelative(callingObj, station)
  else
  	station := void
  	callingObjRelName := ""
  end
  
  type := callingObj.getInternalClassType(obj)
  
  if callingObj.TargetStation = station 
  	if station = void 
  		return false
  	end
  	-- same TargetStation: check sensor or exitctrl
  	if type > 0 
  		if callingObj.checkSensorID(2,callingObjRelName) 
  			callingObj.setSensorCtrl(2,callingObjRelName+".TargetSensorControl")
  			if type = 3 
  				newlane := callingObj.laneStringToInt(lane)
  				if newlane /= callingObj.TargetSensorLane 
  					callingObj.setSensorLane(2,newlane)
  					callingObj.TargetSensorLane := newlane
  				end
  			end
  			oldpos := callingObj.getSensorPosition(2)
  			if pos1 /= oldpos 
  				callingObj.setSensorPosition(2,pos1)
  			end
  			if type > 1 
  				activate := callingObj.getSensorActivate(2)
  				eq := false
  				switch act
  				case "Immer","Always" 
  					if activate = 1 
  						eq := true
  					end
  				case "Nur wenn Ziel","Only when Destination" 
  					if activate = 2 
  						eq := true
  					end
  				else
  					act := "Always"
  				end
  				if not eq 
  					callingObj.setSensorActivate(2,act)
  				end
  			end
  		else
  			callingObj.TargetSensorLane := callingObj.laneStringToInt(lane)
  			callingObj.TargetSensorID := callingObj.createSensor(2,pos1,act,callingObj.TargetSensorLane)
  		end
  		if callingObj.UserTargetExitCtrl /= ctrl 
  			if ctrl = "" or existsMethod(ctrl) 
  				callingObj.UserTargetExitCtrl := ctrl
  			end
  		end
  	elseif callingObj.TargetIsContainer 
  		newctrl := callingObjRelName + ".TargetExitControl"
  		if to_str(callingObj.TargetStation.exitCtrl) /= newctrl 
  			callingObj.TargetStation.exitCtrl := newctrl
  		end
  		b := callingObj.TargetStation.exitCtrlFront
  		if not b 
  			callingObj.TargetStation.exitCtrlFront := true
  		end
  		b := callingObj.TargetStation.exitCtrlRear
  		if b 
  			callingObj.TargetStation.exitCtrlRear := false
  		end
  		b := callingObj.TargetStation.exitCtrlOnce
  		if b
  			callingObj.TargetStation.exitCtrlOnce := false
  		end
  		if callingObj.UserTargetExitCtrl /= ctrl 
  			if ctrl = "" or existsMethod(ctrl) 
  				callingObj.UserTargetExitCtrl := ctrl
  			end
  		end
  	elseif not callingObj.TargetIsContainer 
  		newctrl := callingObjRelName + ".TargetExitControl"
  		if to_str(callingObj.TargetStation.exitCtrl) ~= newctrl 
  			if existsMethod(callingObj.UserTargetExitCtrl) 
  				if existsObject(callingObj.UserTargetExitCtrl) 
  					callingObj.TargetStation.exitCtrl := makePathRelative(str_to_obj(callingObj.UserTargetExitCtrl),callingObj.TargetStation)
  				else
  					-- usermethod is a custom attribute
  					newctrl := callingObj.UserTargetExitCtrl
  					str := makePathRelative(callingObj.TargetStation)
  					if strLpos(str,newctrl) = 1 
  						newctrl := strOmit(newctrl,1,strlen(str))
  						newctrl := strIncl("self",newctrl,1)
  					end
  					callingObj.TargetStation.exitCtrl := newctrl
  				end
  			else
  				callingObj.TargetStation.exitCtrl := ""
  			end
  		end
  		callingObj.UserTargetExitCtrl := ""
  	end
  else
  	-- TargetStation has changed
  	callingObj.resetUserStation(2)		-- reset old TargetStation
  	callingObj.TargetSensorID := 0
  	callingObj.TargetSensorLane := 1
  	callingObj.UserTargetExitCtrl := ""
  	callingObj.TargetStation := void
  	
  	if station /= void 
  		callingObj.TargetStation := makePathRelative(obj)
  		if type > 0 
  			callingObj.TargetSensorLane := callingObj.laneStringToInt(lane)
  			callingObj.TargetSensorID := callingObj.createSensor(2,pos1,act,callingObj.TargetSensorLane)
  			if existsMethod(ctrl) 
  				callingObj.UserTargetExitCtrl := ctrl
  			end
  		elseif callingObj.TargetIsContainer 
  			callingObj.TargetStation.exitCtrl := callingObjRelName + ".TargetExitControl"
  			b := callingObj.TargetStation.exitCtrlFront
  			if not b 
  				callingObj.TargetStation.exitCtrlFront := true
  			end
  			b := callingObj.TargetStation.exitCtrlRear
  			if b 
  				callingObj.TargetStation.exitCtrlRear := false
  			end
  			b := callingObj.TargetStation.exitCtrlOnce
  			if b
  				callingObj.TargetStation.exitCtrlOnce := false
  			end
  			if existsMethod(ctrl) 
  				callingObj.UserTargetExitCtrl := ctrl
  			end
  		end
  	else
  		return false
  	end
  end
