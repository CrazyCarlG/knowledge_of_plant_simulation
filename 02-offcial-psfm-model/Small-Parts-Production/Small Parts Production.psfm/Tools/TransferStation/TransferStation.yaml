 Name: checkNumberOfPartsWithType
 ID: 28
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  checks type of parts on the partstation or on the container on the partstation and
  counts the number of parts with the right type
  _________________________________________________________________________________
  Parameters	: container: PartStation or container which will be unloaded
  			  target: target of load or reload (may be NULL)
  ReturnValues: number of parts with the right type
  
  Called By	: checkTarget, PartExitControl, PartSensorControl, successfulExit
  Calls		: checkType, exitPartStation, getSensorPosition
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  19.04.2005  KM	check type of parts on line or track
  15.02.2006  KM  Nw2Way allowed
  25.08.2010  KM	MatrixLoadBay -> LoadbayType
  10.11.2014  KM  don't insert the same MU twice in waitingParts (Buffer of type stack)
  19.01.2018  KM  handle stacks on vehicle or container
  12.11.2021  KM  for parallelproc without startprocessingWhenFull sort the
  				finished parts according finishedTime
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param container,target : object -> integer
  
  var i,j,k,xdim,ydim : integer
  var station,p,part : object
  var t : table
  var num : integer
  
  station := self.~
  num := 0
  
  if container.internalClassType = "ParallelStation" and station.TargetIsContainer and
  		not station.unloadPartcontainer and (station.TypeSpecific or station.HomogeneousTarget)
  	-- type specific or homogeneous loading parts from a parallelproc
  	-- search finished parts on the partstation for the target
  	if target = void
  		return 0
  	end
  
  	if not container.startProcessingWhenFull
  		container.contentsList(t)
  		xdim := t.XDim
  		ydim := t.YDim
  
  		var t1 : table[object,time]
  		t1.create
  		var idim : integer := 1
  		for var ix := 1 to xDim
  			for var iy := 1 to yDim
  				p := t[ix,iy]
  				if p /= void and p.finished
  					t1[1,idim] := p
  					t1[2,idim] := p.FinishedTime
  					idim := idim + 1
  				end
  			next
  		next
  		t1.sort(2, "up")
  
  		for var iy := 1 to t1.YDim
  			p := t1[1,iy]
  			if station.checkType(p,target)
  				num := num +1
  				station.WaitingParts.append(p)
  				if num = station.Blocksize
  					return num
  				end
  			end
  		next
  		return num
  	end
  end
  
  t := station.getContentsList(container,station.PartSensorLane)	-- buffer austrittsbereites ganz hinten
  xdim := t.XDim
  ydim := t.YDim
  
  if xdim < 1 or ydim < 1
  	return 0
  end
  
  if station.PartSensorID /= 0 and station.PartStation = container
  	var spos : length
  	spos := station.getSensorPosition(1)
  	-- delete MUs from contentsList, which already have passed the sensor
  	i := 1
  	while i <= t.YDim
  		if t[2,i] >= spos
  			t.cutRow(i)
  		else
  			i := ydim+1
  		end
  	end
  	if t.YDim < 1 or t[3,1] < spos  -- all MUs have passed the sensor or the "first" MU has not reached the sensor
  		return 0
  	end
  	xdim := 1		-- austrittsbereites ganz vorne
  	ydim := 1		-- TODO search MUs for blocksize
  end
  
  if container.internalClassType = "Transporter" and
     container.LoadbayType /= "Store" and container.LoadbayType /= "Lager"
  	xdim := 1
  end
  
  i := xdim
  repeat
  	var datatype : string := t.getDataType(i)
  	j := ydim
  	repeat
  		var subtable : boolean
  		if datatype = "table" and t[i,j] /= void
  			k := t[i,j].yDim
  			subtable := true
  		else
  			k := 1
  			subtable := false
  		end
  
  		repeat
  			if subtable
  				p := t[i,j][1,k]
  			else
  				p := t[i,j]
  			end
  
  			if p /= void and (station.PartSensorID /= 0 or station.PartStation /= container or p.finished)
  				if station.checkType(p,target)
  					num := num + 1
  					if station.PartStation = container
  						if station.PartStation.internalClassType = "Buffer" and station.PartStation.BufferType = "Stack"
  							station.WaitingParts.setCursor(1)
  							if not station.WaitingParts.find(@)
  								station.WaitingParts.insert(1,@)
  							end
  						else
  							station.WaitingParts.append(p)
  						end
  					end
  				else
  					if station.PartSensorID = 0 and station.PartStation = container
  						station.exitPartStation(p)
  					end
  				end
  			end
  			k := k - 1
  		until num = station.Blocksize or k < 1
  		j := j - 1
  	until num = station.Blocksize or j < 1
  	i := i - 1
  until num = station.Blocksize or i < 1
  return num
 ShowInTooltip: false
