 Name: deleteSensor
 ID: 94
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  deletes a sensor
  _________________________________________________________________________________
  Parameters	: type = 1, sensor on partstation; type = 2, sensor on targetstation
  			  pos1, position of the sensor
  			  act, activate always the sensor (if way)
  			  lane if twolanetrack  (1:lane A, 2:lane B, 3:A+B,pos1 on A, 4:A+B,pos1 on B
  ReturnValues: sensorID
  
  Called By	: setPartStation, setTargetStation
  Calls		: 
  
  Author		: Karola Mock, Tecnomatix
  Date		: 23.02.2005
  
  _________________________________________________________________________________
  History:
  
  15.02.2006  KM  Nw2Way allowed
  12.04.2016  KM	use new syntax in executeSilent
  13.07.2018  KM  Attributname "Ctrl" durch neuen Namen "Control" ersetzt
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param type : integer
  
  var callingObj : object
  var stationAttr : string
  var station: object
  var sttype,id : integer
  var r : integer
  var lane : integer
  
  callingObj := self.~
  
  if type = 1 
  	lane := callingObj.PartSensorLane
  	id := callingObj.PartSensorID
  	stationAttr := "PartStation"
  elseif type = 2 
  	lane := callingObj.TargetSensorLane
  	id := callingObj.TargetSensorID
  	stationAttr := "TargetStation"
  else
  	return
  end
  
  station := callingObj.getAttribute(stationAttr)
  sttype := callingObj.getInternalClassType(station)
  
  if sttype = 3 
  	if lane = 1 or lane = 3 
  		r := executeSilent("param o:object, ti:integer -> integer; o.A.deleteSensor(ti); return 1",station, id)
  		if r /= 1 
  			-- delete sensor not possible
  			station.A.sensorID(id).Front := false
  			station.A.sensorID(id).Rear := false
  			station.A.sensorID(id).Position := 0
  			station.A.sensorID(id).Control := ""
  		end
  	else
  		r := executeSilent("param o:object, ti:integer -> integer; o.B.deleteSensor(ti); return 1",station, id)
  		if r /= 1 
  			-- delete sensor not possible
  			station.B.sensorID(id).Front := false
  			station.B.sensorID(id).Rear := false
  			station.B.sensorID(id).Position := 0
  			station.B.sensorID(id).Control := ""
  		end
  	end
  else		
  	r := executeSilent("param o:object, ti:integer -> integer; o.deleteSensor(ti); return 1",station, id)
  	if r /= 1 
  		-- delete sensor not possible
  		station.sensorID(id).Front := false
  		station.sensorID(id).Rear := false
  		station.sensorID(id).Position := 0
  		station.sensorID(id).Control := ""
  	end
  end
 ShowInTooltip: false
