 Name: resetUserStation
 ID: 57
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  resets sensor or exitctrl of partstation or targetstation
  _________________________________________________________________________________
  Parameters	: type = 1, sensor on partstation; type = 2, sensor on targetstation
  ReturnValues: none
  
  Called By	: setPartStation, setTargetStation, OnDelete
  Calls		: checkSensorID, checkExitCtrl, getInternalClassType, deleteSensor
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  23.02.2005  KM	if deleteSensor is not possible (inherited), deactivate it
  15.02.2006  KM  Nw2Way allowed
  27.09.2006  KM  allow part or targetstation in other frame than the transferStation
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param type : integer
  
  var callingObj : object
  var ctrl,stationAttr : string
  var UserexitCtrlAttr,userexitctrl : string
  var station: object
  var str : string
  var sttype : integer
  
  callingObj := self.~
  
  if type = 1 
  	stationAttr := "PartStation"
  	UserexitCtrlAttr := "UserPartExitCtrl"
  elseif type = 2 
  	stationAttr := "TargetStation"
  	UserexitCtrlAttr := "UserTargetExitCtrl"
  else
  	return
  end
  
  station := callingObj.getAttribute(stationAttr)
  
  if (station /= void) 
  	sttype := callingObj.getInternalClassType(station)
  	if sttype > 0 
  		if callingObj.checkSensorID(type,makePathRelative(callingObj, station)) 
  			callingObj.deleteSensor(type)
  		end
  	else
  		if callingObj.checkExitCtrl(type) 
  			userexitctrl := callingObj.getAttribute(UserexitCtrlAttr)
  			if userexitctrl = "" 
  				station.exitCtrl := ""
  			else
  				if existsObject(userexitctrl) 
  					station.exitCtrl := makePathRelative(str_to_obj(userexitctrl),station)
  				else
  					-- usermethod is a custom attribute
  					ctrl := userexitctrl
  					str := makePathRelative(station)
  					if strLpos(str,userexitctrl) = 1 
  						ctrl := strOmit(ctrl,1,strlen(str))
  						ctrl := strIncl("self",ctrl,1)
  					end
  					station.exitCtrl := ctrl
  				end
  			end
  		end
  	end
  end
