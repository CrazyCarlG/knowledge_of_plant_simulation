 Name: stopObject
 ID: 19
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  stops or moves the parts or targets. Consider the type of object and
  the location.
  _________________________________________________________________________________
  Parameters	: obj: Object which should be stopped or moved
  			  stop : if true stop the object
  ReturnValues: none
  
  Called By	: finishLoading, movePartToStation, PartExitControl,
  			  PartSensorcontrol, successfulExit, TargetSensorControl
  Calls		: exitTargetStation, exitPartStation, getInternalClassType
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  31.01.2006  KM	user control for line and track
  15.02.2006  KM  Nw2Way allowed
  16.02.2006  KM  tugger train
  25.09.2007  KM  vehicle on line
  20.02.2008  KM	UserMethod can have an argument
  03.06.2008  KM  use attribute stopped also for vehicles
  09.09.2013  KM  for non accumulating lines stop the line itself not the MU
  01.04.2016  KM  SimTalk 2.0
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param obj : object, stop : boolean
  
  var station : object
  var type : integer
  var tractor : object
  
  station := self.~
  type := station.getInternalClassType(obj.location)
  
  if not stop
  	-- continue object
  	if type > 0
  		-- length oriented
  		if obj = station.WaitingTargets[1]
  			-- obj is target
  			if station.UserTargetExitCtrl = ""
  				if type = 1 		-- Line
  					if obj.location.accumulating
  						obj.stopped := false
  					else
  						obj.location.stopped := false
  					end
  				elseif obj.internalClassType = "Transporter"
  					tractor := obj.getTractor
  					if tractor /= void
  						tractor.stopped := false
  					else
  						obj.stopped := false
  					end
  				end
  			else
  				if str_to_method(station.UserTargetExitCtrl).checkArguments(true)
  					str_to_method(station.UserTargetExitCtrl).execute(true,obj,station.TargetStation)
  				else
  					str_to_method(station.UserTargetExitCtrl).execute(obj,station.TargetStation)
  				end
  			end
  		else
  			-- obj is part
  			if station.UserPartExitCtrl = ""
  				if type = 1
  					if obj.location.accumulating
  						obj.stopped := false
  					else
  						obj.location.stopped := false
  					end
  				elseif obj.internalClassType = "Transporter"
  					tractor := obj.getTractor
  					if tractor /= void
  						tractor.stopped := false
  					else
  						obj.stopped := false
  					end
  				end
  			else
  				if str_to_method(station.UserPartExitCtrl).checkArguments(true)
  					str_to_method(station.UserPartExitCtrl).execute(true,obj,station.PartStation)
  				else
  					str_to_method(station.UserPartExitCtrl).execute(obj,station.PartStation)
  				end
  			end
  		end
  	else
  		-- point oriented
  		if obj = station.WaitingTargets[1]
  			station.exitTargetStation(obj)
  		elseif station.unloadPartcontainer
  			station.exitPartStation(obj)
  		end
  	end
  else
  	-- stop object	(not needed on point oriented)
  	if type = 1
  		if obj.location.accumulating
  			obj.stopped := true	-- Line
  		else
  			obj.location.stopped := true
  		end
  	elseif type > 1 	-- length oriented
  		if obj.internalClassType = "Transporter"
  			tractor := obj.getTractor
  			if tractor /= void
  				tractor.stopped := true
  			else
  				obj.stopped := true
  			end
  		end
  	end
  end
