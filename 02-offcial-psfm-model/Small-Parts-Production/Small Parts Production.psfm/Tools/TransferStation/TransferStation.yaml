 Name: targetFull
 ID: 52
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  checks whether the target is full;the parts on the station (just loading) were counted too
  _________________________________________________________________________________
  Parameters	: target: target of load or reload
  ReturnValues: true, if Target is full
  
  Called By	: PartExitControl, PartSensorControl, successfulExit
  Calls		:
  
  Author		: Karola Mock, Siemens PLM Software
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  23.02.2006  KM	vehicles mit lineloadbay: also check capacity
  25.08.2010  KM	MatrixLoadBay -> LoadbayType
  09.09.2010	KM	consider capacity -1
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param target : object -> boolean
  
  var station : object
  var mulength : length
  var l : length
  var t : table
  var i,j : integer
  
  station := self.~
  if target.internalClassType /= "Transporter" or
     target.LoadbayType = "Store" or target.LoadbayType = "Lager"
  	if (target.capacity = -1 or
  	   	target.capacity-(target.numMU+station.numMU) >= station.Blocksize)
  		return false
  	else
  		return true
  	end
  else
  	-- lineloadbay
  	if target.capacity /= -1
  		if (target.capacity-(target.numMU+station.numMU) < station.Blocksize)
  			return true
  		end
  	end
  
  	if target.numMU > 0
  		mulength := target.occupiedLength / target.numMU
  	else
  		mulength := 0
  	end
  
  	l := target.occupiedLength
  	t.create
  	station.contentsList(t)
  	for i := 1 to t.XDim
  		for j := 1 to t.YDim
  			if t[i,j] /= void
  				l := l + t[i,j].length
  			end
  		next
  	next
  
  	if (target.loadBayLength-l >= station.Blocksize*mulength)
  		return false
  	else
  		return true
  	end
  end
