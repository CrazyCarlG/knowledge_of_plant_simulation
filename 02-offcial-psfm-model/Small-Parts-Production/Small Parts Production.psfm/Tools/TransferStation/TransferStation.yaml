 Name: OnRename
 ID: 56
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  renames sensorctrl and destination of the sensor or exitctrl on partstation or targetstation
  _________________________________________________________________________________
  Parameters	: 
  ReturnValues: none
  
  Called By	: System
  Calls		: getInternalClassType, checkSensorID, setSensorCtrl, getSensorActivate,
  			  setSensorDestination
  
  Author		: Karola Mock, Tecnomatix
  Date		: 15.02.2006
  
  _________________________________________________________________________________
  History:
  
  22.09.2006  KM  allow part or targetstation in other frame than the transferStation
  02.11.2006  KM  part station or target station may be void
  16.09.2011  KM  create rear triggered sensor control when unloading to line/track to
  				avoid periodic try to unload the part when first unload wasn't possible
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param oldName, newName: string, manually: boolean
  
  var type : integer
  var oldRelName, newRelName : string
  var ipos : integer
  
  -- @,?: the object the control was called for
  if (?.PartStation /= void) 
  	type := ?.getInternalClassType(?.PartStation)
  	newRelName := makePathRelative(?,?.PartStation)
  	ipos := strRpos(newName, newRelName)
  	oldRelName := strCopy(newRelName,1,ipos-1) + oldName
  	if (type > 0) 
  		if ?.checkSensorID(1,oldRelName) 
  			?.setSensorCtrl(1,newRelName+".PartSensorControl")
  			if type > 1 and ?.getSensorActivate(1) = 2 
  				?.setSensorDestination(1,?)
  			end
  		end
  	elseif type = 0 
  		if to_str(?.PartStation.exitCtrl) ~= (oldRelName + ".PartExitControl") 
  			?.PartStation.exitCtrl := newRelName+".PartExitControl"
  		end
  	end
  end
  
  if (?.TargetStation /= void) 
  	type := ?.getInternalClassType(?.TargetStation)
  	newRelName := makePathRelative(?,?.TargetStation)
  	ipos := strRpos(newName, newRelName)
  	oldRelName := strCopy(newRelName,1,ipos-1) + oldName
  	if (type > 0) 
  		if ?.checkSensorID(2,oldRelName) 
  			?.setSensorCtrl(2,newRelName+".TargetSensorControl")
  			
  			if type > 1 and ?.getSensorActivate(2) = 2 
  				?.setSensorDestination(2,?)
  			end
  		end
  	elseif type = 0 
  		if to_str(?.TargetStation.exitCtrl) ~= (oldRelName + ".TargetExitControl") 
  			?.TargetStation.exitCtrl := newRelName+".TargetExitControl"
  		end
  	end
  end
