 Name: Init
 ID: 8
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  Init of the TransferStation. Configuration check.
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	:
  Calls		: some check routines
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  18.02.2005  KM	TransferStation should be empty
  08.07.2005  KM	Parameter of checkStationClass
  23.09.2005  KM	init ReadyTargets
  31.01.2006  KM	user control for line and track
  15.02.2006  KM  Nw2Way allowed
  21.03.2006  KM  Parameter of checkStationClass, don't allow TransferStation
  19.05.2005  KM	blocksize > 1 and load or move only allowed for part station of
  				type parallelproc
  22.09.2006  KM  allow part or targetstation in other frame than the transferStation
  21.10.2009  KM  blocksize > 1: check capacity of target
  16.09.2011  KM  create rear triggered sensor control when unloading to line/track to
  				avoid periodic try to unload the part when first unload wasn't possible
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var station : object
  var comp : boolean
  var type : integer
  
  station := self.~
  while station.cont /= void
  	station.cont.delete
  end
  station.CurrIcon := "operational"
  station.ConfigurationError := false
  station.Status := "waiting"
  station.MovedBlocks := 0
  station.ContinueTarget := false
  station.BlocksizePart := void
  station.Parttype := ""
  station.Containertype := ""
  station.WaitingParts.delete
  station.WaitingTargets.delete
  station.ReadyTargets.delete
  
  if station.PartStation = void or not existsobject(to_str(station.PartStation))
  	station.errorMessage(7,2)
  	return
  end
  
  if station.TargetStation = void or not existsobject(to_str(station.TargetStation))
  	station.errorMessage(8,2)
  	return
  end
  
  type := station.getInternalClassType(station.PartStation)
  if station.checkStationClass(station.PartStation,1)
  	if type > 0
  		if not station.checkSensorID(1,makePathRelative(station,station.PartStation))
  			station.errorMessage(12,2)
  			return
  		end
  	else
  		if not station.checkExitCtrl(1)
  			station.errorMessage(18,2)
  			return
  		end
  	end
  	if not station.checkUserExitCtrl(1)
  		station.errorMessage(23,2)
  		return
  	end
  	if station.Blocksize > 1 and not station.unloadPartcontainer and
  	   station.PartStation.internalClassType /= "ParallelStation"
  		station.Blocksize := 1
  	end
  else
  	station.errorMessage(17,2)
  	return
  end
  
  if station.PartStation.internalClassType = "Buffer" and
      station.PartStation.BufferType = "Stack"  and
      station.unloadPartcontainer
  	station.errorMessage(15,2)
  	return
  end
  
  type := station.getInternalClassType(station.TargetStation)
  if station.checkStationClass(station.TargetStation,2)
  	if type > 0
  		if not station.checkSensorID(2,makePathRelative(station,station.TargetStation))
  			station.errorMessage(13,2)
  			return
  		end
  		if not station.TargetIsContainer
  			if not station.checkSensorIDForUnload(makePathRelative(station,station.TargetStation))
  				station.errorMessage(13,2)
  				return
  			end
  		end
  	else
  		comp := station.checkExitCtrl(2)
  		if (station.TargetIsContainer and not comp) or
  		   (not station.TargetIsContainer and comp)
  			station.errorMessage(19,2)
  			return
  		end
  	end
  	if not station.checkUserExitCtrl(2)
  		station.errorMessage(23,2)
  		return
  	end
  	if station.Blocksize > 1 and not station.TargetIsContainer and
  	   station.TargetStation.capacity /= -1 and
  	   station.TargetStation.capacity < station.Blocksize
  		station.Blocksize := station.TargetStation.capacity
  	end
  else
  	station.errorMessage(17,2)
  	return
  end
  
  if station.TargetStation.internalClassType = "Buffer" and
      station.TargetStation.BufferType = "Stack"  and
      station.TargetIsContainer
  	station.errorMessage(16,2)
  	return
  end
  
  if not station.checkUserExitCtrl(3)
  	station.errorMessage(23,2)
  	return
  end
  
  if station.PartStation = station.TargetStation
  	if type = 0
  		station.errorMessage(25,2)
  	else
  		if (station.PartSensorID = station.TargetSensorID) or
  		   (station.getSensorPosition(1) =
  		    station.getSensorPosition(2))
  			station.errorMessage(25,2)
  		end
  	end
  end
  
  if station.PartStation /= void and not station.unloadPartcontainer and
     station.PartStation.capacity /= -1 and
     station.PartStation.capacity < station.Blocksize
  	station.errorMessage(1,2)
  end
