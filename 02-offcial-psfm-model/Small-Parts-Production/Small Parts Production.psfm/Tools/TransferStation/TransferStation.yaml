 Name: checkSensorID
 ID: 42
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  checks whether the sensorID exists and has the right control
  _________________________________________________________________________________
  Parameters	: type = 1, sensor on partstation; type = 2, sensor on targetstation
  			  name, path of the transferstation
  ReturnValues: true if correct sensor
  
  Called By	: setPartStation, setTargetStation, dialogInit, getPartStation,
  			  getTargetStation, Init, resetUserStation, OnRename
  Calls		: 
  
  Author		: Karola Mock, Tecnomatix
  Date		: 23.02.2005
  
  _________________________________________________________________________________
  History:
  
  15.02.2006  KM  Nw2Way allowed
  22.03.2006  KM	wrong check of targetsensor without sensorcontrol
  13.07.2018  KM  Attributname "Ctrl" durch neuen Namen "Control" ersetzt
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param type : integer, name : string -> boolean
  
  var station : object
  var sensorstation : object
  var ctrl : string
  var iC : integer
  var lane,newlane,id : integer
  var sctrl,sctrl2 : string
  var a,b : boolean
  var laneAttr : string
  
  station := self.~
  if type = 1 
  	sensorstation := station.PartStation
  	lane := station.PartSensorLane
  	laneAttr := "PartSensorLane"
  	id := station.PartSensorID
  	ctrl := name + ".PartSensorControl"
  else
  	sensorstation := station.TargetStation
  	lane := station.TargetSensorLane
  	laneAttr := "TargetSensorLane"
  	id := station.TargetSensorID
  	ctrl := name + ".TargetSensorControl"
  end
  iC := station.getInternalClassType(sensorstation)
  if iC = 3 
  	-- Nw2Way
  	if sensorstation.A.existsSensorID(id) 
  		sctrl := to_str(sensorstation.A.sensorID(id).Control)
  		if sctrl ~= ctrl or (type = 2 and sctrl = "VOID") 
  			a := true
  		else
  			a := false
  		end
  	else
  		a := false
  	end
  	if sensorstation.B.existsSensorID(id) 
  		sctrl := to_str(sensorstation.B.sensorID(id).Control)
  		if sctrl ~= ctrl or (type = 2 and sctrl = "VOID") 
  			b := true
  		else
  			b := false
  		end
  	else
  		b := false
  	end
  	if a or b 
  		if a and b 
  			if lane = 1 or lane = 3 
  				newlane := 3
  			else
  				newlane := 4
  			end
  		elseif a 
  			newlane := 1
  		else
  			newlane := 2
  		end
  		if newlane /= lane 
  			station.setAttribute(laneAttr, newlane)
  		end
  		return true
  	else
  		return false
  	end
  else
  	if sensorstation.existsSensorID(id) 
  		sctrl := to_str(sensorstation.sensorID(id).Control)
  		if sctrl ~= ctrl or (type = 2 and sctrl = "VOID") 
  			return true
  		else
