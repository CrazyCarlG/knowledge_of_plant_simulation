 Name: checkStationClass
 ID: 53
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  checks whether the class is allowed for partstation or targetstation
  _________________________________________________________________________________
  Parameters	: type: 0: partstation or targetstation
  					1: check partstation
  					2: check targetstation
  ReturnValues: true if class is allowed
  
  Called By	: Init, OnDragDrop, setPartStation, setTargetStation,
  			  TransferStationDialog.callback
  Calls		:
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  08.07.2005  KM	Source allowed for partstation, drain for targetstation
  15.02.2006  KM	Nw2Way allowed
  21.03.2006  KM  Parameter of checkStationClass, don't allow TransferStation
  19.05.2006  KM  NwDismantle allowed and NwAssembler as part station allowed
  12.11.2008  KM  Drain only allowed for unload or parttransfer
  12.02.2009  KM  Store allowed as targetstation for unload or parttransfer
  12.11.2015  KM  DePortioner allowed as targetstation for unload or parttransfer and Portioner allowed as partStation
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param obj : object, type : integer -> boolean
  -- checks the allowed class of partstation or targetstation
  
  var iCN : string
  var i : integer
  
  iCN := obj.internalClassType
  if iCN = "Conveyor" or iCN = "Track" or iCN = "TwoLaneTrack" or
     iCN = "Station" or iCN = "DismantleStation" or
     iCN = "PlaceBuffer" or iCN = "Buffer" /*or iCN = "Sorter" */
  	return true
  elseif iCN = "ParallelStation"
  	-- not allowed : Transferstation
  	i := obj.getAttrNo("AOLType")
  	if i=0 or obj.getAttrValue(i) /= "LoadUnload"
  		return true
  	else
  		return false
  	end
  elseif iCN = "Source" or iCN = "AssemblyStation" or iCN = "Portioner"
  	if type /= 2
  		return true
  	else
  		return false
  	end
  else
  	if (iCN = "Drain" or iCN = "Store" or iCN = "DePortioner") and type /= 1 and not self.~.TargetIsContainer
  		return true
  	else
  		return false
  	end
  end
