 Name: getParameterTable
 ID: 31
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  Returns the parameter of the TransferStation.
  _________________________________________________________________________________
  Parameters	: 
  ReturnValues: 
  
  Called By	: User
  Calls		: getInternalClassType, checkSensorID,
  			  getSensorPosition, getSensorActivate, laneIntToString
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  
  22.09.2006  KM  allow part or targetstation in other frame than the transferStation
  10.10.2007  PS  Localization
  11.10.2007  KM  return value activate only german or english
  03.02.2011  KM  use UserInterfaceLanguage
  12.02.2013  KM  stream removed
  12.04.2016  KM	use new syntax in executeSilent
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param tablename : string
  
  var station : object
  var restab : object
  var ressubtab : table
  var r : integer
  var type : string
  var sensorpos1 : length
  var sensorpos2 : length
  var sensoractivate1 : string
  var sensoractivate2 : string
  var sttype : integer
  var iCN : string
  var iC : integer
  var act : integer
  var lang : integer
  var lane1,lane2 : string
  
  if not existsObject(tablename) 
  	return
  end
  
  station := self.~
  
  restab := tablename
  restab.delete
  restab.columnWidth := 10
  restab.MaxXDim := 23
  restab.setDataType(14,"table")
  restab.setDataType(13,15,16,"boolean")
  restab.setDataType(1,10,11,12,"integer")
  restab.setDataType(8,"real")
  restab.setDataType(6,7,9,"time")
  restab.setDataType(2,4,"object")
  restab.setDataType(3,5,"length")
  restab.setDataType(17,18,19,20,21,22,23,"string")
  
  sttype := 4
  if station.unloadPartcontainer and station.TargetIsContainer 
  	sttype := 3
  elseif station.unloadPartcontainer 
  	sttype := 2
  elseif station.TargetIsContainer 
  	sttype := 1
  end
  
  lang := UserInterfaceLanguage + 1
  if lang > 2 
  	lang := 2
  end
  iC := station.getInternalClassType(station.PartStation)
  sensorpos1 := 0.0
  sensoractivate1 := ""
  lane1 := ""
  if (iC > 0) and station.checkSensorID(1,makePathRelative(station,station.PartStation)) 
  	sensorpos1 := station.getSensorPosition(1)
  	if iC > 1 
  		act := station.getSensorActivate(1)
  		sensoractivate1 := rootfolder.Localization.messageTab[lang,220+act]
  	end
  	if iC = 3 
  		lane1 := station.laneIntToString(station.PartSensorLane)
  	end
  end
  iC := station.getInternalClassType(station.TargetStation)
  sensorpos2 := 0.0
  sensoractivate2 := ""
  lane2 := ""
  if (iC > 0) and station.checkSensorID(2,makePathRelative(station,station.TargetStation)) 
  	sensorpos2 := station.getSensorPosition(2)
  	if iC > 1 
  		act := station.getSensorActivate(2)
  		sensoractivate2 := rootfolder.Localization.messageTab[lang,220+act]
  	end
  	if iC = 3 
  		lane2 := station.laneIntToString(station.TargetSensorLane)
  	end
  end
  	
  restab.writeRow(1,1,sttype,
  	station.PartStation,sensorpos1,station.TargetStation,sensorpos2)
  
  type := station.procTime.Type
  if type = "Const" or type = "Konst" 
  	restab[6,1] := station.procTime
  else
  	restab[6,1] := void
  end
  
  type := station.recoveryTime.Type
  if type = "Const" or type = "Konst" 
  	restab[7,1] := station.recoveryTime
  else
  	restab[7,1] := void
  end
  
  r := executeSilent("param ti:object -> integer; var t : real := ti.availability; return 1",station)
  if r = 1 
  	restab.writeRow(8,1,station.availability,station.MTTR,void)
  else
  	restab.writeRow(8,1,void,void,void)
  end
  
  restab.writeRow(11,1,station.Partnumber,station.Blocksize,
  	station.TypeSpecific,void,station.HomogeneousTarget,
  	station.AlwaysStopTarget,
  	sensoractivate1,sensoractivate2,station.UserPartExitCtrl,station.UserTargetExitCtrl,
  	station.UserCtrl,lane1,lane2)
  
  restab.createNestedList(14,1)
  ressubtab := restab[14,1]
  ressubtab.MaxXDim := 2
  ressubtab.insertList(1,1,station.TypeTable.copy)
 ShowInTooltip: false
