 Name: setStationtype
 ID: 69
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  sets the type of the TransferStation..
  _________________________________________________________________________________
  Parameters	: type:"Load","Beladen","Unload","Entladen","Reload","Umladen","Move",
  			  "Versetzen"
  ReturnValues: none
  
  Called By	: user
  Calls		: getInternalClassType, checkUserExitCtrl, checkSensorID, setSensorCtrl,
  			  checkExitCtrl
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  23.08.2005  KM	handling of line-oriented targetstation
  19.05.2005  KM	blocksize > 1 and load or move only allowed for part station of
  				type parallelproc
  27.09.2006  KM  allow part or targetstation in other frame than the transferStation
  12.11.2008  KM  Drain only allowed for unload or parttransfer
  26.08.2010	KM	exitCtrl must be front triggered
  16.09.2011  KM  create rear triggered sensor control when unloading to line/track to
  				avoid periodic try to unload the part when first unload wasn't possible
  12.11.2015  KM  DePortioner allowed as targetstation for unload or parttransfer and Portioner allowed as partStation
  05.10.2016	KM	exitCtrl must be triggered not only once
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param type : string
  
  var callingObj : object
  var oldTargetIsContainer : boolean
  var ctrl : string
  var userexitctrl,oldexitctrl : string
  var str : string
  var sttype : integer
  var callingObjRelName : string
  var b : boolean
  
  callingObj := self.~
  
  if callingObj.TargetStation /= void and (type ~= "Load" or type ~= "Beladen" or type ~= "Reload" or type ~= "Umladen")
  	if callingObj.TargetStation.internalClassType = "Drain" or callingObj.TargetStation.internalClassType = "Store" or
  	     callingObj.TargetStation.internalClassType = "DePortioner"
  		return
  	end
  end
  
  oldTargetIsContainer := callingObj.TargetIsContainer
  
  callingObj.unloadPartcontainer := false
  callingObj.TargetIsContainer := false
  
  if type ~= "Load" or type ~= "Beladen"
  	callingObj.TargetIsContainer := true
  elseif type ~= "Unload" or type ~= "Entladen"
  	callingObj.unloadPartcontainer := true
  elseif type ~= "Reload" or type ~= "Umladen"
  	callingObj.unloadPartcontainer := true
  	callingObj.TargetIsContainer := true
  end
  
  if not callingObj.unloadPartcontainer and callingObj.PartStation /= void and
     callingObj.PartStation.internalClassType /= "ParallelStation"
  	callingObj.Blocksize := 1
  end
  
  if callingObj.TargetStation = void
  	return
  end
  
  sttype := callingObj.getInternalClassType(callingObj.TargetStation)
  callingObjRelName := makePathRelative(callingObj, callingObj.TargetStation)
  
  if callingObj.TargetIsContainer and not oldTargetIsContainer
  	if sttype = 0
  		oldexitctrl := to_str(callingObj.TargetStation.exitCtrl)
  		if oldexitctrl ~= "VOID"
  			callingObj.UserTargetExitCtrl := ""
  		else
  			str := strCopy(oldexitctrl,1,5)
  			if str ~= "self."
  				oldexitctrl := strOmit(oldexitctrl,1,4)
  				oldexitctrl := strIncl(to_str(callingObj.TargetStation),oldexitctrl,1)
  			else
  				oldexitctrl := strIncl(to_str(callingObj.TargetStation.~)+".",oldexitctrl,1)
  			end
  			callingObj.UserTargetExitCtrl := makePathRelative(oldexitctrl,callingObj.~)
  		end
  		callingObj.TargetStation.exitCtrl := callingObjRelName + ".TargetExitControl"
  		b := callingObj.TargetStation.exitCtrlFront
  		if not b
  			callingObj.TargetStation.exitCtrlFront := true
  		end
  		b := callingObj.TargetStation.exitCtrlRear
  		if b
  			callingObj.TargetStation.exitCtrlRear := false
  		end
  		b := callingObj.TargetStation.exitCtrlOnce
  		if b
  			callingObj.TargetStation.exitCtrlOnce := false
  		end
  		if not callingObj.checkUserExitCtrl(2)
  			callingObj.UserTargetExitCtrl := ""
  		end
  	else
  		if callingObj.checkSensorID(2,callingObjRelName)
  			callingObj.setSensorCtrl(2,callingObjRelName+".TargetSensorControl")
  		end
  	end
  elseif not callingObj.TargetIsContainer and oldTargetIsContainer
  	if sttype = 0
  		if callingObj.checkExitCtrl(2)
  			userexitctrl := callingObj.UserTargetExitCtrl
  			if userexitctrl = ""
  				callingObj.TargetStation.exitCtrl := ""
  			else
  				if existsObject(userexitctrl)
  					callingObj.TargetStation.exitCtrl := makePathRelative(str_to_obj(userexitctrl),callingObj.TargetStation)
  				else
  					-- usermethod is a custom attribute
  					ctrl := userexitctrl
  					str := makePathRelative(callingObj.TargetStation)
  					if strLpos(str,ctrl) = 1
  						ctrl := strOmit(ctrl,1,strlen(str))
  						ctrl := strIncl("self",ctrl,1)
  					end
  					callingObj.TargetStation.exitCtrl := ctrl
  				end
  			end
  			callingObj.UserTargetExitCtrl := ""
  		end
  	else
  		if callingObj.checkSensorID(2,callingObjRelName)
  			callingObj.setSensorCtrl(2,callingObjRelName+".TargetSensorControl")
  		end
  	end
  end
