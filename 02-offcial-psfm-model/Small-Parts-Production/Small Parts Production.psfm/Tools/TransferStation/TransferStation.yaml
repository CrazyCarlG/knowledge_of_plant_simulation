 Name: checkTarget
 ID: 41
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  checks target on the targetstation:
  1. if AlwaysStopTarget is set, stop the target
  2. only stop the target if it has enough capacity and the right parts are ready
  _________________________________________________________________________________
  Parameters	: target: target of load or reload
  ReturnValues: true, if Target should be stopped
  
  Called By	: TargetExitControl, TargetSensorControl
  Calls		: checkNumberOfPartsWithType, checkType
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  24.02.2006  KM  don't stop target with capacity 0
  21.08.2006  KM  checkboxes for behavior of parts and targets for failure
  25.08.2010  KM	MatrixLoadBay -> LoadbayType
  01.04.2016  KM  SimTalk 2.0
  19.01.2018  KM  handle stacks on vehicle or container
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param target : object -> boolean
  
  var station,p : object
  var freecap : integer
  var neededcap : integer
  var freelength : length
  var neededlength : length
  var i,j,k,n,xdim : integer
  var t : table
  
  station := self.~
  
  if (station.pause or station.failed) and not station.StopTargetsForFailure
  	return false
  end
  
  if station.AlwaysStopTarget and target.capacity /= 0
  	return true
  end
  
  if station.WaitingParts.empty
  	return false
  else
  	if station.unloadPartcontainer
  		-- transfer from container to container
  		i := station.checkNumberOfPartsWithType(station.WaitingParts[1],target)
  		if i = 0
  			return false
  		end
  	else
  		-- load parts
  		if station.WaitingParts.dim < station.Blocksize
  			return false
  		end
  		n := 0
  		for i := 1 to station.WaitingParts.dim
  			if station.checkType(station.WaitingParts[i],target)
  				n := n + 1
  			end
  		next
  		if n < station.Blocksize
  			return false
  		else
  			if n < station.WaitingParts.dim
  				i := station.WaitingParts.dim
  				repeat
  					if not station.checkType(station.WaitingParts[i],target)
  						station.WaitingParts.remove(i)
  						-- TODO should parts exit station ??
  					end
  					i := i - 1
  				until i <= 0
  			end
  		end
  	end
  end
  
  if target.internalClassType = "Transporter" and
     target.LoadbayType /= "Store" and target.LoadbayType /= "Lager"
  	-- vehicle with loadbaylength
  	freelength := target.loadBayLength - target.occupiedLength
  	neededlength := 0.0
  	if station.unloadPartcontainer
  		-- reload
  		t.create
  		p := station.WaitingParts[1]
  		p.contentsList(t)
  		if p.internalClassType = "Transporter" and
     			p.LoadbayType /= "Store" and p.LoadbayType /= "Lager"
  			xdim := 1
  		else
  			xdim := t.XDim
  		end
  		i := 1
  		n := 0
  		repeat
  			var datatype : string := t.getDataType(i)
  			j := 1
  			repeat
  				var zDim : integer
  				var subtable : boolean
  				if datatype = "table" and t[i,j] /= void
  					zDim := t[i,j].yDim
  					subtable := true
  				else
  					zDim := 1
  					subtable := false
  				end
  
  				k := 1
  				repeat
  					if subtable
  						p := t[i,j][1,k]
  					else
  						p := t[i,j]
  					end
  
  					if p /= void and station.checkType(p,target)
  						n := n + 1
  						neededlength := neededlength + p.length
  					end
  					k := k + 1
  				until n = station.Blocksize or k > zDim
  				j := j + 1
  			until n = station.Blocksize or j > t.YDim
  			i := i + 1
  		until n = station.Blocksize or i > xdim
  	else
  		-- load
  		for i := 1 to station.Blocksize
  			neededlength := neededlength + station.WaitingParts[i].length
  		next
  	end
  	if neededlength > freelength
  		return false
  		-- TODO what's with the cut Waitingparts (see above)
  	end
  end
  
  if target.capacity = -1
  	return true
  else
  	freecap := (target.capacity-target.numMU)
  	if station.Partnumber <= -1
  		neededcap := station.Blocksize
  	else
  		neededcap := station.Partnumber * station.Blocksize
  	end
  	if (freecap >= neededcap)
  		return true
  	else
  		return false
  	end
  end
 ShowInTooltip: false
