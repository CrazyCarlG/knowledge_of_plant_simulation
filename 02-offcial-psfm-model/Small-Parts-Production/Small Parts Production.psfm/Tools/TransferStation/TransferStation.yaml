 Name: setSensorCtrl
 ID: 92
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  sets the control of the sensor on partstation or targetstation
  _________________________________________________________________________________
  Parameters	: type : 1 = partstation, 2 = targetstation
  			  act: new control of the sensor
  ReturnValues: none
  
  Called By	: setTargetStation, OnRename, setStationType
  Calls		:
  
  Author		: Karola Mock, Tecnomatix
  Date		: 15.02.2006
  
  _________________________________________________________________________________
  History:
  
  16.09.2011  KM  create rear triggered sensor control when unloading to line/track to
  				avoid periodic try to unload the part when first unload wasn't possible
  13.07.2018  KM  Attributname "Ctrl" durch neuen Namen "Control" ersetzt
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param type : integer, act : string
  
  var station,trstation : object
  var id : integer
  var lane : integer
  var sensor : any
  var ctrlFront : boolean
  var ctrlRear  : boolean
  var lightBarrier : boolean
  
  trstation := self.~
  
  ctrlFront := true
  ctrlRear := false
  lightBarrier := false
  
  if type = 1
  	station := trstation.PartStation
  	id := trstation.PartSensorID
  	lane := trstation.PartSensorLane
  elseif type = 2
  	station := trstation.TargetStation
  	id := trstation.TargetSensorID
  	lane := trstation.TargetSensorLane
  	if not trstation.TargetIsContainer
  		ctrlFront := false
  		ctrlRear := true
  		lightBarrier := true
  	end
  else
  	return
  end
  
  if station.internalClassType = "TwoLaneTrack"
  	if lane = 1 or lane = 3
  		sensor := station.A.sensorID(id)
  	elseif lane = 2 or lane = 4
  		sensor := station.B.sensorID(id)
  	end
  else
  	sensor := station.sensorID(id)
  end
  sensor.Control := act
  sensor.Front := ctrlFront
  sensor.Rear := ctrlRear
  sensor.LightBarrierMode := lightBarrier
