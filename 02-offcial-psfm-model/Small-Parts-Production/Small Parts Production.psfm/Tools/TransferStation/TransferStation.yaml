 Name: movePartToStation
 ID: 26
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  Starts the move of the right parts from the partstation to the transferStation
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	: StartMoveInUserMethod
  Calls		: stopObject, parttypeToStation
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  23.09.2005  KM	stopObject(station.WaitingTargets[1],... buggy because stopObject
  				uses WaitingTargets
  25.08.2010  KM	MatrixLoadBay -> LoadbayType
  01.04.2016  KM  SimTalk 2.0
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var station:object
  var num : integer
  var part : object
  var i : integer
  var t : table
  
  station := self.~
  part :=	station.WaitingParts[1]
  if station.unloadPartcontainer
  	-- unload or transfer from container to container
  	-- Unload: no starting of WaitingPart
  	t.create
  	part.contentsList(t)
  	if part.internalClassType = "Transporter" and
     		part.LoadbayType /= "Store" and part.LoadbayType /= "Lager"
  		for i := t.XDim downto 2
  			t.cutColumn(i)
  		next
  	end
  
  	num := station.parttypeToStation(t)
  	if num = 0
  		-- there are no parts with the right type
  		if station.TypeSpecific
  			station.stopObject(station.WaitingParts.remove(1),false)
  			station.Containertype := ""
  		else
  			station.stopObject(station.WaitingTargets[1],false)
  			station.WaitingTargets.remove(1)
  			station.Parttype := ""
  		end
  	end
  else
  	-- load or transfer from station to station
  	station.stopObject(part,false)		-- for parts on line and track
  	-- TODO Blocksize > 1 funktioniert bisher nur für parallelprocs
  	t.create
  	t.MaxXDim := 1
  	t.setDataType(1,"object")
  	t.insertList(1,1,station.WaitingParts.copy)
  	num := station.parttypeToStation(t)
  	if num = 0
  		if station.WaitingTargets.occupied
  --			if station.PartStation.full and station.WaitingTargets.occupied then
  			-- there are no parts with the right type
  			station.stopObject(station.WaitingTargets[1],false)
  			station.WaitingTargets.remove(1)
  			station.Parttype := ""
  			station.Containertype := ""
  		end
  	end
  end
