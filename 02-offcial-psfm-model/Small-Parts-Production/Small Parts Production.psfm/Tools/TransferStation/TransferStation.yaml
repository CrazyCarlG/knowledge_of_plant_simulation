 Name: exitStation
 ID: 38
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  moves parts from TransferStation to targetstation (unload or move) or
  to target on targetstation (load or reload)
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues:
  
  Called By	: OnExit
  Calls		: getSensorPosition, successfulExit
  
  Author		: Karola Mock, Siemens PLM Software
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  15.02.2006  KM  Nw2Way allowed
  18.05.2006  KM  error message in console if transfer fails
  25.08.2006  KM	no multiple call for example for failed target station
  10.10.2007  PS  Localization
  27.04.2009  KM  unload of a block to a line should be possible
  21.10.2009  KM  transfer of a block: wait for enough free capacity
  25.08.2010  KM	MatrixLoadBay -> LoadbayType
  09.09.2010	KM	consider capacity -1
  16.09.2011  KM  create rear triggered sensor control when unloading to line/track to
  				avoid periodic try to unload the part when first unload wasn't possible
  11.03.2013	KM	consider capacity and entranceLocked for length oriented targetstation;
  				set BlocksizePart when not all parts can be moved
  09.04.2013	KM	move part to lane B on Nw2Way;
  22.07.2013	KM	superfluous error message removed (when part can not leave transferstation);
  09.09.2013	KM	consider failure, pause and stopped for length oriented targetstation;
  01.04.2016  KM  SimTalk 2.0
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var station:object
  var ipos : length
  var i : integer
  var transferOK : boolean
  var transferFailed : boolean
  var target : object
  var part : object
  var partlength : length
  var lane : integer
  
  station := self.~
  
  transferOK := true
  if station.TargetIsContainer 		-- LoadStation/Transfer to container
  	target := station.WaitingTargets[1]
  	if target.internalClassType /= "Transporter" or
     		target.LoadbayType = "Store" or target.LoadbayType = "Lager"
  		for i := 1 to station.numMU
  			if not station.cont.move(target)
  				print to_str(station)+": "+rootfolder.Localization.getText(205)
  				-- protokoll
  				transferOK := false
  				station.Status := "blocked"
  			end
  		next
  	else
  		-- vehicle with loadBayLength
  		for i := 1 to station.numMU
  			ipos := target.loadBayLength - target.occupiedLength
  			if not station.cont.insert(target,ipos)
  				print to_str(station)+": "+rootfolder.Localization.getText(205)
  				-- mustn' happen
  				transferOK := false
  				station.Status := "blocked"
  			end
  		next
  	end
  else	-- UnloadStation or transfer from station to station
  	if station.TargetStation.capacity /= -1
  		waituntil station.TargetStation.capacity-station.TargetStation.numMU >= station.numMU prio 1
  	end
  	if station.TargetSensorID = 0
  		for i := 1 to station.numMU
  			if not station.cont.move(station.TargetStation)
  				transferOK := false
  				station.Status := "blocked"
  			end
  		next
  	else
  		-- length oriented target station
  		waituntil not station.TargetStation.failed prio 1
  		waituntil not station.TargetStation.pause prio 1
  		waituntil not station.TargetStation.stopped prio 1
  
  		if station.TargetStation.internalClassType ~= "TwoLaneTrack"
  			lane := station.TargetSensorLane
  			if lane = 1 or lane = 3
  				waituntil not station.TargetStation.A.entranceLocked prio 1
  			else
  				waituntil not station.TargetStation.B.entranceLocked prio 1
  			end
  		else
  			waituntil not station.TargetStation.entranceLocked prio 1
  		end
  		ipos := station.getSensorPosition(2)
  		for i := 1 to station.numMU
  			transferFailed := false
  			part := station.cont
  			partlength := part.length
  			if station.TargetStation.internalClassType ~= "TwoLaneTrack"
  				if lane = 1 or lane = 3
  					if ipos = 0
  						if not part.transfer(station.TargetStation.A,ipos)
  							transferFailed := true
  						end
  					else
  						if not part.insert(station.TargetStation.A,ipos)
  							transferFailed := true
  						end
  					end
  				else
  					if ipos = 0
  						if not part.transfer(station.TargetStation.B,ipos)
  							transferFailed := true
  						end
  					else
  						if not part.insert(station.TargetStation.B,ipos)
  							transferFailed := true
  						end
  					end
  				end
  			else
  				if ipos = 0
  					if not part.transfer(station.TargetStation,ipos)
  						transferFailed := true
  					end
  				else
  					if not part.insert(station.TargetStation,ipos)
  						transferFailed := true
  					end
  				end
  			end
  			ipos := ipos - partlength
  			if transferFailed
  				transferOK := false
  				station.Status := "blocked"
  			end
  		next
  	end
  end
  
  if transferOK
  	station.successfulExit
  else
  	station.BlocksizePart := station.cont
  end
