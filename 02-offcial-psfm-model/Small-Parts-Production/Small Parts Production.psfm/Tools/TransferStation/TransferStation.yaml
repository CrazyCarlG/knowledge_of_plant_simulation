 Name: waitForReadyStation
 ID: 61
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  waits for a ready transferstation.
  _________________________________________________________________________________
  Parameters	: 
  ReturnValues: true when station is ready
  
  Called By	: successfulExit, PartSensorControl, PartExitControl,
  			  TargetExitControl, TargetSensorControl
  Calls		: 
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  07.11.2011  KM  check timeUntilEntranceOpen again after wait
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  -> boolean
  var station : object
  var t : real
  
  station := self.~
  
  if station.empty 
  
  	waituntil station.empty and (not station.pause) and 
  	(not station.failed) prio 1
  	
  	t := station.timeUntilEntranceOpen
  	if t > 0.0 
  		wait t
  		t := station.timeUntilEntranceOpen
  		if t > 0.0 
  			return
  		end
  	end
  
  	waituntil station.empty and (not station.pause) and 
  	(not station.failed) prio 1
  	
  	return true
  else
  	return false
  end

