 Name: checkType
 ID: 30
 DataType: method
 Value: |+1
  param p,t : object -> boolean		-- p always /= void
  
  var station : object
  var i,j : integer
  var str,sstr,tstr,tsstr : string
  var found : boolean
  
  station := self.~
  if station.TypeSpecific 
  	-- search the part in the TypeTable
  	i := 1
  	found := false
  	while i <= station.TypeTable.YDim and not found 
  		if station.TypeTable[1,i] = p.name 
  			found := true
  		else
  			i := i +1
  		end
  	end
  	if (not found) 
  		return false
  	end
  	
  	if t /= void 
  		if station.Containertype = "" 
  			str := station.TypeTable[2,i]	-- containertype, may be empty
  		else
  			str := station.Containertype
  		end
  		found := false
  		repeat
  			i := strLpos(",",str)
  			if (i > 0) 
  				sstr := strCopy(str,1,i-1)
  				str := strOmit(str,1,i)
  			else
  				sstr := str
  			end
  			if (sstr = "" or sstr = t.name) 
  				found := true
  			end
  			
  		until i <= 0 or found
  		
  		if (not found) 
  			return false
  		end
  		station.Containertype := ""
  	else
  		-- there is not yet a target; don´t stop parts for different targettype
  		if not station.HomogeneousTarget 
  			if station.Containertype = "" 
  				-- the first part; store the possible targettype
  				station.Containertype := station.TypeTable[2,i]
  				return true
  			else
  				tstr := station.TypeTable[2,i]	-- targettype of the part p
  				str := station.Containertype	-- targettype of previous part
  				repeat
  					i := strLpos(",",tstr)
  					if (i > 0) 
  						tsstr := strCopy(tstr,1,i-1)
  						tstr := strOmit(tstr,1,i)
  					else
  						tsstr := tstr
  					end
  					
  					repeat
  						j := strLpos(",",str)
  						if (j > 0) 
  							sstr := strCopy(str,1,j-1)
  							str := strOmit(str,1,j)
  						else
  							sstr := str
  						end
  						if (sstr = "" or tsstr = "" or sstr = tsstr) 
  							return true
  						end
  						
  					until j <= 0
  				until i <= 0
  				
  				return false
  			end
  		end
  	end
  end
  		
  if station.TargetIsContainer and station.HomogeneousTarget 
  	if station.Parttype = "" 
  		station.Parttype := p.name
  	end
  	if (p.name = station.Parttype) 
  		return true
  	else
  		return false
  	end
  else
  	return true
  end
 ShowInTooltip: false
