  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  checks the internalClassName
  _________________________________________________________________________________
  Parameters	: s : partstation or targetstation
  ReturnValues: 	type = -1: s undefined
  				type = 1: line			(with sensor)
  				type = 2: NW_Way		(with sensor and activate)
  				type = 3: Nw2Way		(with sensor and activate and 2 lanes)
  				type = 0: all others	(point-oriented)
  
  Called By	: Init, stopObject, getParameterTable
  Calls		:
  
  Author		: Karola Mock, Tecnomatix
  Date		: 15.02.2006
  
  _________________________________________________________________________________
  History:
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param s : object -> integer
  
  var type : integer
  
  if s = void
  	type := -1
  elseif s.internalClassType = "Conveyor"
  	type := 1
  elseif s.internalClassType = "Track"
  	type := 2
  elseif s.internalClassType = "TwoLaneTrack"
  	type := 3
  else
  	type := 0
  end
  
  return type
