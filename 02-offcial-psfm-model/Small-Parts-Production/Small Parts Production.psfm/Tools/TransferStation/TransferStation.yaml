 Name: parttypeToStation
 ID: 27
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  moves the parts with the right type from the partstation to the transferStation
  _________________________________________________________________________________
  Parameters	: table with the waiting parts
  ReturnValues: number of moved parts
  
  Called By	: movePartToStation
  Calls		: checkType,checkLength
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  01.04.2016  KM  SimTalk 2.0
  19.01.2018  KM  handle stacks on vehicle or container
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param container : table -> integer
  
  var i,j,k,num : integer
  var station, p : object
  var recTimeType,recTime : string
  
  station := self.~
  recTimeType := station.recoveryTime.Type
  recTime := station.recoveryTime.getAttr
  i := 1
  num := 0
  repeat
  	var datatype : string := container.getDataType(i)
  	j := 1
  	repeat
  		var zDim : integer
  		var subtable : boolean
  		if datatype = "table" and container[i,j] /= void
  			zDim := container[i,j].yDim
  			subtable := true
  		else
  			zDim := 1
  			subtable := false
  		end
  		
  		k := 1
  		repeat
  			if subtable
  				p := container[i,j][1,k]
  			else
  				p := container[i,j]
  			end
  			if p /= void 
  				if station.checkType(p,station.WaitingTargets[1]) 
  					if station.checkLength(p,station.WaitingTargets[1]) 
  						if p.move(station) 
  							station.recoveryTime := 0
  							station.Status := "working"
  							if num = 0 
  							-- Blocksize > 1: there are several out-events
  							-- the out-event of the BlocksizePart moves all parts of the block
  								station.BlocksizePart := p
  							end
  							num := num + 1
  							if not station.unloadPartcontainer 
  								station.WaitingParts.remove(1)
  							end
  						else
  							-- mustn´t happen
  							station.errorMessage(9,1)
  						end
  					end
  				else
  					if not station.unloadPartcontainer and not station.AlwaysStopTarget 
  						print "wrong parttype"	-- exit part on placetype stations ??
  					end
  				end
  			end
  			k := k + 1
  		until num = station.Blocksize or k > zDim
  		j := j + 1
  	until num = station.Blocksize or j > container.YDim
  	i := i + 1
  until num = station.Blocksize or i > container.XDim
  station.recoveryTime.setTypeAndAttr(recTimeType,recTime)
  return num
