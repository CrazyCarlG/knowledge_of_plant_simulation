 Name: TargetExitControl
 ID: 45
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  exit control of the targetstation.
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	:
  Calls		: checkTarget, waitForReadyStation, checkNumberOfPartsWithType
  			  checkReachingBlocksize, exitTargetStation, readyForWorking,
  			  StartMoveInUserMethod
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  23.09.2005  KM	consider ReadyTargets to avoid loading a target twice
  02.12.2005  KM	check ConfigurationError
  20.02.2008  KM  call UserControl when target arrives
  01.04.2016  KM  SimTalk 2.0
  10.11.2021  KM  when type specific or homogeneous loading parts from a parallelproc
  				search finished parts on the partstation for the arrived container
  26.06.2023  KM  outdated Attribute "InternalClassName" replaced with "InternalClassType
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var station : object
  var i : integer
  
  station := self.~
  
  if station.ConfigurationError or ? /= station.TargetStation
  	return
  end
  
  if @.internalClassType = "Part" or not station.TargetIsContainer
  	station.exitTargetStation(@)
  	return
  end
  
  -- don't try to load a target twice
  for i := 1 to station.ReadyTargets.dim
  	if @ = station.ReadyTargets[i]
  		station.exitTargetStation(@)
  		return
  	end
  next
  
  if station.PartStation.internalClassType = "Buffer" and
     station.PartStation.BufferType = "Stack" and station.WaitingParts.occupied
  	-- buffer with LIFO and not empty: is there a not finished part above the waiting parts?
  	if not station.PartStation.cont.finished
  		station.WaitingParts.delete
  		return
  	end
  end
  
  if station.WaitingTargets.empty and station.PartStation.internalClassType = "ParallelStation" and station.TargetIsContainer and
  		not station.unloadPartcontainer and (station.TypeSpecific or station.HomogeneousTarget)
  	-- type specific or homogeneous loading parts from a parallelproc
  	-- search finished parts on the partstation for the arrived container
  	station.WaitingParts.delete
  	station.Containertype := ""
  	station.Parttype := ""
  	station.checkNumberOfPartsWithType(station.PartStation, @)
  end
  
  -- load or transfer from container to container
  if not station.checkTarget(@)
  	station.exitTargetStation(@)
  	return
  end
  
  if station.UserTargetExitCtrl /= "" and str_to_method(station.UserTargetExitCtrl).checkArguments(false)
  	str_to_method(station.UserTargetExitCtrl).execute(false,@,station.TargetStation)
  end
  station.WaitingTargets.append(@)
  
  if station.unloadPartcontainer
  	if station.WaitingParts.empty
  		if station.readyForWorking
  			station.Status := "waiting_for_parts"
  		end
  		return
  	end
  else
  	if not station.checkReachingBlocksize
  		if station.readyForWorking
  			station.Status := "waiting_for_parts"
  		end
  		return
  	end
  end
  
  if station.waitForReadyStation
  	station.StartMoveInUserMethod
  end
