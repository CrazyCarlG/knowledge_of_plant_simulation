 Name: createSensor
 ID: 79
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  creates a sensor
  _________________________________________________________________________________
  Parameters	: type = 1, sensor on partstation; type = 2, sensor on targetstation
  			  pos1, position of the sensor
  			  act, activate always the sensor (if way)
  			  lane if twolanetrack  (1:lane A, 2:lane B, 3:A+B,pos1 on A, 4:A+B,pos1 on B
  ReturnValues: sensorID
  
  Called By	: setPartStation, setTargetStation
  Calls		: 
  
  Author		: Karola Mock, Siemens PLM Software
  Date		: 23.02.2005
  
  _________________________________________________________________________________
  History:
  
  15.02.2006  KM  Nw2Way allowed
  22.09.2006  KM  allow part or targetstation in other frame than the transferStation
  16.09.2011  KM  create rear triggered sensor control when unloading to line/track to
  				avoid periodic try to unload the part when first unload wasn't possible
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param type : integer, pos1 : length, act : string, lane : integer -> integer
  
  var callingObj : object
  var station: object
  var ctrl : string
  var sttype,id : integer
  var maxL : length
  var dest : object
  var ctrlFront : boolean
  var ctrlRear  : boolean
  var lightBarrier : boolean
  
  callingObj := self.~
  
  ctrlFront := true
  ctrlRear := false
  lightBarrier := false
  
  if type = 1 
  	station := callingObj.PartStation
  	ctrl := makePathRelative(callingObj,station) + ".PartSensorControl"
  elseif type = 2 
  	station := callingObj.TargetStation
  	ctrl := makePathRelative(callingObj,station) + ".TargetSensorControl"
  	if not callingObj.TargetIsContainer 
  		ctrlFront := false
  		ctrlRear := true
  		lightBarrier := true
  	end
  else
  	return 0
  end
  
  sttype := callingObj.getInternalClassType(station)
  
  if pos1 < 0.0 
  	pos1 := 0.0
  end
  maxL := callingObj.getStationLength(station,lane)
  if pos1 > maxL 
  	pos1 := maxL
  end
  if sttype = 1 
  	-- Line
  	id := station.createSensor(pos1, "Length", ctrl, ctrlFront, ctrlRear, void, false, lightBarrier)
  elseif sttype > 1 
  	switch act
  	case "Nur wenn Ziel","Only when Destination" 
  		dest := makePathRelative(callingObj,station)
  	else
  		dest := void
  	end
  	if sttype > 2 
  		-- Nw2Way
  		if lane = 1 or lane = 3 
  			id := station.A.createSensor(pos1, "Length", ctrl, ctrlFront, ctrlRear, dest, lane=3, lightBarrier)
  		else
  			id := station.B.createSensor(pos1, "Length", ctrl, ctrlFront, ctrlRear, dest, lane=4, lightBarrier)
  		end
  	else
  		-- Way	
  		id := station.createSensor(pos1, "Length", ctrl, ctrlFront, ctrlRear, dest, false, lightBarrier)
  	end
  end
  return id

