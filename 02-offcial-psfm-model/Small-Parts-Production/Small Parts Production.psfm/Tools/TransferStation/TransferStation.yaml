 Name: OnExit
 ID: 7
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks: 
  Exit control of the TransferStation. Multiple call for blocksize > 1. Only the out-event
  for "BlocksizePart" moves all parts on the station to targetstation.
  _________________________________________________________________________________
  Parameters	: target: void for the first time the part will leave the station
  ReturnValues: none
  
  Called By	: 
  Calls		: station.UserCtrl, exitStation
  
  Author		: Karola Mock, Tecnomatix
  Date		: 01.09.2004
  
  _________________________________________________________________________________
  History:
  04.03.2005  KM	reset BlocksizePart only when all parts have left the station to avoid
  				multiple wakeups of the method (can happen if no part can leave the station)
  26.06.2005  KM	use str_to_method
  23.08.2005  KM	use attribute WaitTime
  22.03.2006  KM	parts without status "working" are illegal
  25.08.2006  KM	handle multiple call for example for failed target station
  27.04.2009  KM  delete content only when there is no BlocksizePart
  16.02.2010  KM  when MUs on the target line are stopped, use WaitTime
  16.09.2011  KM  create rear triggered sensor control when unloading to line/track to
  				avoid periodic try to unload the part when first unload wasn't possible
  20.01.2014  KM	don't delete illegal parts
  01.04.2016  KM  SimTalk 2.0
  
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param target : object
  
  var station:object
  
  station := self.~
  
  -- this is not the first call for the part
  if (target /= void or station.BlocksizePart /= void)  and station.Status = "blocked" 
  	station.Status := "working"
  end
  
  if station.Status /= "working" and station.BlocksizePart = void 
  	-- illegal parts from the user
  	return
  end
  	
  -- Blocksize > 1: there are several out-events
  -- the out-event of the BlocksizePart moves all parts of the block
  if station.BlocksizePart /= void and station.BlocksizePart /= @ 
  	return
  end
  
  -- area for user
  if station.UserCtrl /= "" and target = void 
  	str_to_method(station.UserCtrl).execute(2,station.WaitingTargets[1],station)
  end
  -- end of area for user
  
  -- parts leave the station	
  station.exitStation
  
  if station.empty 
  	station.BlocksizePart := void
  end
