InternalClassType: Method
Coordinate3D: [13,-3,0]
Name: GetWorkersFromPool
Origin: 02e78bf3-fb5d-4d61-868d-7c0df4df55a6
Program: |+1
 -- read all worker of the pool
 -- and fill it into the table 'myWorkerTable'
 -- called by: Apply of dialog, init
 var k,n:integer
 var w,wc:object
 
 myWorkerTable.delete
 myWorkerClasses.delete({1,0}..{*,*})
 myWorkerClassCount.delete({1,0}..{*,*})
 
 var numTab:table[integer]
 numTab.create
 if VarObj /= void 
 	VarObj.getAssignedWorkersTable(myWorkerTable)
 	-- myWorkerTable.sort(1,"up");
 	for var j := 1 to myWorkerTable.ydim 
 		w := myWorkerTable[1,j]
 		wc:= w.class
 		k := myWorkerClasses.getColumnNo(wc)
 		if k = -1 then k := myWorkerClasses.xDim + 1
 			myWorkerClasses[k,0] := wc
 			myWorkerClassCount[k,0] := wc
 			myWorkerClassCount[k,1] := 0
 		end
 		n := numTab[1,k] + 1
 		numTab[1,k] := n
 		myWorkerClasses[k,n] := w
 		myWorkerClassCount[k,1] := myWorkerClassCount[k,1] + 1
 	next -- j
 end
