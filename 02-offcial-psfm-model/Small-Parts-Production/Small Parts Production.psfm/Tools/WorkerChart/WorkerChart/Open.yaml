InternalClassType: Method
Coordinate3D: [3,-6,0]
Name: Open
Origin: 02e78bf3-fb5d-4d61-868d-7c0df4df55a6
Program: |+1
 -- interaction open, drag & drop
 var DialogValue:string
 
 switchRadioButton(current)
 
 if VarObj /= void  -- if an object is entered, it must be correct:
 	DialogValue := makePathRelative(VarObj, ~)
 	Dialog.setCaption("WorkerPool_Inp",DialogValue)
 end
 Dialog.setCaption("TextBoxInterval", to_str(VarInterval))-- sample interval
 
 if (VarChartType = "Columns") or (VarChartType = "Stacked Columns") 
 	Dialog.setIndex("ChartType", 1)
 else
 	Dialog.setIndex("ChartType", 2)
 end
 
 if (VarPointOfView = "Worker") 
 	Dialog.setIndex("PointOfView", 1)
 else
 	Dialog.setIndex("PointOfView", 2)
 end
 
 switch VarStatisticGroup -- RadioButton 'Grouping'
 case "Worker" 
 	Dialog.setCheckBox("Worker",true)
 case "Group" 
 	Dialog.setCheckBox("Group",true)
 case "Pool" 
 	Dialog.setCheckBox("Pool",true)
 end
 
 if ~ /= rootfolder 
 	GetWorkersFromPool	-- fill the table 'myWorkerTable' with all worker
 	Refresh
 end
 
 Dialog.open--(5,100) position is defined in the class on tab 'position'
