Program: |+1
 -- This method transposes a tablefile and puts the result into a second tablefile
 -- called by: refresh
 param TableIn, TableOut : Object
 
 var x,y : Integer
 
 TableOut.delete
 for y := 1 to TableIn.yDim 
 	for x := 1 to TableIn.xDim 	
 		TableOut[y,x] := TableIn[x,y]
 	next
 next

