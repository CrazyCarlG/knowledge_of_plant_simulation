Name: MakeString
Origin: 02e78bf3-fb5d-4d61-868d-7c0df4df55a6
Program: |+1
 -- This method adds the cells of a given column to one string
 -- and replaces "Workers" and "Pools"
 -- with the given Objects
 -- called by: refresh
 param Item : table[string], Worker, Pool : object -> string
 
 var i : Integer; var s, sTemp : string
 
 for i := 1 to Item.yDim 
 	if Item[1,i] /= VOID 
 		switch Item[1,i]
 		case "Worker" 
 			s := s+to_str(Worker)
 		case "Pool" 
 			s:= s+to_str(Pool)
 		else
 			s := s+Item[1,i]
 		end
 	end
 next
 return s

