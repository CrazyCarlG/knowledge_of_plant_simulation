-
 Name: OnDragDrop
 ID: 10
 DataType: method
 Value: |+1
  -- interaction drag&drop
  param draggedObjects: object[]
  
  var obj : object;var relPath:string
  
  if EventController=void  -- Please insert an eventcontroller.
  	messageBox(rootfolder.Localization.getText(84),1,3)
  	return
  end
  	
  if MonitoringActive  -- else return (The energy analysis of '$1' is not active.)
  	for var i := 1 to draggedObjects.dim 
  		obj := draggedObjects[i] --print obj;
  
  		switch obj.internalClassName
  		case "NwArc","NwData","Comment","NwCheckbox","NwButton","NwDropDownList","EventCtl" 
  		else
  			relPath := makePathRelative(obj,~)
  			if detectEnergyobjects(obj) 
  				Objects.setCursor(1,1)
  				if NOT Objects.find({1,1}..{1,*}, relPath) 
  					Objects[1,Objects.yDim+1] := relPath
  				end
  			else
  	   			-- Energy_simulation is impossible or not active for the object '$1', respectively.
  				messageBox(rootfolder.Localization.getMessage(35,relPath,"",""),1,1) -- error
  			end -- if detectEnergyobjects       
  		end
  	next-- i
  	Objects.sort(1,"up")
  	Objects.copyRangeTo({1,1}..{1,*}, ConsumersSelection, 1,1)
  	ConsumersSelection.refillDialog
  	Dialog.setObjectTable
  	
  	--EnergyConsumers.setBackgroundColorCells({0,1}..{*,*},makeRGBValue(255,255,255));
  	EnergyConsumers.delete({0,1}..{*,*})
  	Objects.copyrangeTo({1,1}..{1,*}, EnergyConsumers,0,1)
  	Frames.reg
  
  	prepareObserver(true)
  else
  	messageBox(rootfolder.localization.getMessage(53,@.name,"",""),1,1) -- error: The energy analysis of '$1' is not active.
  end -- if_MonitoringActive
 ShowInTooltip: false
