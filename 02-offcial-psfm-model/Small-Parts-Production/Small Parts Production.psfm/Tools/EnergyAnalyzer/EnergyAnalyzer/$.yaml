-
 Name: removeAllPowerInputObserver
 ID: 25
 DataType: method
 Value: |+1
  param FrameObj:object
  
  var absPathOfMethod:string := to_str("*",&observeEnergyState)
  var obj:object
  for var j := 1 to FrameObj.numNodes 
  	obj := FrameObj.node(j)
  	if obj.internalClassName = "Network" 
  		removeAllPowerInputObserver(obj)
  	else
  		obj.removeObserver("EnergyCurrentState", absPathOfMethod) 
  		obj.removeObserver("PowerInput", absPathOfMethod)
  		obj.removeObserver("PowerInput", void)
  	end
  next
 ShowInTooltip: false
