Name: checkDuplicates
Origin: fed7ab31-047a-4a54-af6f-c7c0051dc6eb
Program: |+1
 // Method checks for duplicated experiment names in the Experiment Table
 -> boolean
 var experiments := ~.ExpTable
 
 for var l := 1 to experiments.yDim - 1
 	if experiments[0,l] /= ""
 		var cellValue := experiments[0,l]
 		for var j := l+1 to experiments.yDim
 			if cellValue ~= experiments[0,j]
 				return true
 			end
 		next
 	end
 next
 return false
