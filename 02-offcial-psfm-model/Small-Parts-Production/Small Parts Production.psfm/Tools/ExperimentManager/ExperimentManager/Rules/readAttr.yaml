Program: |+1
 /*
 parameter: proctime,  [2,3], [2]
 result:    .proctime, [2,3], .read_(2)
 */
 param attr:string->string
 
 var k:integer
 
 result := attr
 k := strLpos("]",attr)
 if k > 0 
 	if strLpos(",",attr)=0  -- 1D List
 		result := strOmit(result,k,1)
 		k:=strLpos("[",result)
 		result := strOmit(result,k,1)
 		result := to_str("[",result,"]")
 	end
 else -- like procTime
 	result := to_str(".",result)
 end
