Program: |+1
 -> integer
 
 var numExperiments:integer
 
 if self.~.UsingTables
 	for var i := 1 to ExpTable.yDim
 		if ExpTable[1,i]
 			numExperiments += 1
 		end
 	next
 else
 	numExperiments := 1
 end
 
 return numExperiments
