Program: |+1
 -- Input and output values are protected by an update.
 -- The result of all studies are deleted by the method_resetWizard
 param loaded, updated:boolean
 
 var ToolClass:object
 
 if NOT updated
 	return
 end
 for var j := 1 to rootfolder.numNodes
 	ToolClass := rootfolder.node(j) -- ToolClass.name is like "Experimentverwalter" or "ExperimentManager"
 	if ToolClass.internalClassName /= "NwObjFolder" AND ToolClass.getAttrNo("ObjType") > 1  -- objType = "Experiment"
 		exitloop
 	end
 next
 
 if ToolClass = void then return; end
 
 for var j := 1 to ToolClass.numChildren
 	var ExpMgr:object := ToolClass.childNo(j)
 	if ExpMgr.~.internalClassName = "Network" -- The ExperimentManager is located in a frame. It can contain old results.
 		ExpMgr.resetWizard
 	end
 next
