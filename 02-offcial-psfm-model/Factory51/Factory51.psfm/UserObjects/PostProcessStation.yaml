$CustomAttributes:
-
 Name: OnExit
 ID: 1
 DataType: method
 Value: |+1
  ?.SetAppearance // Change the visual appearance according to the processing step
  
  var Plate        := ?._3D.getObject("Plate")
  var poses        := ?._3D.Poses
  
  poses.moveTo("ExitOpen")
  waituntil poses.EndPoseWasReached
  poses.moveTo("PlateRight", abs(Plate.JointUpperLimit/?.Succ.Speed))
  waituntil poses.EndPoseWasReached
  
  @.move
  poses.moveTo("Ready")
  waituntil poses.EndPoseWasReached
  ?.EntranceLocked := false
 ShowInTooltip: false
-
 Name: OnPull
 ID: 3
 DataType: method
 Value: |+1
  var blockList := ?.fwBlockList
  var poses     := ?._3D.Poses
  
  poses.moveTo("PlateLeft")
  waituntil poses.EndPoseWasReached
  
  ?.unblock(blockList[1])
 ShowInTooltip: false
-
 Name: OnEntrance
 ID: 4
 DataType: method
 Value: |+1
  ?.EntranceLocked := true
  var Plate        := ?._3D.getObject("Plate")
  var poses        := ?._3D.Poses
  
  poses.moveTo("PlateCenter", abs(Plate.JointLowerLimit/?.Pred.Speed))
  waituntil poses.EndPoseWasReached
  poses.moveTo("EntranceClosed")
  waituntil poses.EndPoseWasReached
  
  ?.startProcessing
  ?._3D.Poses.moveTo("ToolDown")
 ShowInTooltip: false
-
 Name: Reset
 ID: 5
 DataType: method
 Value: "@.EntranceLocked := false"
 ShowInTooltip: false
-
 Name: SetAppearance
 ID: 7
 DataType: method
 Value: "// Instance contain code which activate the correct graphic group"
 ShowInTooltip: false
InheritEntranceExitLockedOnReset: false
