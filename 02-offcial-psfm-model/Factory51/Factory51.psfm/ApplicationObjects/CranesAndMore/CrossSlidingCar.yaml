 Name: OnBwExit
 ID: 5
 DataType: method
 Value: |+1
  var CSC := self.~
  var part := @
  if part.Location = CSC
  	var destinationObject: Object
  	// Next destination has to be a conveyor!
  	if part.AutomaticRouting
  		destinationObject := part.getRouteIntermediateDestination
  	else
  		destinationObject := part.Destination
  	end
  	if destinationObject.Backwards
  		part.move(destinationObject, destinationObject.length)
  	else
  		part.move(destinationObject, 0)
  	end
  elseif part.Location /= CSC
  	if CSC.FrontMU = part
  		CSC.FrontMU := void
  	end
  	CSC.ExitLocked := true
  end
