 Name: OnPull
 ID: 19
 DataType: method
 Value: |+1
  var CSC  := ?
  var part := @
  
  if CSC.state != "waiting" then return end
  --waituntil CSC.state = "waiting" or CSC.state = "idle"
  
  if part = void then
  	part := CSC.FwBlockListEntry1
  	if part = void then
  		return // No part to process
  	end
  end
  
  if part.destination = void
  	if CSC.succ = void
  		throwRuntimeError(to_str(self.~)+": No destination for MU defined!")
  	else
  		part.destination := CSC.succ
  	end
  end
  
  
  if CSC.CurrentObject = part.~
  	CSC.NewPart := true
  	if part /= void
  		CSC.processPendingTransfers(part)
  	end
  elseif CSC.empty and CSC.FrontMU = void
  	CSC.FrontMU := part
  	if part /= void
  		CSC.processPendingTransfers(part)
  	end
  else
  	waituntil CSC.nextPart = void
  	CSC.nextPart := part
  	waituntil CSC.state = "waiting"
  	CSC.NewPart := true
  	if part /= void
  		CSC.processPendingTransfers(part)
  	end
  end
 ShowInTooltip: false
