$CustomAttributes:
-
 Name: DampingTime
 ID: 1
 DataType: time
 Value: 2
 ShowInTooltip: false
-
 Name: OnExit
 ID: 2
 DataType: method
 Value: |+1
  var CSC := self.~
  var part := @
  if part.Location = CSC
  	var destinationObject: Object
  	// Next destination has to be a conveyor!
  	if part.AutomaticRouting
  		destinationObject := part.getRouteIntermediateDestination
  	else
  		destinationObject := part.Destination
  	end
  	if destinationObject.Backwards
  		part.move(destinationObject, destinationObject.length)
  	else
  		part.move(destinationObject, 0)
  	end
  elseif part.Location /= CSC
  	if CSC.FrontMU = part
  		CSC.FrontMU := void
  	end
  	CSC.ExitLocked := true
  end
 ShowInTooltip: false
-
 Name: OnSensor
 ID: 3
 DataType: method
 Value: |+1
  param SensorID: integer, Front: boolean, BookPos: boolean
  
  if self.~.ExitLocked
  	self.~.cont.Stopped := true
  end
 ShowInTooltip: false
-
 Name: processPendingTransfers
 ID: 4
 DataType: method
 Value: |+1
  param part:object
  
  var contents: table
  
  var CSC := self.~
  var Car := CSC._3D.getObject(1)
  
  if CSC.FrontMU = void
  	CSC.FrontMU := part
  end
  
  CSC.ExitLocked := true
  var sourceObject:object := part.~
  var partPosition:length[3] := CSC._3D.getPositionOfObject(part)
  // Drive to Source Object
  if sourceObject /= CSC.CurrentObject
  	// Move car to the pick position
  	CSC.state := "driveto"
  	Car.moveToMU(part)
  	waituntil CSC._3D.Poses.EndPoseWasReached
  	CSC.CurrentObject := sourceObject
  	CSC.state := "damping"
  	wait CSC.DampingTime
  end
  CSC.state := "loading"
  CSC.Backwards := partPosition.x > 0
  
  var Sensor := CSC.Sensors.ID1
  
  if CSC.OccupiedLength + part.length >= CSC.length
  	debug -- Vehicle should be longer than all parts that it has to transport
  end
  
  // Move part onto CSC depending on its relative position towards CSC
  if CSC.Backwards
  	Sensor.Position := 0
  	part.move(CSC,-1)
  else
  	Sensor.Position := CSC.length
  	part.move(CSC,0)
  end
  
  // Wait until part is fully moved onto CSC
  waituntil part.RearLocation = CSC
  
  if CSC.FrontMU /= void
  	CSC.FrontMU.stopped := false
  end
  
  
  if not CSC.Full and CSC.MaximumDwellTime > 0
  	var MaxWaitTime:time := CSC.MaximumDwellTime
  	CSC.state := "waiting"
  	waituntil CSC.NewPart wait MaxWaitTime
  	// If there are parts coming from the same source we load more parts
  	if not waitExpired
  		CSC.NewPart := false
  		CSC.FrontMU.stopped := false
  		return
  	end
  end
  
  ?.EntranceLocked := true
  
  
  if CSC.Backwards
  	Sensor.Position := (CSC.length - CSC.OccupiedLength)/2
  	Sensor.Rear := true
  	Sensor.Front := false
  else
  	Sensor.Position := CSC.length - (CSC.length - CSC.OccupiedLength)/2
  	Sensor.Rear := false
  	Sensor.Front := true
  end
  
  CSC.FrontMU.stopped := false
  
  while not CSC.Empty
  	// First double check whether the destination of the MU at the front or back should be approached
  	// so that delivery of parts is feasible
  	var DestinationObject := CSC.cont.getRouteIntermediateDestination
  	var dropPosition:length[3] := CSC._3D.getPositionOfObject(DestinationObject, DestinationObject._3D.getMUAnimationPosition(0))
  	if CSC.NumMU > 1 and dropPosition.x <= 0 then
  		var LastPartDestination := CSC.contentsList[1,CSC.NumMU].getRouteIntermediateDestination
  		var LastPartDropPosition :=  CSC._3D.getPositionOfObject(LastPartDestination, LastPartDestination._3D.getMUAnimationPosition(0))
  		if LastPartDropPosition.x <= 0
  			DestinationObject := LastPartDestination
  			dropPosition := LastPartDropPosition
  		else
  			debug -- This part can't be moved, because other parts might be blocking the way.
  		end
  	end
  	// Move car to the drop position
  	if DestinationObject /= CSC.CurrentObject
  		CSC.state := "damping"
  		wait ?.DampingTime
  		CSC.state := "drivefull"
  		Car.moveToMUAnimationPosition(part, DestinationObject)
  		waituntil CSC._3D.Poses.EndPoseWasReached
  		CSC.CurrentObject := DestinationObject
  		CSC.state := "damping"
  		wait ?.DampingTime
  	end
  	CSC.state := "unloading"
  	CSC.Backwards := dropPosition.x <= 0
  
  	CSC.ExitLocked := false
  	CSC.cont.stopped := false
  
  	waituntil CSC.ExitLocked
  	// Check if delivery of next part is feasible
  	if not CSC.Empty
  		var NextDestination := CSC.cont.getRouteIntermediateDestination
  		var NextDestinationBackwards := CSC._3D.getPositionOfObject(NextDestination, NextDestination._3D.getMUAnimationPosition(0)).x <= 0
  		if CSC.Backwards /= NextDestinationBackwards and CSC.NumMU > 1
  			debug -- This part can't be moved, because other parts might be blocking the way.
  		end
  	end
  end
  
