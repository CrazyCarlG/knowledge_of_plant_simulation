-
 Name: setStatisticValues
 ID: 1389001957
 DataType: method
 Value: |+1
  var dialog	: object
  var tab		: table
  var robot	: object
  
  dialog := self.~
  robot := Dialog.openedBy
  
  if robot /= void
  	tab.create
  	dialog.setCaption( "failed_val",	to_str( round( robot.statFailPortion*100, 2 )))
  	dialog.setCaption( "paused_val",		to_str( round( robot.statPausingPortion*100, 2 )))
  	dialog.setCaption( "unplaned_val",	to_str( round( robot.statUnplannedPortion*100, 2 )))
  	dialog.setCaption( "relEmpty_val",	to_str( round( robot.StatRelativeEmptyPortion*100, 2 )))
  	dialog.setCaption( "relOccupation_val",	to_str( round( robot.StatRelativeOccupation*100, 2 )))
  	dialog.setCaption( "setting-up_val",	to_str( round( robot.StatSetupPortion*100, 2 )))
  	dialog.setCaption( "stopped_val",	to_str( round( robot.StatStoppedPortion*100, 2 )))
  	robot.state.getStatisticsTable( tab )
  	var DurationColumn:= 5
  	var drivingEmpty := 0
  	var drivingFull := 0
  	var loading := 0
  	var unloading := 0
  	var blockedSet := false
  	for var i := 1 to tab.YDim
  		switch tab[1,i]
  		case "driveto"
  			dialog.setCaption( "drivingEmpty_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  			drivingEmpty :=  round( tab[DurationColumn, i ], 2 )
  
  		case "loading"
  			dialog.setCaption( "loading_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  			loading :=  round( tab[DurationColumn, i ], 2 )
  
  		case "drivefull"
  			dialog.setCaption( "drivingLoaded_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  			drivingFull :=  round( tab[DurationColumn, i ], 2 )
  
  		case "waiting"
  			dialog.setCaption( "waiting_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "unloading"
  			dialog.setCaption( "unloading_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  			unloading :=  round( tab[DurationColumn, i ], 2 )
  
  		case "damping"
  
  		case "failed"
  			dialog.setCaption( "failed_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "blocked"
  			blockedSet := true
  			dialog.setCaption( "blocked_val",	to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		end
  	next
  	if not blockedSet
  		dialog.setCaption( "blocked_val",	to_str(0))
  	end
  	dialog.setCaption( "working_val",	to_str(drivingEmpty + drivingFull + loading + unloading))
  else
  	dialog.setCaption( "working_val",	"0" )
  	dialog.setCaption( "waiting_val",	"0" )
  	dialog.setCaption( "blocked_val",	"0" )
  	dialog.setCaption( "failed_val",	"0" )
  	dialog.setCaption( "pause_val",		"0" )
  	dialog.setCaption( "unplanned_val",	"0" )
  
  	dialog.setCaption( "VehWaiting_val",		"0" )
  	dialog.setCaption( "VehDriving_val",		"0" )
  	dialog.setCaption( "VehLoading_val",		"0" )
  	dialog.setCaption( "VehTransporting_val",	"0" )
  	dialog.setCaption( "VehUnloading_val",		"0" )
  	dialog.setCaption( "vehDamping_val",		"0")
  	dialog.setCaption( "vehdriveHome_val",		"0")
  	dialog.setCaption( "vehfailed_val",			"0")
  
  end
 ShowInTooltip: false
