$CustomAttributes:
-
 Name: callback
 ID: 1388591464
 DataType: method
 Value: |+1
  param action : string
  
  var Dialog	: object
  var AppObj	: object
  var text	: string
  
  dialog := self.~
  AppObj := dialog.openedBy
  if AppObj /= void
  	switch action
  	case "Open"
  
  	case "Apply"
  		dialog.dialogApply
  		dialog.setStatisticValues
  
  	case "Close"
  		AppObj.openedDialog := void
  		Dialog.~.deleteObject
  
  	case "openLocation"
  		AppObj.~.openDialog
  
  	case "openOrigin"
  		if AppObj.Origin /= void
  			AppObj.Origin.openDialog
  		end
  
  	case "gotoOrigin"
  		if AppObj.origin/= void
  			AppObj.origin.openDialog
  			dialog.close( false )
  		end
  
  	case "openClass"
  		if AppObj.class /= void
  			AppObj.class.openDialog
  		end
  
  	case "gotoClass"
  		if AppObj.class /= void
  			AppObj.class.openDialog
  			dialog.close( false )
  		end
  
  	case "refresh"
  		Dialog.dialogInit
  
  	case "helpObject"
  		.ApplicationObjects.CranesAndMore.SevenAxisRobot_Documentation.show
  
  	case "helpVersion"
  		var lib : string
  		var vers : string
  		var libPath : string
  		rootfolder.getLibraryInfo( lib, vers, text, libPath )
  		text := to_str( "Plant Simulation ", lib, strChr(10), " Version: ", vers, strChr(10))
  		messageBox( text, 1, 4)
  
  	case "name"
  		?.setCheckBox("Name_inherit", false)
  
  	case "label"
  		?.setCheckBox("label_inherit", false)
  
  	case "RailLength"
  		?.setCheckBox("RailLength_inherit", false)
  
  	case "RobotSpeed"
  		?.setCheckBox("DynamicsOfRobot_inh", false)
  
  	case "RotatingSpeedSecond"
  		?.setCheckBox("RotatingSpeedSecond_inherit", false)
  
  	case "RotatingSpeedThird"
  		?.setCheckBox("RotatingSpeedThird_inherit", false)
  
  	case "RotatingSpeedFourth"
  		?.setCheckBox("RotatingSpeedFourth_inherit", false)
  
  	case "RotatingSpeedFifth"
  		?.setCheckBox("RotatingSpeedFifth_inherit", false)
  
  	case "RotatingSpeedSixth"
  		?.setCheckBox("RotatingSpeedSixth_inherit", false)
  
  	case "RotatingSpeedSeventh"
  		?.setCheckBox("RotatingSpeedSeventh_inherit", false)
  
  	case "Dynamics"
  		if dialog.getCheckBox("DynamicsOfRobot_inh")
  			AppObj.dynamics := true
  		else
  			AppObj.dynamics := false
  		end
  
  	case "RobotAcceleration"
  		?.setCheckBox("DynamicsOfRobot_inh", false)
  
  	case "RobotDeceleration"
  		?.setCheckBox("DynamicsOfRobot_inh", false)
  
  	case "dwellTime"
  		?.setCheckBox("MaximumDwellTime_inherit", false)
  
  	case "dampingtime"
  		?.setCheckBox("DampingTime_inherit", false)
  
  	case "driveHome"
  		var flag := dialog.getCheckbox("driveHome_chk")
  		dialog.setSensitive("Homeposition_txt", flag)
  		dialog.setSensitive("Homeposition_inp", flag)
  
  	case "homeposition"
  		AppObj.HomePosition = dialog.getValue("Homeposition_inp")
  
  	case "side"
  		AppObj.ObjList.openDialogBox
  
  	case "DefineFailures"
  		AppObj.openDialog
  
  	else
  		messageBox( "Unknown dialog action "+action, 1, 1 )
  	end
  end
 ShowInTooltip: false
-
 Name: openedBy
 ID: 1388754826
 DataType: object
 Value: ""
 ShowInTooltip: false
-
 Name: dialogInit
 ID: 1388757887
 DataType: method
 Value: |+1
  var l : length := 1;		var l_unit := getUnit( l )
  var s : speed := 1;			var s_unit := getUnit( s )
  var a : acceleration := 1;	var a_unit := getUnit( a )
  
  
  
  var dialog := self.~
  var AppObj := dialog.openedBy
  //Axes
  var Base := AppObj._3D.getObject("Base")
  var Second := Base.getObject("Z")
  var Third := Second.getObject("Y1")
  var Fourth := Third.getObject("Y2")
  var Fifth := Fourth.getObject("Z")
  var Sixth := Fifth.getObject("Y")
  var Seventh := Sixth.getObject("Z")
  
  var inherit:boolean
  
  
  dialog.setCaption( "name_inp", AppObj.name )
  AppObj.getAttribute("name", inherit)
  Dialog.setCheckBox("name_inherit", inherit)
  
  Dialog.setCaption( "label_inp", AppObj.label )
  AppObj.getAttribute("label", inherit)
  Dialog.setCheckBox("label_inherit", inherit)
  
  Dialog.setCaption("RailLength_inp", to_str(AppObj.railLength))
  Dialog.setCaption("RailLength_unit", l_unit )
  AppObj.getAttribute("RailLength", inherit)
  Dialog.setCheckBox("RailLength_inherit", inherit)
  
  if AppObj.Origin = void
  	//If Dialog is oppened in Superclass, DynamicsOfRobot cant inherit
  	Dialog.setCheckBox("DynamicsOfRobot_inh", AppObj.dynamics)
  else
  	//Compare values with superclass, if they match Checkbox isn't set
  	var origin := AppObj.Origin._3D.getObject("Base")
  	if Base.JointVelocity = origin.JointVelocity and Base.JointAcceleration = origin.JointAcceleration and Base.JointDeceleration = origin.JointDeceleration
  		AppObj.dynamics := true
  		Dialog.setCheckBox("DynamicsOfRobot_inh", AppObj.dynamics)
  	end
  end
  
  Dialog.setCaption("RobotSpeed_inp", to_str( num_to_speed(Base.JointVelocity)))
  Dialog.setCaption("RobotSpeed_unit", s_unit )
  Base.getAttribute("JointVelocity", inherit)
  
  
  Dialog.setCaption( "RobotAcceleration_inp", to_str( num_to_acceleration(Base.JointAcceleration )))
  Dialog.setCaption( "RobotAcceleration_unit", a_unit )
  Base.getAttribute("JointAcceleration", inherit)
  
  Dialog.setCaption( "RobotDeceleration_inp", to_str( num_to_acceleration(Base.JointDeceleration )))
  Dialog.setCaption( "RobotDeceleration_unit", a_unit )
  Base.getAttribute("JointDeceleration", inherit)
  
  //Axes
  Dialog.setCaption("RotatingSpeedSecond_inp", to_str( Second.JointVelocity))
  Second.getAttribute("JointVelocity", inherit)
  dialog.setCheckBox("RotatingSpeedSecond_inherit", inherit)
  
  Dialog.setCaption("RotatingSpeedThird_inp", to_str( Third.JointVelocity))
  Third.getAttribute("JointVelocity", inherit)
  dialog.setCheckBox("RotatingSpeedThird_inherit", inherit)
  
  Dialog.setCaption("RotatingSpeedFourth_inp", to_str( Fourth.JointVelocity))
  Fourth.getAttribute("JointVelocity", inherit)
  dialog.setCheckBox("RotatingSpeedFourth_inherit", inherit)
  
  Dialog.setCaption("RotatingSpeedFifth_inp", to_str( Fifth.JointVelocity))
  Fifth.getAttribute("JointVelocity", inherit)
  dialog.setCheckBox("RotatingSpeedFifth_inherit", inherit)
  
  Dialog.setCaption("RotatingSpeedSixth_inp", to_str( Sixth.JointVelocity))
  Sixth.getAttribute("JointVelocity", inherit)
  dialog.setCheckBox("RotatingSpeedSixth_inherit", inherit)
  
  Dialog.setCaption("RotatingSpeedSeventh_inp", to_str( Seventh.JointVelocity))
  Seventh.getAttribute("JointVelocity", inherit)
  dialog.setCheckBox("RotatingSpeedSeventh_inherit", inherit)
  
  
  Dialog.setCaption( "dampingTime_inp", to_str( AppObj.DampingTime ))
  AppObj.getAttribute("DampingTime", inherit)
  dialog.setCheckBox("DampingTime_inherit", inherit)
  
  Dialog.setCaption( "MaximumDwellTime_inp", to_str( AppObj.MaximumDwellTime ))
  AppObj.getAttribute("MaximumDwellTime", inherit)
  dialog.setCheckBox("MaximumDwellTime_inherit", inherit)
  
