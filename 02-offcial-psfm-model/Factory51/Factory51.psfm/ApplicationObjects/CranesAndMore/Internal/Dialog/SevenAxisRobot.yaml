 Name: dialogApply
 ID: 1388891963
 DataType: method
 Value: |+1
  var dialog	: object
  var AppObj	: object
  
  dialog := self.~
  AppObj := dialog.openedBy
  var Base := AppObj._3D.getObject("Base")
  var Second := Base.getObject("Z")
  var Third := Second.getObject("Y1")
  var Fourth := Third.getObject("Y2")
  var Fifth := Fourth.getObject("Z")
  var Sixth := Fifth.getObject("Y")
  var Seventh := Sixth.getObject("Z")
  
  if AppObj/=void
  
  	if ?.getCheckBox("Name_inherit")
  		AppObj.inheritAttribute("name")
  		dialog.setCaption("name_inp", AppObj.name)
  	else
  		AppObj.Name := dialog.getValue("Name_inp")
  	end
  
  	if ?.getCheckBox("Label_inherit")
  		AppObj.inheritAttribute("label")
  		dialog.setCaption("label_inp", AppObj.label)
  	else
  		AppObj.label := dialog.getValue("label_inp")
  	end
  
  	if ?.getCheckBox("RailLength_inherit")
  		AppObj.inheritAttribute("RailLength")
  		dialog.setCaption("RailLength_inp", to_str(AppObj.RailLength))
  	else
  		AppObj.RailLength := str_to_length(dialog.getValue("RailLength_inp"))
  
  	end
  
  	if ?.getCheckBox("DynamicsOfRobot_inh")
  		Base.inheritAttribute("JointVelocity")
  		dialog.setCaption("RobotSpeed_inp", to_str(num_to_speed( Base.JointVelocity)))
  		Base.inheritAttribute("JointAcceleration")
  		dialog.setCaption("RobotAcceleration_inp", to_str( num_to_acceleration(Base.JointAcceleration)))
  		Base.inheritAttribute("JointDeceleration")
  		dialog.setCaption("RobotDeceleration_inp", to_str( num_to_acceleration(Base.JointDeceleration)))
  	else
  		Base.JointVelocity := str_to_speed(dialog.getValue("RobotSpeed_inp"))
  		Base.JointAcceleration :=  str_to_acceleration(dialog.getValue("RobotAcceleration_inp"))
  		Base.JointDeceleration :=  str_to_acceleration(dialog.getValue("RobotDeceleration_inp"))
  	end
  
  	if ?.getCheckBox("RotatingSpeedSecond_inherit")
  		Second.inheritAttribute("JointVelocity")
  		dialog.setCaption("RotatingSpeedSecond_inp", to_str(Second.JointVelocity))
  	else
  		Second.JointVelocity :=  str_to_num(dialog.getValue("RotatingSpeedSecond_inp"))
  	end
  
  	if ?.getCheckBox("RotatingSpeedThird_inherit")
  		Third.inheritAttribute("JointVelocity")
  		dialog.setCaption("RotatingSpeedThird_inp", to_str(Third.JointVelocity))
  	else
  		Third.JointVelocity :=  str_to_num(dialog.getValue("RotatingSpeedThird_inp"))
  	end
  
  	if ?.getCheckBox("RotatingSpeedFourth_inherit")
  		Fourth.inheritAttribute("JointVelocity")
  		dialog.setCaption("RotatingSpeedFourth_inp", to_str(Fourth.JointVelocity))
  	else
  		Fourth.JointVelocity :=  str_to_num(dialog.getValue("RotatingSpeedFourth_inp"))
  	end
  
  	if ?.getCheckBox("RotatingSpeedFifth_inherit")
  		Fifth.inheritAttribute("JointVelocity")
  		dialog.setCaption("RotatingSpeedFifth_inp", to_str(Fifth.JointVelocity))
  	else
  		Fifth.JointVelocity :=  str_to_num(dialog.getValue("RotatingSpeedFifth_inp"))
  	end
  
  	if ?.getCheckBox("RotatingSpeedSixth_inherit")
  		Sixth.inheritAttribute("JointVelocity")
  		dialog.setCaption("RotatingSpeedSixth_inp", to_str(Sixth.JointVelocity))
  	else
  		Sixth.JointVelocity :=  str_to_num(dialog.getValue("RotatingSpeedSixth_inp"))
  	end
  
  	if ?.getCheckBox("RotatingSpeedSeventh_inherit")
  		Seventh.inheritAttribute("JointVelocity")
  		dialog.setCaption("RotatingSpeedSeventh_inp", to_str(Seventh.JointVelocity))
  	else
  		Seventh.JointVelocity :=  str_to_num(dialog.getValue("RotatingSpeedSeventh_inp"))
  	end
  
  	if ?.getCheckBox("DampingTime_inherit")
  		AppObj.inheritAttribute("DampingTime")
  		dialog.setCaption("dampingTime_inp", to_str(AppObj.DampingTime))
  	else
  		AppObj.DampingTime :=  str_to_time(dialog.getValue("dampingTime_inp"))
  	end
  
  	if ?.getCheckBox("MaximumDwellTime_inherit")
  		AppObj.inheritAttribute("MaximumDwellTime")
  		dialog.setCaption("MaximumDwellTime_inp", to_str(AppObj.MaximumDwellTime))
  	else
  		AppObj.MaximumDwellTime :=  str_to_time(dialog.getValue("MaximumDwellTime_inp"))
  	end
  
  	if ?.getCheckbox("driveHome_chk") and dialog.getValue("Homeposition_inp") /= ""
  		AppObj.drivingHome := true
  		var str := dialog.getValue("Homeposition_inp")
  		if strLpos(".",str)=1   -- absolute path
  			AppObj.HomePosition := when existsObject(str) then str_to_obj(str) else void
  		else  -- relative path
  			AppObj.HomePosition := AppObj.~.extendPath(str)
  		end
  	else
  		AppObj.HomePosition := void
  	end
  	AppObj.ParametrizeRobot
  end
