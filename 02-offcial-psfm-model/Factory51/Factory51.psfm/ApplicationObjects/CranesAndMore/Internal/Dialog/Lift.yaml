 Name: dialogInit
 ID: 3222650257
 DataType: method
 Value: |+1
  var l : length := 1;			var l_unit := getUnit( l )
  var s : speed := 1;			var s_unit := getUnit( s )
  var a : acceleration := 1;	var a_unit := getUnit( a )
  
  
  var dialog := self.~
  var AppObj := dialog.openedBy
  var AnimatableObject := AppObj._3D.getObject("Car")
  
  var inherit:boolean
  
  
  dialog.setCaption( "name_inp", AppObj.name )
  AppObj.getAttribute("name", inherit)
  Dialog.setCheckBox("name_inherit", inherit)
  
  Dialog.setCaption( "label_inp", AppObj.label )
  AppObj.getAttribute("label", inherit)
  Dialog.setCheckBox("label_inherit", inherit)
  
  Dialog.setCaption("LiftLength_inp", to_str(AppObj.Length))
  Dialog.setCaption("LiftLength_unit", l_unit )
  AppObj.getAttribute("length", inherit)
  Dialog.setCheckBox("LiftLength_inherit", inherit)
  
  Dialog.setCaption("LiftHeight_inp", to_str(AnimatableObject.BaseHeight ))
  Dialog.setCaption("LiftHeight_unit", l_unit )
  AnimatableObject.getAttribute("BaseHeight", inherit)
  Dialog.setCheckBox("LiftHeight_inherit", inherit)
  
  Dialog.setCaption("fenceheight_inp", to_str(AppObj.fenceHeight ))
  Dialog.setCaption("FenceHeight_unit", l_unit)
  AppObj.getAttribute("fenceHeight", inherit)
  Dialog.setCheckBox("FenceHeight_inherit", inherit)
  
  //TODO: Entfernen vor Release
  Dialog.setCaption("LiftSpeed_inp", to_str(num_to_speed( AnimatableObject.JointVelocity )))
  Dialog.setCaption("LiftSpeed_unit", s_unit )
  AnimatableObject.getAttribute("JointVelocity", inherit)
  
  Dialog.setCaption("CarBayWidth_inp", to_str( AnimatableObject.Width ))
  Dialog.setCaption("CarBayWidth_unit", l_unit )
  AnimatableObject.getAttribute("width", inherit)
  Dialog.setCheckBox("CarBayWidth_inherit", inherit)
  
  if AppObj.Origin = void
  	Dialog.setCheckBox("Dynamics_of_the_Lift_inherit", AppObj.dynamics)
  else
  	var origin := AppObj.Origin._3D.getObject("Car")
  	if AnimatableObject.JointVelocity = origin.JointVelocity and AnimatableObject.JointAcceleration = origin.JointAcceleration and AnimatableObject.JointDeceleration = origin.JointDeceleration
  	AppObj.dynamics := true
  	Dialog.setCheckBox("Dynamics_of_the_Lift_inherit", AppObj.dynamics)
  	end
