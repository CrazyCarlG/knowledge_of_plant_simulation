$CustomAttributes:
-
 Name: callback
 ID: 3222533730
 DataType: method
 Value: |+1
  param action : string
  
  var Dialog	: object
  var AppObj	: object
  var text	: string
  
  dialog := self.~
  AppObj := dialog.openedBy
  if AppObj /= void
  	switch action
  	case "Open"
  
  	case "Apply"
  		dialog.dialogApply
  		dialog.setStatisticValues
  
  	case "Close"
  		AppObj.openedDialog := void
  		Dialog.~.deleteObject
  
  	case "openLocation"
  		AppObj.~.openDialog
  
  	case "openOrigin"
  		if AppObj.Origin /= void
  			AppObj.Origin.openDialog
  		end
  
  	case "gotoOrigin"
  		if AppObj.origin/= void
  			AppObj.origin.openDialog
  			dialog.close( false )
  		end
  
  	case "openClass"
  		if AppObj.class /= void
  			AppObj.class.openDialog
  		end
  
  	case "gotoClass"
  		if AppObj.class /= void
  			AppObj.class.openDialog
  			dialog.close( false )
  		end
  
  	case "refresh"
  		Dialog.dialogInit
  
  	case "helpObject"
  		.ApplicationObjects.CranesAndMore.LiftDocumentation.show
  
  	case "helpVersion"
  		var lib : string
  		var vers : string
  		var libPath : string
  		rootfolder.getLibraryInfo( lib, vers, text, libPath )
  		text := to_str( "Plant Simulation ", lib, strChr(10), " Version: ", vers, strChr(10))
  		messageBox( text, 1, 4)
  
  	case "name"
  		?.setCheckBox("Name_inherit", false)
  
  	case "label"
  		?.setCheckBox("label_inherit", false)
  
  	case "LiftLength"
  		?.setCheckBox("LiftLength_inherit", false)
  
  	case "DefaultCarHeight"
  		?.setCheckBox("LiftHeight_inherit", false)
  
  	case "FenceHeight"
  		?.setCheckBox("FenceHeight_inherit", false)
  
  	case "LiftSpeed"
  		?.setCheckBox("Dynamics_of_the_Lift_inherit", false)
  
  	case "CarBayWidth"
  		?.setCheckBox("CarBayWidth_inherit", false)
  
  	case "Dynamics"
  		if dialog.getCheckBox("Dynamics_of_the_Lift_inherit")
  			AppObj.dynamics := true
  		else
  			AppObj.dynamics := false
  		end
  
  	case "LiftAccelerationCheck"
  		if dialog.getCheckbox( "LiftAcc_chk" )
  			Dialog.setSensitive( "LiftAcc_txt", true)
  			Dialog.setSensitive( "LiftAcc_inp", true )
  			Dialog.setSensitive( "LiftAcc_unit", true )
  			Dialog.setSensitive( "LiftDecc_txt", true )
  			Dialog.setSensitive( "LiftDecc_inp", true )
  			Dialog.setSensitive( "LiftDecc_unit", true )
  		else
  			Dialog.setSensitive( "LiftAcc_txt", false)
  			Dialog.setSensitive( "LiftAcc_inp", false )
  			Dialog.setSensitive( "LiftAcc_unit", false )
  			Dialog.setSensitive( "LiftDecc_txt", false )
  			Dialog.setSensitive( "LiftDecc_inp", false )
  			Dialog.setSensitive( "LiftDecc_unit", false )
  		end
  
  	case "LoadBayAccelerationCheck"
  		if dialog.getCheckbox( "LoadBayAcc_chk" )
  			Dialog.setSensitive( "LoadBayAcc_txt", true)
  			Dialog.setSensitive( "LoadBayAcc_inp", true )
  			Dialog.setSensitive( "LoadBayAcc_unit", true )
  			Dialog.setSensitive("LoadBayAcc_inherit", true)
  			Dialog.setSensitive( "LoadBayDecc_txt", true )
  			Dialog.setSensitive( "LoadBayDecc_inp", true )
  			Dialog.setSensitive( "LoadBayDecc_unit", true )
  			Dialog.setSensitive("LoadBayDecc_inherit", true)
  		else
  			Dialog.setSensitive( "LoadBayAcc_txt", false)
  			Dialog.setSensitive( "LoadBayAcc_inp", false )
  			Dialog.setSensitive( "LoadBayAcc_unit", false )
  			Dialog.setSensitive("LoadBayAcc_inherit", false)
  			Dialog.setSensitive( "LoadBayDecc_txt", false )
  			Dialog.setSensitive( "LoadBayDecc_inp", false )
  			Dialog.setSensitive( "LoadBayDecc_unit", false )
  			Dialog.setSensitive("LoadBayDecc_inherit", false)
  		end
  
  	case "CarAccelaration"
  		?.setCheckBox("Dynamics_of_the_Lift_inherit", false)
  
  	case "CarDeceleration"
  		?.setCheckBox("Dynamics_of_the_Lift_inherit", false)
  
  	case "LoadBayAcceleration"
  		?.setCheckBox("LoadBayAcc_inherit", false)
  
  	case "LoadBayDeceleration"
  		?.setCheckBox("LoadBayDecc_inherit", false)
  
  	case "LoadBayCapa"
  		?.setCheckBox("Capacity_inherit", false)
  
  	case "dwellTime"
  		?.setCheckBox("MaximumDwellTime_inherit", false)
  
  	case "baySpeed"
  		?.setCheckBox("ConveyingSpeed_inherit", false)
  
  	case "dampingtime"
  		?.setCheckBox("DampingTime_inherit", false)
  
  	case "driveHome"
  		var flag := dialog.getCheckbox("driveHome_chk")
  		dialog.setSensitive("Homeposition_txt", flag)
  		dialog.setSensitive("Homeposition_inp", flag)
  
  	case "homeposition"
  		--Take preferred Position
  
  	case "trackLength"
  
  	case "side"
  		AppObj.ObjList.openDialogBox
  
  	case "DefineFailures"
  		AppObj.openDialog
  
  	else
  		messageBox( "Unknown dialog action "+action, 1, 1 )
  	end
  end
