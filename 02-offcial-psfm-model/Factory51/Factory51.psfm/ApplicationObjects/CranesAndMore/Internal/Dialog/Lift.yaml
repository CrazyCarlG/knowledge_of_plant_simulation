 Name: dialogApply
 ID: 3222797151
 DataType: method
 Value: |+1
  var dialog	: object
  var AppObj	: object
  
  dialog := self.~
  AppObj := dialog.openedBy
  var AnimatableObject := AppObj._3D.getObject("Car")
  
  if AppObj/=void
  
  	if ?.getCheckBox("Name_inherit")
  		AppObj.inheritAttribute("name")
  		dialog.setCaption("name_inp", AppObj.name)
  	else
  		AppObj.Name := dialog.getValue("Name_inp")
  	end
  
  	if ?.getCheckBox("Label_inherit")
  		AppObj.inheritAttribute("label")
  		dialog.setCaption("label_inp", AppObj.label)
  	else
  		AppObj.label := dialog.getValue("label_inp")
  	end
  
  	if ?.getCheckBox("LiftLength_inherit")
  		AppObj.inheritAttribute("length")
  		dialog.setCaption("LiftLength_inp", to_str(AppObj.Length))
  	else
  		AppObj.Length := str_to_length(dialog.getValue("LiftLength_inp"))
  
  	end
  
  	if ?.getCheckBox("LiftHeight_inherit")
  		AnimatableObject.inheritAttribute("BaseHeight")
  		dialog.setCaption("LiftHeight_inp", to_str(AnimatableObject.BaseHeight))
  	else
  		AnimatableObject.BaseHeight := str_to_length(dialog.getValue("LiftHeight_inp"))
  	end
  
  	if ?.getCheckBox("FenceHeight_inherit")
  		AppObj.inheritAttribute("fenceHeight")
  		dialog.setCaption("fenceHeight_inp", to_str(AppObj.fenceHeight ))
  	else
  		AppObj.fenceHeight := str_to_length(dialog.getValue("fenceheight_inp"))
  	end
  
  	if ?.getCheckBox("CarBayWidth_inherit")
  		AnimatableObject.inheritAttribute("width")
  		dialog.setCaption("CarBayWidth_inp",  to_str( AnimatableObject.Width ))
  	else
  		AnimatableObject.Width :=  str_to_length(dialog.getValue("CarBayWidth_inp"))
  	end
  
  	if ?.getCheckBox("Dynamics_of_the_Lift_inherit")
  		AnimatableObject.inheritAttribute("JointVelocity")
  		dialog.setCaption("LiftSpeed_inp", to_str( num_to_speed(AnimatableObject.JointVelocity)))
  		AnimatableObject.inheritAttribute("JointAcceleration")
  		dialog.setCaption("LiftAcc_inp", to_str( num_to_acceleration(AnimatableObject.JointAcceleration)))
  		AnimatableObject.inheritAttribute("JointDeceleration")
  		dialog.setCaption("LiftDecc_inp", to_str( num_to_acceleration(AnimatableObject.JointDeceleration)))
  		AppObj.AccelerationOn := false
  	else
  		AnimatableObject.JointVelocity := str_to_speed(dialog.getValue("LiftSpeed_inp"))
  		AnimatableObject.JointAcceleration :=  str_to_acceleration(dialog.getValue("LiftAcc_inp"))
  		AnimatableObject.JointDeceleration :=  str_to_acceleration(dialog.getValue("LiftDecc_inp"))
  		AppObj.AccelerationOn := true
  	end
  
  	if ?.getCheckBox("Capacity_inherit")
  		AppObj.inheritAttribute("capacity")
  		dialog.setCaption("Capacity_inp", to_str( AppObj.Capacity))
  	else
  		AppObj.Capacity :=  str_to_num(dialog.getValue("Capacity_inp"))
  	end
  
  	if ?.getCheckBox("ConveyingSpeed_inherit")
  		AppObj.inheritAttribute("speed")
  		dialog.setCaption("ConveyingSpeed_inp", to_str( AppObj.Speed))
  	else
  		AppObj.Speed :=  str_to_speed(dialog.getValue("ConveyingSpeed_inp"))
  	end
  
  	AppObj.AccelerationEnabled := dialog.getCheckbox("LoadBayAcc_chk")
  	if AppObj.AccelerationEnabled
  		if ?.getCheckBox("LoadBayAcc_inherit")
  			AppObj.inheritAttribute("Acceleration")
  			dialog.setCaption("LoadBayAcc_inp", to_str(AppObj.Acceleration))
  		else
  			AppObj.Acceleration :=  str_to_acceleration(dialog.getValue("LoadBayAcc_inp"))
  		end
  		if ?.getCheckBox("LoadBayDecc_inherit")
  			AppObj.inheritAttribute("deceleration")
  			dialog.setCaption("LoadBayDecc_inp", to_str(AppObj.Deceleration))
  		else
  			AppObj.Deceleration :=  str_to_acceleration(dialog.getValue("LoadBayDecc_inp"))
  		end
  	end
  
  	if ?.getCheckBox("DampingTime_inherit")
  		AppObj.inheritAttribute("DampingTime")
  		dialog.setCaption("dampingTime_inp", to_str(AppObj.DampingTime))
  	else
  		AppObj.DampingTime :=  str_to_time(dialog.getValue("dampingTime_inp"))
  	end
  
  	if ?.getCheckBox("MaximumDwellTime_inherit")
  		AppObj.inheritAttribute("MaximumDwellTime")
  		dialog.setCaption("MaximumDwellTime_inp", to_str(AppObj.MaximumDwellTime))
  	else
  		AppObj.MaximumDwellTime :=  str_to_time(dialog.getValue("MaximumDwellTime_inp"))
  	end
  
  	AppObj.DrivingHome := dialog.getCheckbox("driveHome_chk")
  	var str := dialog.getValue("Homeposition_inp")
  	if strLpos(".",str)=1   -- absolute path?
  		AppObj.HomePosition := when existsObject(str) then str_to_obj(str) else void
  	else  -- relative path
  		AppObj.HomePosition := AppObj.~.extendPath(str)
  	end
  
  	AppObj.ParametrizeCar
  end
 ShowInTooltip: false
-
 Name: setStatisticValues
 ID: 3222868957
 DataType: method
 Value: |+1
  /*_________________________________________________________________________________
  Method Tasks:
  set all values of the statistic_tab
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	: APPLY button or dialogInit
  Calls		: none
  ________________________________________________________________________________*/
  var dialog	: object
  var tab		: table
  var csc		: object
  
  dialog := self.~
  csc := Dialog.openedBy
  
  if csc /= void
  	tab.create
  	dialog.setCaption( "working_val",	to_str( round( csc.statWorkingPortion*100, 2 )))
  	dialog.setCaption( "waiting_val",	to_str( round( csc.statWaitingPortion*100, 2 )))
  	dialog.setCaption( "blocked_val",	to_str( round( csc.statBlockingPortion*100, 2 )))
  	dialog.setCaption( "failed_val",	to_str( round( csc.statFailPortion*100, 2 )))
  	dialog.setCaption( "pause_val",		to_str( round( csc.statPausingPortion*100, 2 )))
  	dialog.setCaption( "unplanned_val",	to_str( round( csc.statUnplannedPortion*100, 2 )))
  
  	dialog.setCaption( "VehWaiting_val", "0" )
  	dialog.setCaption( "VehDriving_val", "0" )
  	dialog.setCaption( "VehLoading_val", "0" )
  	dialog.setCaption( "VehTransporting_val", "0" )
  	dialog.setCaption( "VehUnloading_val", "0" )
  	dialog.setCaption( "vehDamping_val", "0")
  	dialog.setCaption( "vehfailed_val", "0")
  
  	csc.state.getStatisticsTable( tab )
  	var DurationColumn:= 5
  
  	for var i := 1 to tab.YDim
  		switch tab[1,i]
  		case "driveto"
  			dialog.setCaption( "VehDriving_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "loading"
  			dialog.setCaption( "VehLoading_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "drivefull"
  			dialog.setCaption( "VehTransporting_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "waiting"
  			dialog.setCaption( "VehWaiting_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "unloading"
  			dialog.setCaption( "VehUnloading_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "damping"
  			dialog.setCaption( "vehDamping_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "failed"
  			dialog.setCaption( "vehfailed_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  		end
  	next
  else
  	dialog.setCaption( "working_val",	"0" )
  	dialog.setCaption( "waiting_val",	"0" )
  	dialog.setCaption( "blocked_val",	"0" )
  	dialog.setCaption( "failed_val",	"0" )
  	dialog.setCaption( "pause_val",		"0" )
  	dialog.setCaption( "unplanned_val",	"0" )
  
  	dialog.setCaption( "VehWaiting_val",		"0" )
  	dialog.setCaption( "VehDriving_val",		"0" )
  	dialog.setCaption( "VehLoading_val",		"0" )
  	dialog.setCaption( "VehTransporting_val",	"0" )
  	dialog.setCaption( "VehUnloading_val",		"0" )
  	dialog.setCaption( "vehDamping_val",		"0")
  	dialog.setCaption( "vehdriveHome_val",		"0")
  	dialog.setCaption( "vehfailed_val",			"0")
  
  end
 ShowInTooltip: false
