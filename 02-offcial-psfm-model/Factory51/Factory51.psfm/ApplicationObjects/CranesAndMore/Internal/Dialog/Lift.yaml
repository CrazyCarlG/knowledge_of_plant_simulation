  if not dialog.getCheckBox("Dynamics_of_the_Lift_inherit")
  	Dialog.setSensitive("LiftSpeed_txt", true)
  	Dialog.setSensitive("LiftSpeed_inp", true)
  	Dialog.setSensitive("LiftSpeed_unit", true)
  	Dialog.setSensitive( "LiftAcc_txt", true)
  	Dialog.setSensitive( "LiftAcc_inp",true )
  	Dialog.setSensitive( "LiftAcc_unit",true )
  	Dialog.setSensitive( "LiftDecc_txt", true )
  	Dialog.setSensitive( "LiftDecc_inp",true )
  	Dialog.setSensitive( "LiftDecc_unit", true )
  end
  
  //TODO: Entfernen vor Release
  Dialog.setCaption( "LiftAcc_inp", to_str( num_to_acceleration(AnimatableObject.JointAcceleration )))
  Dialog.setCaption( "LiftAcc_unit", a_unit )
  AnimatableObject.getAttribute("JointAcceleration", inherit)
  
  //TODO: Entfernen vor Release
  Dialog.setCaption( "LiftDecc_inp", to_str( num_to_acceleration(AnimatableObject.JointDeceleration )))
  Dialog.setCaption( "LiftDecc_unit", a_unit )
  AnimatableObject.getAttribute("JointDeceleration", inherit)
  
  Dialog.setCaption( "Capacity_inp", to_str( AppObj.Capacity ))
  AppObj.getAttribute("capacity", inherit)
  Dialog.setCheckBox("Capacity_inherit", inherit)
  
  Dialog.setCaption("ConveyingSpeed_inp", to_str( AppObj.Speed))
  Dialog.setCaption("ConveyingSpeed_unit", s_unit )
  AppObj.getAttribute("speed", inherit)
  Dialog.setCheckBox("ConveyingSpeed_inherit", inherit)
  
  dialog.setCheckbox( "LoadBayAcc_chk", AppObj.AccelerationEnabled)
  
  Dialog.setSensitive( "LoadBayAcc_txt", AppObj.AccelerationEnabled)
  Dialog.setSensitive( "LoadBayAcc_inp", AppObj.AccelerationEnabled )
  Dialog.setSensitive( "LoadBayAcc_unit", AppObj.AccelerationEnabled )
  Dialog.setSensitive( "LoadBayAcc_inherit", AppObj.AccelerationEnabled )
  Dialog.setSensitive( "LoadBayDecc_txt", AppObj.AccelerationEnabled )
  Dialog.setSensitive( "LoadBayDecc_inp", AppObj.AccelerationEnabled )
  Dialog.setSensitive( "LoadBayDecc_unit", AppObj.AccelerationEnabled )
  Dialog.setSensitive( "LoadBayDecc_inherit", AppObj.AccelerationEnabled)
  
  Dialog.setCaption( "LoadBayAcc_inp", to_str( AppObj.Acceleration ))
  Dialog.setCaption( "LoadBayAcc_unit", a_unit )
  AppObj.getAttribute("acceleration", inherit)
  dialog.setCheckBox("LoadBayAcc_inherit", inherit)
  
  Dialog.setCaption( "LoadBayDecc_inp", to_str( AppObj.Deceleration ))
