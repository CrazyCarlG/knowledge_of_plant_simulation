 Name: driveHome
 ID: 13
 DataType: method
 Value: |+1
  var lift := self.~
  var liftCar := lift._3D.getObject(1)
  lift.state := "drivetohome"
  if lift.HomePosition /= void and lift.DrivingHome
  	var position:length[3] := lift._3D.getPositionOfObject(lift.HomePosition, lift.HomePosition._3D.getMUAnimationPosition(0))
  	var dz := calcDroppedPerpendicularFootPoint([0,0,0], [0,0,1], position).z
  	liftCar.moveTo(dz-liftCar.BaseHeight)
  else
  	liftCar.moveTo(0)
  end
  waituntil Lift._3D.Poses.EndPoseWasReached
  lift.state := "waiting"
