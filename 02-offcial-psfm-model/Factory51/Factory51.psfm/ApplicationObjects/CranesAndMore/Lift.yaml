$CustomAttributes:
-
 Name: DampingTime
 ID: 1
 DataType: time
 Value: 2
 ShowInTooltip: false
-
 Name: OnExit
 ID: 2
 DataType: method
 Value: |+1
  var lift := self.~
  var part := @
  if part.Location = lift
  	var destinationObject: Object
  	// Next destination has to be a (Object with attribute Backwards) conveyor!
  	if part.AutomaticRouting
  		if part.Name = "Transporter"
  			DestinationObject := part.getRoute[1]
  		else
  			destinationObject := part.getRouteIntermediateDestination
  		end
  	else
  		if part.Destination /= void
  			destinationObject := part.Destination
  		else
  			destinationObject := lift.succ
  		end
  	end
  	if destinationObject.InternalClassType = "Conveyor"
  		if destinationObject.Backwards
  			part.move(destinationObject, -1)
  		else
  			part.move(destinationObject, 0)
  		end
  	else
  		part.transfer(destinationObject)
  	end
  elseif part.Location /= lift
  	if lift.FrontMU = part
  		lift.FrontMU := void
  	end
  	lift.ExitLocked := true
  end
 ShowInTooltip: false
-
 Name: OnSensor
 ID: 3
 DataType: method
 Value: |+1
  param SensorID: integer, Front: boolean, BookPos: boolean
  
  if self.~.ExitLocked
  	@.Stopped := true
  end
 ShowInTooltip: false
-
 Name: processPendingTransfers
 ID: 4
 DataType: method
 Value: |+1
  param part:object
  var Lift := self.~
  var LiftCar := lift._3D.getObject(1)
  
  if Lift.FrontMU = void
  	Lift.FrontMU := part
  end
  
  ?.ExitLocked := true
  var sourceObject:object := part.~
  var partPosition:length[3] := Lift._3D.getPositionOfObject(part)
  
  if sourceObject /= Lift.CurrentObject
  	// Move car to the pick position
  	Lift.state := "driveto"
  	LiftCar.moveTo(partPosition.z - LiftCar.Baseheight)
  	waituntil Lift._3D.Poses.EndPoseWasReached
  	Lift.CurrentObject := sourceObject
  	Lift.state := "damping"
  	wait Lift.DampingTime
  end
  Lift.state := "loading"
  //If Parts are loaded from right side
  Lift.Backwards := partPosition.x > 0
  
  var Sensor := Lift.Sensors.ID1
  var x := Sensor.position
  
  if Lift.OccupiedLength + part.length >= Lift.length
  	debug -- Vehicle should be longer than all parts that it has to transport
  end
  
  if Lift.Backwards
  	Sensor.Position := 0
  	part.move(Lift,-1)
  else
  	//Sensor position needs to be set again if part before was unloaded backwards
  	Sensor.position := Lift.length
  	part.move(Lift, 0)
  end
  
  
  waituntil part.RearLocation = ?
  
  if Lift.FrontMU /= void
  	Lift.FrontMU.Stopped := false
  end
  
  
  if not Lift.Full and Lift.MaximumDwellTime > 0
  	var MaxWaitTime:time := Lift.MaximumDwellTime
  	Lift.state := "waiting"
  	waituntil Lift.NewPart wait MaxWaitTime
  	// If there are parts coming from the same source we load more parts
  	if not waitExpired
  		Lift.NewPart := false
  		Lift.FrontMU.Stopped := false
  		return
  	end
  end
  
  ?.EntranceLocked := true
  
  if Lift.Backwards
  	Sensor.Position := (Lift.length - Lift.OccupiedLength)/2
  	Sensor.Rear := true
  	Sensor.Front := false
  else
  	Sensor.Position := Lift.length - (Lift.length - Lift.OccupiedLength)/2
  	Sensor.Rear := false
  	Sensor.Front := true
  end
  
  Lift.FrontMU.Stopped := false
  
  while not Lift.Empty
  	// Check for Deadlock and move car to the drop position
  	var partInLine := Lift.contentsList[1,1]
  	var DestinationObject: Object
  	if partInLine.AutomaticRouting
  		if partInLine.Name = "Transporter"
  			DestinationObject := partInLine.getRoute[1]
  		else
  			DestinationObject := partInLine.getRouteIntermediateDestination
  		end
  	else
  		if partInLine.destination = void
  			if lift.succ = void
  				throwRuntimeError(to_str(self.~)+": No destination for MU defined!")
  			else
  				DestinationObject := lift.succ
  			end
  		else
  			DestinationObject := partInLine.destination
  		end
  	end
  	var dropPosition:length[3] := Lift._3D.getPositionOfObject(DestinationObject, DestinationObject._3d.getMUAnimationPosition(0))
  	//If Conveyor is on the edge x-coordinate is 0.25
  	Lift.Backwards := dropPosition.x <= 0.25
  
  	if Lift.NumMU > 1
  		var lastPart := Lift.contentsList[1,Lift.NumMU]
  		var DestinationObjectLastPart : Object
  		if lastPart.AutomaticRouting
  			DestinationobjectLastPart := lastPart.getRouteIntermediateDestination
  		else
  			if lastPart.destination = void
  				if lift.succ = void
  					throwRuntimeError(to_str(self.~)+": No destination for MU defined!")
  				else
  					DestinationobjectLastPart := lift.succ
  				end
  			else
  				DestinationobjectLastPart := lastPart.destination
  			end
  		end
  		var dropPostionOfLastPart:length[3] := Lift._3D.getPositionOfObject(DestinationobjectLastPart, DestinationobjectLastPart._3d.getMUAnimationPosition(0))
  		//If Conveyor is on the edge x-coordinate is 0.25
  		var BackwardsLastPart := dropPostionOfLastPart.x <= 0.25
  	end
  	if Lift.Backwards and BackwardsLastPart and Lift.NumMU > 1
  		DestinationObject := DestinationobjectLastPart
  		dropPosition := dropPostionOfLastPart
  	end
  
  	if Lift.Backwards and not BackwardsLastPart and Lift.NumMU > 1
  		debug -- This part can't be moved, because other parts are blocking the way.
  	end
  
  	if DestinationObject /= Lift.CurrentObject
  		Lift.state := "drivefull"
  		LiftCar.moveTo(dropPosition.z - LiftCar.Baseheight)
  		waituntil Lift._3D.Poses.EndPoseWasReached
  		Lift.CurrentObject := DestinationObject
  		Lift.state := "damping"
  		wait ?.DampingTime
  	end
  	Lift.state := "unloading"
  
  	Lift.ExitLocked := false
  	Lift.MU(1).Stopped := false
  	waituntil Lift.ExitLocked
  
  end
  
  if Lift.FwBlockListEntry1 = void
  	Lift.driveHome
  else
  	Lift.state := "waiting"
  end
  
  ?.EntranceLocked := false
 ShowInTooltip: false
