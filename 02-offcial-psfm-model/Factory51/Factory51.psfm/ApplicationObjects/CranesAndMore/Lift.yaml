 Name: OnPull
 ID: 19
 DataType: method
 Value: |+1
  var lift  := ?
  var part := @
  
  if lift.state != "waiting" then return end
  
  if part = void then part := lift.FwBlockListEntry1 end
  
  if part = void then return end
  
  if lift.CurrentObject = part.~
  	lift.NewPart := true
  	lift.processPendingTransfers(part)
  elseif lift.empty and lift.FrontMU = void
  	lift.FrontMU := part
  	lift.processPendingTransfers(part)
  end
