 ShowInTooltip: false
-
 Name: Unload
 ID: 2
 DataType: method
 Value: |+1
  param ypos:integer, target:object
  
  var box:object
  
  for var i := 1 to 2
  	box := @[2, ypos].cont
  	box.move(target)
  	stopuntil box.Location /= @
  																
  	box := @[1, ypos].cont
  	box.move(target)
  	stopuntil box.Location /= @
  next
 ShowInTooltip: false
-
 Name: Init
