  	stopuntil not StorageArea.Empty and self.~.Empty
  
  	StorageArea.&removeProductTo.executeNewCallChain(1, @) // Order one part for the object which has the Init control
  		
  	stopuntil self.~.Full
  end
 ShowInTooltip: false
