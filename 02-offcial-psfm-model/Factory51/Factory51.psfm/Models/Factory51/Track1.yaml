 Name: OnSensor
 ID: 1
 DataType: method
 Value: |+1
  param SensorID: integer, Front: boolean
  --Activating the sensor moves the parts from the
  --container to the specified destination
  
  InterArrival2.newArrival
  
  @.stopped := true
  
  var Destination:object := PickAndPlace5
  
  while not @.Empty
  	var mu: object := @.cont
  	if not mu.move(Destination)
  		stopuntil mu.location /= @ and not Destination.isLoading
  	end
  end
  
  @.stopped := false
 ShowInTooltip: false
-
 Name: OnExit
 ID: 2
 DataType: method
 Value: |+1
