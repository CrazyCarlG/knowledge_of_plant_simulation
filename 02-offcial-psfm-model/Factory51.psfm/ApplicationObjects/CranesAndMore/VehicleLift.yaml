 Name: processPendingTransfers
 ID: 3660363566
 DataType: method
 Value: |+1
  param part:object
  
  var LiftTrack := self.~
  var LiftCar := LiftTrack._3D.getObject(1)
  
  if LiftTrack.FrontMU = void
  	LiftTrack.FrontMU := part
  end
  
  ?.ExitLocked := true
  var sourceObject:object := part.~
  var partPosition:length[3] := LiftTrack._3D.getPositionOfObject(part)
  
  if sourceObject /= LiftTrack.CurrentObject
  	// Move car to the pick position
  	LiftTrack.state := "driveto"
  	LiftCar.moveTo(partPosition.z - LiftCar.Baseheight)
  	waituntil LiftTrack._3D.Poses.EndPoseWasReached
  	LiftTrack.CurrentObject := sourceObject
  	LiftTrack.state := "damping"
  	wait LiftTrack.DampingTime
  end
  LiftTrack.state := "loading"
  
  
  if LiftTrack.OccupiedLength + part.length >= LiftTrack.length
  	debug -- Vehicle should be longer than all parts that it has to transport
  end
  
  waituntil not self.~.Failed
  
  part.move(LiftTrack,0)
  
  waituntil part.RearLocation = ?
  
  if LiftTrack.FrontMU /= void
  	LiftTrack.FrontMU.stopped := false
  end
  
  
  if not LiftTrack.Full and LiftTrack.MaximumDwellTime > 0
  	var MaxWaitTime:time := LiftTrack.MaximumDwellTime
  	waituntil LiftTrack.NewPart wait MaxWaitTime
  	// If there are parts coming from the same source we load more parts
  	if not waitExpired
  		LiftTrack.NewPart := false
  		LiftTrack.FrontMU.stopped := false
  		return
  	end
  end
  
  ?.EntranceLocked := true
  
  
  waituntil LiftTrack.FrontMU.TargetPosition = -1.0
  
  LiftTrack.FrontMU.TargetPosition := LiftTrack.length - (LiftTrack.length - LiftTrack.OccupiedLength)/2
  
  LiftTrack.FrontMU.stopped := false
  
  
  while not LiftTrack.Empty
  	// Check for Deadlock and move car to the drop position
  	var partInLine := LiftTrack.contentsList[1,1]
  	var DestinationObject: Object
  	if partInLine.AutomaticRouting and partInLine.destination /= void
  		DestinationObject := partInLine.getRouteIntermediateDestination
  	else
  		if LiftTrack.succ = void
  			throwRuntimeError(to_str(self.~)+": No destination for MU defined!")
  		else
  			DestinationObject := LiftTrack.succ
  		end
  	end
  
  	var aniOffset := when DestinationObject.InternalClassType /= "Marker" then
  	DestinationObject._3d.getMUAnimationPosition(0) else [0,0,0]
  	var dropPosition:length[3] := LiftTrack._3D.getPositionOfObject(DestinationObject, aniOffset) -- Lift._3D.baseheight
  
  	if DestinationObject /= LiftTrack.CurrentObject
  		LiftTrack.state := "drivefull"
  		LiftCar.moveTo(dropPosition.z - LiftCar.Baseheight)
  		waituntil LiftTrack._3D.Poses.EndPoseWasReached
  		LiftTrack.CurrentObject := DestinationObject
  		LiftTrack.state := "damping"
  		wait ?.DampingTime
  	end
  	LiftTrack.state := "unloading"
  
  	waituntil not self.~.Failed
  	LiftTrack.ExitLocked := false
  	LiftTrack.FrontMU.stopped := false
  
  	waituntil LiftTrack.ExitLocked
  
  end
  
  if LiftTrack.FwBlockListEntry1 /= void
  	LiftTrack.state := "waiting"
  	LiftTrack.&OnPull.executeNewCallchain(LiftTrack.FwBlockListEntry1, LiftTrack)
  else
  	LiftTrack.driveHome
  end
  
  ?.EntranceLocked := false
 ShowInTooltip: false
