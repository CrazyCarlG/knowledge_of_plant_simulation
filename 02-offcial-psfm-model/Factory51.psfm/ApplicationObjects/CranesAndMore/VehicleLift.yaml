 Name: ParametrizeCar
 ID: 3660352218
 DataType: method
 Value: |+1
  var lift :=  self.~
  var Car := lift._3D.getObject("Car")
  
  Car.length := lift.Length
  Car.width := lift.width
  
  var LeftFence := lift._3D.getGraphic("Fence", ["Left Fence"])
  var RightFence := lift._3D.getGraphic("Fence", ["Right Fence"])
  //Adjusting Length and Height of Fence
  var fenceArrayLeft := LeftFence.dimensions
  fenceArrayLeft.x := lift.Length
  fenceArrayLeft.z := lift.fenceHeight
  LeftFence.Position.x := lift.Length / 2
  LeftFence.dimensions := fenceArrayLeft
  
  var fenceArrayRight := RightFence.dimensions
  fenceArrayRight.x := lift.Length
  fenceArrayRight.z := lift.fenceHeight
  RightFence.Position.x := lift.Length / 2
  RightFence.dimensions := fenceArrayRight
  
  //Adjusting width of Fence
  lift._3D.getGraphic("Fence", ["Left Fence"]).Position.y := lift._3D.getObject(1).width/2
  lift._3D.getGraphic("Fence", ["Right Fence"]).Position.y := -lift._3D.getObject(1).width/2
 ShowInTooltip: false
