 Name: OnEntrance
 ID: 3660325796
 DataType: method
 Value: |+1
  var LiftTrack := self.~
  if not LiftTrack.full and LiftTrack.MaximumDwellTime > 0
  	LiftTrack.FrontMU.stopped := true
  end
  if LiftTrack.nextPart = @
  	LiftTrack.nextPart := void
  end
 ShowInTooltip: false
-
 Name: OnExit
 ID: 3660329738
 DataType: method
 Value: |+1
  var LiftTrack := self.~
  var part := @
  if part.Location = LiftTrack
  	var destinationObject: Object
  	// Next destination has to be a (Object with attribute Backwards) conveyor!
  	if part.AutomaticRouting and part.destination /= void
  		destinationObject := part.getRouteIntermediateDestination
  	else
  		destinationObject := LiftTrack.succ
  	end
  
  	if DestinationObject.InternalClassType /= "Marker"
  		part.move(destinationObject, 0)
  	else
  		@.move
  	end
  elseif part.Location /= LiftTrack
  	if LiftTrack.FrontMU = part
  		if LiftTrack.cont /= void
  			LiftTrack.FrontMU := LiftTrack.cont
  		else
  			LiftTrack.FrontMU := void
  		end
  	end
  	LiftTrack.ExitLocked := true
  end
 ShowInTooltip: false
-
 Name: OnOpen
 ID: 3660336138
 DataType: method
 Value: "rootfolder.internal.dialog.genDialog"
 ShowInTooltip: false
-
 Name: OnPull
 ID: 3660337608
 DataType: method
 Value: |+1
  var LiftTrack  := ?
  var part := @
  
  if part = void or part /= LiftTrack.FwBlockListEntry1
  	return
  end
  
  if LiftTrack.CurrentObject = part.~
  	LiftTrack.NewPart := true
  	LiftTrack.processPendingTransfers(part)
  elseif LiftTrack.empty and LiftTrack.FrontMU = void
  	LiftTrack.FrontMU := part
  	LiftTrack.processPendingTransfers(part)
  else
  	waituntil LiftTrack.nextPart = void
  	LiftTrack.nextPart := part
  	waituntil LiftTrack.state = "waiting"
  	LiftTrack.processPendingTransfers(part)
  end
 ShowInTooltip: false
