 Name: driveHome
 ID: 3660306518
 DataType: method
 Value: |+1
  var Lift := self.~
  
  Lift.state := "drivetohome"
  if Lift.HomePosition /= void and Lift.DrivingHome
  	var position:length[3] := Lift._3D.getPositionOfObject(Lift.HomePosition, Lift.HomePosition._3D.getMUAnimationPosition(0))
  	var dy := calcDroppedPerpendicularFootPoint([0,0,0], [0,-1,0], position).y
  	Lift._3D.getObject(1).moveTo(dy)
  else
  	Lift._3D.getObject(1).moveTo(0)
  end
  waituntil Lift._3D.Poses.EndPoseWasReached
  Lift.state := "waiting"
 ShowInTooltip: false
