 Name: dialogApply
 ID: 1577988052
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  here we just have to write the table defining the failures back to the CSC
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	: dialog of CSC
  Calls		:
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  here we just have to write the table defining the failures back to the CSC
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	: dialog of CSC
  Calls		:
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  var dialog	: object
  var AppObj	: object
  
  dialog := self.~
  AppObj := dialog.openedBy
  var AnimatableObject := AppObj._3D.getObject("Car")
  
  if AppObj/=void
  	if ?.getCheckBox("Name_inherit") and AppObj.Origin /= void
  		AppObj.inheritAttribute("name")
  		dialog.setCaption("Name_inp", AppObj.name)
  	else
  		AppObj.Name := dialog.getValue("Name_inp")
  	end
  
  	if ?.getCheckBox("label_inherit") and AppObj.Origin /= void
  		AppObj.inheritAttribute("label")
  		dialog.setCaption("label_inp", AppObj.label)
  	else
  		AppObj.label := dialog.getValue("label_inp")
  	end
  
  	if ?.getCheckBox("Lift_Length_inherit") and AppObj.Origin /= void
  		AppObj.inheritAttribute("length")
  		dialog.setCaption("Lift_Length_inp", to_str(AppObj.length))
  	else
  		AppObj.length := str_to_length(dialog.getValue("Lift_Length_inp"))
  	end
  
  
  	if ?.getCheckBox("Fence_Height_inherit") and AppObj.Origin /= void
  		AppObj.inheritAttribute("FenceHeight")
  		dialog.setCaption("Fence_Height_inp", to_str(AppObj.FenceHeight))
  	else
  		AppObj.FenceHeight := str_to_length(dialog.getValue("Fence_Height_inp"))
  	end
  
  	if ?.getCheckBox("Default_Lift_Height_inherit") and AppObj.Origin /= void
  		AnimatableObject.inheritAttribute("BaseHeight")
  		dialog.setCaption("Default_Lift_Height_inp", to_str(AnimatableObject.BaseHeight))
  	else
  		AnimatableObject.BaseHeight := str_to_length(dialog.getValue("Default_Lift_Height_inp"))
  	end
  
  	if ?.getCheckBox("Car_Bay_Width_inherit") and AppObj.Origin /= void
  		AppObj.inheritAttribute("Width")
  		dialog.setCaption("Car_Bay_Width_inp", to_str(AppObj.Width))
  	else
  		AppObj.Width := str_to_length(dialog.getValue("Car_Bay_Width_inp"))
  	end
  
  	if ?.getCheckBox("Dynamics_of_the_Lift_inherit") and AppObj.Origin /= void
  		AnimatableObject.inheritAttribute("JointVelocity")
  		dialog.setCaption("Lift_Speed_inp", to_str(num_to_speed( AnimatableObject.JointVelocity)))
  		AnimatableObject.inheritAttribute("JointAcceleration")
  		dialog.setCaption("Lift_Acceleration_inp", to_str(num_to_acceleration( AnimatableObject.JointAcceleration)))
  		AnimatableObject.inheritAttribute("JointDeceleration")
  		dialog.setCaption("Lift_Deceleration_inp", to_str(num_to_acceleration( AnimatableObject.JointDeceleration)))
  	else
  		AnimatableObject.JointVelocity := str_to_speed(dialog.getValue("Lift_Speed_inp"))
  		AnimatableObject.JointAcceleration := str_to_acceleration(dialog.getValue("Lift_Acceleration_inp"))
  		AnimatableObject.JointDeceleration := str_to_acceleration(dialog.getValue("Lift_Deceleration_inp"))
  	end
  
  
  	if ?.getCheckBox("Capacity_inherit") and AppObj.Origin /= void
  		AppObj.inheritAttribute("Capacity")
  		dialog.setCaption("Capacity_inp", to_str(AppObj.Capacity))
  	else
  		AppObj.Capacity := str_to_num(dialog.getValue("Capacity_inp"))
  	end
  
  	if ?.getCheckBox("Damping_Time_inherit") and AppObj.Origin /= void
  		AppObj.inheritAttribute("DampingTime")
  		dialog.setCaption("Damping_Time_inp", to_str(AppObj.DampingTime))
  	else
  		AppObj.DampingTime := str_to_time(dialog.getValue("Damping_Time_inp"))
  	end
  
  	if ?.getCheckBox("Dwell_Time_inherit") and AppObj.Origin /= void
  		AppObj.inheritAttribute("MaximumDwellTime")
  		dialog.setCaption("Dwell_Time_inp", to_str(AppObj.MaximumDwellTime))
  	else
  		AppObj.MaximumDwellTime := str_to_time(dialog.getValue("Dwell_Time_inp"))
  	end
  
  	AppObj.DrivingHome := dialog.getCheckbox("Take_preferred_position_chk")
  		var str := dialog.getValue("Take_preferred_position_inp")
  		if strLpos(".",str)=1 -- absolute path?
  			AppObj.HomePosition := when existsObject(str) then str_to_obj(str) else void
  		else -- relative path
  			AppObj.HomePosition := AppObj.~.extendPath(str)
  		end
  AppObj.parametrizeCar
  end
 ShowInTooltip: false
-
 Name: setStatisticValues
 ID: 1578009200
 DataType: method
 Value: |+1
  /*_________________________________________________________________________________
  Method Tasks:
  set all values of the statistic_tab
  _________________________________________________________________________________
  Parameters	: none
  ReturnValues: none
  
  Called By	: APPLY button or dialogInit
  Calls		: none
  ________________________________________________________________________________*/
  var dialog	: object
  var tab		: table
  var csc		: object
  
  dialog := self.~
  csc := Dialog.openedBy
  
  if csc /= void
  	tab.create
  	dialog.setCaption( "working_val",	to_str( round( csc.statWorkingPortion*100, 2 )))
  	dialog.setCaption( "waiting_val",	to_str( round( csc.statWaitingPortion*100, 2 )))
  	dialog.setCaption( "blocked_val",	to_str( round( csc.statBlockingPortion*100, 2 )))
  	dialog.setCaption( "failed_val",	to_str( round( csc.statFailPortion*100, 2 )))
  	dialog.setCaption( "pause_val",		to_str( round( csc.statPausingPortion*100, 2 )))
  	dialog.setCaption( "unplanned_val",	to_str( round( csc.statUnplannedPortion*100, 2 )))
  
  	dialog.setCaption( "VehWaiting_val", "0" )
  	dialog.setCaption( "VehDriving_val", "0" )
  	dialog.setCaption( "VehLoading_val", "0" )
  	dialog.setCaption( "VehTransporting_val", "0" )
  	dialog.setCaption( "VehUnloading_val", "0" )
  	dialog.setCaption( "vehDamping_val", "0")
  	dialog.setCaption( "vehfailed_val", "0")
  
  	csc.state.getStatisticsTable( tab )
  	var DurationColumn:= 5
  
  	for var i := 1 to tab.YDim
  		switch tab[1,i]
  		case "driveto"
  			dialog.setCaption( "VehDriving_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "loading"
  			dialog.setCaption( "VehLoading_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "drivefull"
  			dialog.setCaption( "VehTransporting_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "waiting"
  			dialog.setCaption( "VehWaiting_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "unloading"
  			dialog.setCaption( "VehUnloading_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "damping"
  			dialog.setCaption( "vehDamping_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  
  		case "failed"
  			dialog.setCaption( "vehfailed_val", to_str( round( tab[DurationColumn, i ], 2 ) ))
  		end
  	next
  else
  	dialog.setCaption( "working_val",	"0" )
  	dialog.setCaption( "waiting_val",	"0" )
  	dialog.setCaption( "blocked_val",	"0" )
  	dialog.setCaption( "failed_val",	"0" )
  	dialog.setCaption( "pause_val",		"0" )
  	dialog.setCaption( "unplanned_val",	"0" )
  
  	dialog.setCaption( "VehWaiting_val",		"0" )
  	dialog.setCaption( "VehDriving_val",		"0" )
  	dialog.setCaption( "VehLoading_val",		"0" )
  	dialog.setCaption( "VehTransporting_val",	"0" )
  	dialog.setCaption( "VehUnloading_val",		"0" )
  	dialog.setCaption( "vehDamping_val",		"0")
  	dialog.setCaption( "vehdriveHome_val",		"0")
  	dialog.setCaption( "vehfailed_val",			"0")
  
  end
 ShowInTooltip: false
