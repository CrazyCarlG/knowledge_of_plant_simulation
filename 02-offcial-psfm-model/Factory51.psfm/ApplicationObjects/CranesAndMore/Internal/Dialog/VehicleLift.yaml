  Calls		: none
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  
  var dialog := self.~
  var AppObj := dialog.openedBy
  var inherit:boolean
  
  var l : length := 1
  var l_unit := getUnit( l )
  
  var s : speed := 1
  var s_unit := getUnit( s )
  
  var a : acceleration := 1
  var a_unit := getUnit( a )
  
  
  var AnimatableObject := AppObj._3D.getObject("Car")
  
  //set Name and label
  dialog.setCaption( "name_inp", AppObj.name )
  AppObj.getAttribute("name", inherit)
  dialog.setCheckBox("Name_inherit", inherit)
  
  dialog.setCaption( "label_inp", AppObj.label )
  AppObj.getAttribute("label", inherit)
  dialog.setCheckBox("label_inherit", inherit)
  
  //set parameters
  dialog.setCaption( "Lift_Length_inp", to_str(AppObj.length))
  dialog.setCaption( "Lift_Length_unit", l_unit )
  AppObj.getAttribute("length", inherit)
  dialog.setCheckBox("Lift_length_inherit", inherit)
  
  dialog.setCaption( "Fence_Height_inp", to_str(AppObj.FenceHeight))
  dialog.setCaption( "Fence_Height_unit", l_unit )
  AppObj.getAttribute("FenceHeight", inherit)
  dialog.setCheckBox("Fence_Height_inherit", inherit)
  
  dialog.setCaption( "Default_Lift_Height_inp", to_str(AnimatableObject.BaseHeight))
  dialog.setCaption( "Default_Lift_Height_unit", l_unit )
  AnimatableObject.getAttribute("BaseHeight", inherit)
  dialog.setCheckBox("Default_Lift_Height_inherit", inherit)
  
  dialog.setCaption( "Car_Bay_Width_inp", to_str(AppObj.Width))
  dialog.setCaption( "Car_Bay_Width_unit", l_unit )
  AppObj.getAttribute("Width", inherit)
  dialog.setCheckBox("Car_Bay_Width_inherit", inherit)
  
  dialog.setCaption( "Lift_Speed_inp", to_str(num_to_speed(AnimatableObject.JointVelocity )))
  dialog.setCaption( "Lift_Speed_unit", s_unit )
  AnimatableObject.getAttribute("JointVelocity", inherit)
  
  var LiftSpeedInherit := false
  var AccelerationCheckboxInherit := false
  AnimatableObject.getAttribute("JointVelocity", LiftSpeedInherit)
  AppObj.getAttribute("AccelerationOn", AccelerationCheckboxInherit)
  if LiftSpeedInherit and AccelerationCheckboxInherit
  	dialog.setCheckBox("Dynamics_of_the_Lift_inherit", true)
  end
  
  dialog.setCaption("Lift_Acceleration_inp", to_str(num_to_acceleration(AnimatableObject.JointAcceleration)))
  dialog.setCaption("Lift_Acceleration_unit", a_unit)
  
  dialog.setCaption("Lift_Deceleration_inp", to_str(num_to_acceleration(AnimatableObject.JointDeceleration)))
  dialog.setCaption("Lift_Deceleration_unit", a_unit)
  
  dialog.setCaption( "Capacity_inp", to_str(AppObj.Capacity ))
  AppObj.getAttribute("Capacity", inherit)
  dialog.setCheckBox("Capacity_inherit", inherit)
  
  dialog.setCaption( "Damping_Time_inp", to_str( AppObj.DampingTime ))
  AppObj.getAttribute("DampingTime", inherit)
  dialog.setCheckBox("Damping_Time_inherit", inherit)
  
  dialog.setCaption( "Dwell_Time_inp", to_str( AppObj.MaximumDwellTime ))
  AppObj.getAttribute("MaximumDwellTime", inherit)
  dialog.setCheckBox("Dwell_Time_inherit", inherit)
  
  Dialog.setCheckbox( "Take_preferred_position_chk", AppObj.DrivingHome)
  if AppObj.HomePosition=void
  	Dialog.setCaption( "Take_preferred_position_inp", "")
  else
  	Dialog.setCaption( "Take_preferred_position_inp", makePathRelative(AppObj.HomePosition, AppObj.~))
  end
  
  Dialog.setSensitive("Take_preferred_position_txt", AppObj.DrivingHome)
  Dialog.setSensitive("Take_preferred_position_inp", AppObj.DrivingHome)
  
  dialog.setStatisticValues
 ShowInTooltip: false
