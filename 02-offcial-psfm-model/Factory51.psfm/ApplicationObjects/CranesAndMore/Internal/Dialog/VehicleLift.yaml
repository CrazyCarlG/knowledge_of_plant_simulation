 Name: callback
 ID: 1577947132
 DataType: method
 Value: |+1
  /*
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯
  Method Tasks:
  callback of user dialog
  _________________________________________________________________________________
  Parameters	: action, the call back argument
  ReturnValues: none
  
  Called By	: user interaction
  Calls		:
  ¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯¯*/
  param action : string
  
  var Dialog	: object
  var AppObj	: object
  var text	: string
  
  dialog := self.~
  AppObj := dialog.openedBy
  
  if AppObj /= void
  	switch action
  	case "Open"
  		dialog.dialogInit
  
  	case "Apply"
  		dialog.dialogApply
  		dialog.setStatisticValues
  
  	case "Close"
  		AppObj.openedDialog := void
  		Dialog.~.deleteObject
  
  	case "openLocation"
  		AppObj.~.openDialog
  
  	case "openOrigin"
  		if AppObj.Origin /= void
  			AppObj.Origin.openDialog
  		end
  
  	case "gotoOrigin"
  		if AppObj.origin/= void
  			AppObj.origin.openDialog
  			dialog.close( false )
  		end
  
  	case "openClass"
  		if AppObj.class /= void
  			AppObj.class.openDialog
  		end
  
  	case "gotoClass"
  		if AppObj.class /= void
  			AppObj.class.openDialog
  			dialog.close( false )
  		end
  
  	case "refresh"
  		Dialog.dialogInit
  
  	case "helpObject"
  		.ApplicationObjects.CranesAndMore.VehicleLiftDocumentation.show
  
  	case "helpVersion"
  		var lib : string
  		var vers : string
  		var libPath : string
  		rootfolder.getLibraryInfo( lib, vers, text, libPath )
  		text := to_str( "Plant Simulation ", lib, strChr(10), " Version: ", vers, strChr(10))
  		messageBox( text, 1, 4)
  
  //--------------------------------------------------------------------------------
  // name and label of the object
  
  	case "Name"
  		?.setCheckBox("Name_inherit", false)
  
  	case "label"
  		?.setCheckBox("label_inherit", false)
  
  //--------------------------------------------------------------------------------
  // parameter of the Vehicle_Lift
  
  	case "Lift_Length"
  		?.setCheckBox("Lift_Length_inherit", false)
  
  	case "Fence_Height"
  		?.setCheckBox("Fence_Height_inherit", false)
  
  	case "Default_Lift_Height"
  		?.setCheckBox("Default_Lift_Height_inherit", false)
  
  	case "Car_Bay_Width"
  		?.setCheckBox("Car_Bay_Width_inherit", false)
  
  	case "Lift_Speed"
  		?.setCheckBox("Dynamics_of_the_Lift_inherit", false)
  
  	case "Lift_Acceleration"
  		?.setCheckBox("Dynamics_of_the_Lift_inherit", false)
  
  	case "Lift_Deceleration"
  		?.setCheckBox("Dynamics_of_the_Lift_inherit", false)
  
  	case "Capacity"
  		?.setCheckBox("Capacity_inherit", false)
  
  	case "Damping_Time"
  		?.setCheckBox("Damping_Time_inherit", false)
  
  	case "Dwell_Time"
  		?.setCheckBox("Dwell_Time_inherit", false)
  
  
  	case "Take_preferred_position_Active"
  		var flag := dialog.getCheckbox("Take_preferred_position_chk")
  		dialog.setSensitive("Take_preferred_position_txt", flag)
  		dialog.setSensitive("Take_preferred_position_inp", flag)
  
  	case "homeposition"
  		--Take preferred Position
  
  	case "trackLength"
  
  	case "side"
  		AppObj.ObjList.openDialogBox
  
  	case "DefineFailures"
  		AppObj.openDialog
  
  	// statistic tab
  
  	case "showStatistics"
  	dialog.StatisticsTab.openDialogBox
  
  	else
  		messageBox( "Unknown dialog action "+action, 1, 1 )
  	end
  end
