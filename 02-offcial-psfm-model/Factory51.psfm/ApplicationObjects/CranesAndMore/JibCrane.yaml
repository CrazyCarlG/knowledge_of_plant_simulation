$CustomAttributes:
-
 Name: OnPull
 ID: 422081195
 DataType: method
 Value: |+1
  var mu = ?.FwBlockListEntry1
  
  if mu /= void
  	?.EnforceProcessing = true
  	var arm     = self.~._3D.getObject("Arm")
  	var slider  = arm.getObject("Slider")
  	var gripper = slider.getObject("Gripper")
  	var poses   = self.~._3D.Poses
  
  	// Move Arm
  	arm.moveToMU(mu)
  	waituntil poses.EndPoseWasReached
  
  	// Move Slider
  	slider.moveToMU(mu)
  	waituntil poses.EndPoseWasReached
  
  	// Move Gripper
  	gripper.moveToCoordinate(gripper.getPositionOfObject(mu, [0,0,mu.MUHeight]))
  	waituntil poses.EndPoseWasReached
  
  	mu.move(?,0)
  	?.EnforceProcessing = false
  end
 ShowInTooltip: false
-
 Name: OnEntrance
 ID: 3595346202
 DataType: method
 Value: |+1
  ?.EntranceLocked = true
  ?.EnforceProcessing = true
  
  var part := @
  var destObj = ?.succ
  var arm     = self.~._3D.getObject("Arm")
  var slider  = arm.getObject("Slider")
  var gripper = slider.getObject("Gripper")
  var destPos = destObj._3D.getMUAnimationPosition
  var poses   = self.~._3D.Poses
  
  destPos.z += @.MUHeight
  
  // Move Gripper to turn height
  gripper.moveTo(?.TurnHeight)
  waituntil poses.EndPoseWasReached
  
  // Move Arm
  arm.moveToMUAnimationPosition(part, destObj)
  waituntil poses.EndPoseWasReached
  
  // Move Slider
  slider.moveToMUAnimationPosition(part, destObj)
  waituntil poses.EndPoseWasReached
  
  // Move Gripper
  gripper.moveToMUAnimationPosition(part, destObj)
  waituntil poses.EndPoseWasReached
  
  @.move(destObj)
  
  // Move Gripper to turn height
  gripper.moveTo(?.TurnHeight)
  waituntil poses.EndPoseWasReached
  
  // If no MU is in block list we turn to default orientation
  if ?.FwBlockListEntry1 = void
  	arm.moveTo(0.0)
  	waituntil poses.EndPoseWasReached
  end
  
  ?.EnforceProcessing = false
  ?.EntranceLocked = false
 ShowInTooltip: false
-
 Name: TurnHeight
 ID: 2730858136
 DataType: length
 Value: -0.5
 ShowInTooltip: false
