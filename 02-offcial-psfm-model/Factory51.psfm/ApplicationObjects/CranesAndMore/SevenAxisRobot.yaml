 Name: OnPull
 ID: 2144613936
 DataType: method
 Value: |+1
  var robot  := ?
  var part := @
  
  if part = void or part /= robot.FwBlockListEntry1
  	return
  end
  
  if robot.Cont = void and robot.NewPart = false
  	robot.NewPart := true
  	robot.processPendingTransfers(part)
  else
  	waituntil robot.state = "waiting"
  	robot.nextPart := part
  	robot.processPendingTransfers(part)
  end
