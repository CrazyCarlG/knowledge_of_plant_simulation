$CustomAttributes:
-
 Name: processPendingTransfers
 ID: 3252787074
 DataType: method
 Value: |+1
  param part:object
  var Robot := self.~
  var Poses := Robot._3D.Poses
  var RobotBase := Robot._3D.getObject(1)
  
  Robot.ExitLocked := true
  var sourceObject:object := part.~
  var partPosition:length[3] := Robot._3D.getPositionOfObject(part)
  // Drive to Source Object
  if sourceObject /= void
  	// Move car to the pick position
  	Robot.state := "driveto"
  	var dx := calcDroppedPerpendicularFootPoint([0,0,0], [-1,0,0], partPosition).x
  	// If pickPosition is not perpendicular to the Rails, move to the beginning of the Rails or to the end of them
  	// Else move to the perpendicular Position relatively to the Part
  	if dx < 0
  		RobotBase.moveTo(0)
  	elseif dx > Robot.RailLength
  		RobotBase.moveTo(Robot.RailLength)
  	else
  		RobotBase.moveTo(dx)
  	end
  	waituntil Poses.EndPoseWasReached
  	Robot.CurrentObject := sourceObject
  	Robot.state := "damping"
  	wait Robot.DampingTime
  end
  
  Robot.state := "loading"
  Poses.moveToMU(part)
  waituntil Poses.EndPoseWasReached
  waituntil not self.~.Failed
  part.move(Robot,0)
  waituntil part.RearLocation = Robot
  
  while not Robot.Empty
  	//Move Robot to Destination
  	Robot._3D.Poses.moveTo("Default")
  	waituntil Poses.EndPoseWasReached
  	Robot.state := "drivefull"
  	var DestinationObject: Object
  	if Robot.cont.Destination = void
  		if robot.succ = void
  			throwRuntimeError(to_str(self.~)+": No destination for MU defined!")
  		else
  			DestinationObject := robot.succ
  		end
  	else
  		if Robot.cont.AutomaticRouting
  			DestinationObject := Robot.cont.getRouteIntermediateDestination
  		else
  			DestinationObject := Robot.cont.Destination
  		end
  	end
  
  	var dropPosition:length[3]
  	if DestinationObject._3D.hasAttribute("BaseHeight")
  		dropPosition := Robot._3D.getPositionOfObject(DestinationObject, DestinationObject._3D.getMUAnimationPosition(-part.MULength * part.BookPntLRelative))
  	else
  		dropPosition := .ApplicationObjects.CranesAndMore.Internal.Methods.getTargetPosition(Robot,DestinationObject)
  	end
  
  	dropPosition[3] := dropPosition[3] + part.MUHeight
  	// Move car to the drop position
  	if DestinationObject /= Robot.CurrentObject
  		dx := calcDroppedPerpendicularFootPoint([0,0,0], [-1,0,0], dropPosition).x
  		if dx > Robot.RailLength
  			RobotBase.moveTo(Robot.RailLength - 1.1m)
  		elseif dx < 0
  			RobotBase.moveTo(0)
  		else
  			RobotBase.moveTo(dx)
  		end
  		waituntil Poses.EndPoseWasReached
  		Robot.CurrentObject := DestinationObject
  		Robot.state := "damping"
  		wait ?.DampingTime
  		// Check whether destination might not receivable
  		if DestinationObject.full or DestinationObject.failed or DestinationObject.pause
  			Robot.state := "blocked"
  			//First condition checks if there is empty space to place MU
  			waituntil Destinationobject.numMu < DestinationObject.StatMaxNumMu and not DestinationObject.failed and not DestinationObject.pause
  		end
  		Robot.state := "unloading"
  		Poses.moveToMUAnimationPosition(part, DestinationObject)
  		waituntil Poses.EndPoseWasReached
  	end
  	Robot.ExitLocked := false
  	if not part.move(DestinationObject)
  		Robot.state := "blocked"
  		waituntil part.location /= Robot
  		Robot.state := "unloading"
  	end
  
  	if Robot.Empty
  		Robot._3D.Poses.moveTo("Default")
  		waituntil Poses.EndPoseWasReached
  	end
  end
  
  if Robot.FwBlockListEntry1 /= void
  	//To trigger OnPull for the next part, status needs to be set to waiting
  	Robot.state := "waiting"
  	Robot.&OnPull.executeNewCallchain(Robot.FwBlockListEntry1, Robot) // Process parts waiting in the forward blocking list
  elseif Robot.HomePosition /= void
  	var HomePositionRobot:length[3]
  	if Robot.HomePosition._3D.hasAttribute("BaseHeight")
  		HomePositionRobot := Robot._3D.getPositionOfObject(Robot.HomePosition, Robot.HomePosition._3D.getMUAnimationPosition(-part.MULength * part.BookPntLRelative))
  	else
  		HomePositionRobot := rootFolder.Internal.Methods.getTargetPosition(Robot,Robot.HomePosition)
  	end
  	if Robot.HomePosition /= Robot.CurrentObject
  		dx := calcDroppedPerpendicularFootPoint([0,0,0], [-1,0,0], HomePositionRobot).x
  		RobotBase.moveTo(dx)
  		waituntil Poses.EndPoseWasReached
  		Robot.CurrentObject := DestinationObject
  		Robot.state := "waiting"
  	end
  else
  	Robot.nextPart := void
  	Robot.driveHome
  end
