 Name: setLights
 ID: 2543352303
 DataType: method
 Value: |+1
  
  --@Deprecated
  
  param state:String
  var Robot := self.~
  
  switch state
  case "Working"
  	//reset Lights
  	Robot._3D.getGraphic("StateLights", [4]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	Robot._3D.getGraphic("StateLights", [3]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	//set new Light
  	Robot._3D.getGraphic("StateLights", [2]).MaterialDiffuseColor := makeRGBValue(0, 255, 0)
  case "Waiting"
  	Robot._3D.getGraphic("StateLights", [4]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	Robot._3D.getGraphic("StateLights", [2]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	Robot._3D.getGraphic("StateLights", [3]).MaterialDiffuseColor := makeRGBValue(255, 255, 0)
  case "failed"
  	Robot._3D.getGraphic("StateLights", [2]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	Robot._3D.getGraphic("StateLights", [3]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	Robot._3D.getGraphic("StateLights", [4]).MaterialDiffuseColor := makeRGBValue(255, 0, 0)
  case "blocked"
  	Robot._3D.getGraphic("StateLights", [4]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	Robot._3D.getGraphic("StateLights", [2]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	Robot._3D.getGraphic("StateLights", [3]).MaterialDiffuseColor := makeRGBValue(255, 255, 0)
  else
  	Robot._3D.getGraphic("StateLights", [4]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	Robot._3D.getGraphic("StateLights", [3]).MaterialDiffuseColor := makeRGBValue(255, 255, 233)
  	Robot._3D.getGraphic("StateLights", [2]).MaterialDiffuseColor := makeRGBValue(0, 255, 0)
  end
