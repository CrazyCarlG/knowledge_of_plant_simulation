Program: |+1
 // Method Tasks:
 // check if the defined storage box is free
 //--------------------------------------------------------------------------------
 
 param RackLane: object, Side: string, Column, Row: integer -> boolean
 
 if Side ~= "left"
 	return Racklane.OccupancyLeft[Column, Row] = 0
 else
 	return Racklane.OccupancyRight[Column, Row] = 0
 end
