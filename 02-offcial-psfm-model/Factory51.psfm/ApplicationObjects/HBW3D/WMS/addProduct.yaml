Program: |+1
 // Method Tasks:
 // add the product and the number of parts to table Content
 
 Param product : string, Quantity : integer
 
 
 var stock := Content
 
 var row : integer := stock.getRowNo(Product)
 
 if row<=0 then
 	row := Stock.YDim+1
 	Stock[0,row] := product
 	Stock[1,row] := Quantity
 	
 else
 	Stock[1,row] += Quantity
 end
