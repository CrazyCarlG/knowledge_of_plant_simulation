$CustomAttributes:
-
 Name: Init
 ID: 1
 DataType: method
 Value: |+1
  self.~.Refill := false
  
  while not @.Full
  	self.Location.PaletteType.create(@)
  end
  
  self.Location.&RemoveParts.executeNewCallChain // We create new call chain since RemoveParts runs forever and we want to continue below
  
  // Every six hours we get a delivery of palettes.
  while true
  	PalDeliveryInterval.rollDice
  	wait PalDeliveryInterval
  
  	stopuntil SmallCrane.Portal1.state="idle"
  
  	self.~.Refill := true
  	for var i := 1 to 300
  		self.Location.PaletteType.create(@)
  	next
  	self.~.Refill := false
  end
 ShowInTooltip: false
-
 Name: PaletteType
 ID: 2
 DataType: object
 Value: d98bd3d8-2aae-4c21-87a0-674a48c092b5
 ShowInTooltip: false
-
 Name: removeParts
 ID: 3
 DataType: method
 Value: |+1
  var store:object := self.Location
  var Portal : object := SmallCrane.Portal1
  
  while true
  	waituntil portal.state="idle" and not store.Empty
  	wait 1 // Store might be refilled so wait assures that Crane doesn't get an order for a palette which is no longer at top after refill
  	stopuntil not self.~.Refill
  	Portal.TransferMU(self.~.Cont, UpperStoreExit)
  end
 ShowInTooltip: false
-
 Name: Refill
 ID: 4
 DataType: boolean
 Value: false
 ShowInTooltip: false
